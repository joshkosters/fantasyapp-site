<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1D1F">
<title>College Football 27 · MAC Dynasty</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Graduate&family=Inter:wght@300;400;500;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --y:#FFE14F; --yd:#E9C62E; --navy:#333539; --ice:#F1F1F2;
  --bg:#18191B; --rail:#131314; --side:#1F2022; --panel:#27292C; --panel2:#323438; --panel3:#424449;
  --line:rgba(241,241,242,.07); --line2:rgba(241,241,242,.13);
  --text:#F1F1F2; --mute:#A9ACB2; --dim:#72767E;
  --win:#36C77E; --loss:#EF5350; --draw:#9699A0;
  --r:16px; --r2:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:#0F0F10;color:var(--text);font-family:Poppins,system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{display:block}
img{display:block}
.mute{color:var(--mute)} .dim{color:var(--dim)} .y{color:var(--y)} .win{color:var(--win)} .loss{color:var(--loss)}

/* ---------- SHELL ---------- */
.mc.cp .tm span{font-size:11.5px}.mc.cp .sc{font-size:19px;min-width:54px}
.app{display:grid;grid-template-columns:72px 230px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--rail) 72px,var(--side) 72px 302px,var(--bg) 302px)}
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 0;position:sticky;top:0;height:100vh;border-right:1px solid var(--line)}
.rail .rb{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:2px solid transparent;transition:.15s;position:relative}
.rail .rb img{width:30px;height:30px;object-fit:contain}
.rail .rb:hover{background:var(--panel2)}
.rail .rb.on{border-color:var(--y);background:var(--panel2)}
.rail .rb .badge{width:30px;height:30px;font-size:8px}
.rail .rb.add{color:var(--mute);font-size:22px;font-weight:400}
.rail .sep{width:28px;height:1px;background:var(--line2);margin:2px 0}
.rail .rb[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:54px;top:50%;transform:translateY(-50%);background:var(--panel3);padding:5px 9px;border-radius:8px;font-size:12px;font-weight:600;white-space:nowrap;z-index:5}
.side{background:var(--side);padding:26px 18px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid var(--line)}
.brand .wm{font:400 19px/1.05 Graduate,serif;color:var(--ice);-webkit-text-stroke:.9px var(--ice);paint-order:stroke fill;letter-spacing:.3px}
.brand .wm b{font-weight:400;color:var(--y);-webkit-text-stroke-color:var(--y)}
.brand small{display:block;color:var(--mute);font-size:12px;margin-top:6px;font-weight:500}
.snav{margin-top:34px;display:flex;flex-direction:column;gap:3px;margin-left:-18px;margin-right:-18px}
.snav a{display:flex;align-items:center;gap:14px;padding:11px 22px;font-weight:500;color:var(--mute);position:relative;transition:.12s}
.snav a svg{width:19px;height:19px}
.snav a:hover{color:var(--text);background:rgba(241,241,242,.03)}
.snav a.on{color:var(--text);background:linear-gradient(90deg,rgba(255,225,79,.13),rgba(255,225,79,.02));font-weight:600}
.snav a.on svg{color:var(--y)}
.snav a.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--y)}
.snav .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--y);color:var(--navy);font-size:11px;font-weight:700;display:grid;place-items:center}
.promo{margin-top:auto;border-radius:14px;padding:16px;background:radial-gradient(160px 120px at 100% 0%,rgba(255,225,79,.35),transparent 70%),linear-gradient(160deg,#4E5156,#323438);border:1px solid rgba(255,225,79,.2)}
.promo b{display:block;font-weight:600;font-size:13.5px;line-height:1.35}
.promo p{color:var(--mute);font-size:12px;margin-top:4px;line-height:1.4}
.promo .pbtn{margin-top:12px;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.promo .pbtn i{width:20px;height:20px;border-radius:50%;background:var(--y);color:var(--navy);display:grid;place-items:center;font-style:normal;font-size:11px}
.mainwrap{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;padding:26px 30px 6px}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.top .sub{color:var(--mute);font-size:12.5px;margin-top:2px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:16px}
.uchip{display:flex;align-items:center;gap:10px;padding:4px 4px 4px 4px;border-radius:12px}
.uchip .av{width:38px;height:38px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;overflow:hidden;border:2px solid var(--panel3)}
.uchip .av img{width:28px;height:28px;object-fit:contain}
.uchip b{display:block;font-weight:600;font-size:13.5px}
.uchip small{display:block;color:var(--mute);font-size:11.5px}
.uchip select{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:8px;font:600 12px Poppins;padding:3px 6px;margin-top:2px}
.bell{position:relative;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--mute)}
.bell:hover{color:var(--text);background:var(--panel)}
.bell svg{width:20px;height:20px}
.bell .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--loss);box-shadow:0 0 0 2px var(--bg)}
.burger{display:none;width:40px;height:40px;border-radius:10px;place-items:center;background:var(--panel)}
.burger svg{width:20px;height:20px}
main{padding:18px 30px 40px;min-width:0}
.banner{margin:12px 30px 0;border-radius:12px;background:rgba(255,225,79,.08);border:1px solid rgba(255,225,79,.3);color:var(--y);font-size:12.5px;font-weight:500;padding:9px 12px 9px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner button{font-size:12px;font-weight:600;border:1px solid var(--y);border-radius:8px;padding:4px 10px}
.bottomnav{display:none}

/* ---------- GRID ---------- */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.stack{display:grid;gap:20px;align-content:start;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sh h2,.sh h3{font-size:16px;font-weight:600}
.sh a,.sh .va{font-size:12px;color:var(--text);display:flex;align-items:center;gap:4px;font-weight:500}
.sh a svg{width:14px;height:14px}
.ptitle{margin:2px 0 18px}
.ptitle h2{font-size:24px;font-weight:700}
.ptitle p{color:var(--mute);font-size:13px;margin-top:2px}

/* ---------- PANELS ---------- */
.panel{background:var(--panel);border-radius:var(--r);border:1px solid var(--line);padding:18px}
.panel.flat{padding:0;overflow:hidden}
.panel .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 12px}
.panel .ph h3{font-size:15px;font-weight:600}
.sub2{background:var(--panel2);border-radius:var(--r2);border:1px solid var(--line)}
.empty{color:var(--mute);text-align:center;padding:26px 12px;line-height:1.5;font-size:13px}
.empty b{display:block;color:var(--text);font-size:15px;font-weight:600;margin-bottom:4px}

/* ---------- HERO ---------- */
.hero{position:relative;border-radius:var(--r);overflow:hidden;min-height:228px;padding:30px 30px 26px;display:flex;flex-direction:column;justify-content:center;
  background:linear-gradient(110deg,#303235 0%,#3E4045 45%,#585B62 100%);border:1px solid rgba(255,225,79,.12)}
.hero::before{content:"";position:absolute;right:-60px;top:-40px;width:360px;height:360px;background:linear-gradient(135deg,rgba(255,225,79,.35),rgba(255,225,79,0) 60%);transform:rotate(20deg);border-radius:40px}
.hero::after{content:"";position:absolute;right:120px;bottom:-120px;width:260px;height:260px;background:linear-gradient(135deg,rgba(241,241,242,.07),transparent 70%);transform:rotate(35deg);border-radius:30px}
.hero .hc{position:relative;z-index:2;max-width:56%}
.hero .kick{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--y);background:rgba(255,225,79,.12);border-radius:20px;padding:4px 10px;margin-bottom:12px}
.hero h2{font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.hero .meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:12px;color:rgba(241,241,242,.8);font-size:12.5px}
.hero .meta span{display:flex;align-items:center;gap:7px}
.hero .meta svg{width:15px;height:15px}
.hero .cta{margin-top:18px}
.hero .logos{position:absolute;right:34px;top:50%;transform:translateY(-50%);z-index:1;display:flex;align-items:center}
.hero .logos img,.hero .logos .badge{width:132px;height:132px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))}
.hero .logos .l2{margin-left:-30px}
.hero .dots{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
.hero .dots button{width:7px;height:7px;border-radius:4px;background:rgba(241,241,242,.35);transition:.2s}
.hero .dots button.on{width:20px;background:var(--y)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:13px;padding:10px 16px;border-radius:10px;background:var(--y);color:var(--navy);transition:filter .15s, transform .1s;white-space:nowrap}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line2)}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:9px}
.btn .arr{width:20px;height:20px;border-radius:50%;background:var(--navy);color:var(--y);display:grid;place-items:center;margin-right:-4px}
.btn .arr svg{width:12px;height:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;background:var(--y);color:var(--navy)}
.pill.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line2)}
select.pill{appearance:none;-webkit-appearance:none;border:0;padding-right:28px;font-family:Poppins;cursor:pointer;
  background:var(--y) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%23192853' stroke-width='1.8' fill='none'/></svg>") no-repeat right 11px center}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--panel3);color:var(--mute);letter-spacing:.02em}
.tag.live{background:rgba(54,199,126,.15);color:var(--win)}
.tag.live::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--win)}
.tag.y{background:rgba(255,225,79,.14);color:var(--y)}
.tag.final{background:rgba(241,241,242,.08);color:var(--mute)}
.who{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;color:var(--navy);background:var(--y);padding:1px 7px;border-radius:5px;line-height:1.6}
.who.alt{background:var(--panel3);color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:9px;background:var(--panel);border:1px solid var(--line2);font-size:12.5px;font-weight:500;color:var(--mute);white-space:nowrap}
.chip img{width:18px;height:18px;object-fit:contain}
.chip.on{background:var(--y);color:var(--navy);border-color:var(--y);font-weight:600}
.chip svg{width:14px;height:14px}

/* logos */
.logo{width:36px;height:36px;object-fit:contain;flex:none}
.logo.xs{width:20px;height:20px}.logo.sm{width:26px;height:26px}.logo.md{width:46px;height:46px}.logo.lg{width:64px;height:64px}.logo.xl{width:150px;height:150px}
.badge{--c1:#333;--c2:#999;width:36px;height:36px;flex:none;border-radius:50%;background:var(--c1);color:#fff;display:grid;place-items:center;font-weight:700;font-size:10px;letter-spacing:-.02em;box-shadow:inset 0 0 0 3px var(--c2)}
.badge.xs{width:20px;height:20px;font-size:6px;box-shadow:inset 0 0 0 1.5px var(--c2)}
.badge.sm{width:26px;height:26px;font-size:7.5px;box-shadow:inset 0 0 0 2px var(--c2)}
.badge.md{width:46px;height:46px;font-size:12px}
.badge.lg{width:64px;height:64px;font-size:16px;box-shadow:inset 0 0 0 4px var(--c2)}
.badge.xl{width:150px;height:150px;font-size:36px;box-shadow:inset 0 0 0 8px var(--c2)}

/* ---------- MATCH CARDS ---------- */
.mc{background:var(--panel2);border-radius:var(--r2);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
.mc.marquee{border-color:rgba(255,225,79,.4);background:linear-gradient(180deg,rgba(255,225,79,.06),transparent 60%),var(--panel2)}
.mc .mh{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mute);font-weight:500}
.mc .mr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.mc .tm{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0}
.mc .tm span{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mc .sc{font-size:22px;font-weight:700;letter-spacing:.02em;text-align:center;min-width:66px}
.mc .sc small{display:block;font-size:10px;color:var(--mute);font-weight:500;letter-spacing:0}
.mc .sc .l{opacity:.45}
.mc .mf{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:9px;font-size:11.5px}
.mc .mf .c{display:flex;align-items:center;gap:6px;min-width:0}
.mc .mf .rec{color:var(--mute);white-space:nowrap}.mc.cp .mf .rec{display:none}

/* live card */
.livec{display:flex;flex-direction:column;justify-content:space-between;height:100%}
.livec .lh{display:flex;justify-content:space-between;align-items:flex-start}
.livec .lh b{display:block;font-size:13px;font-weight:600}
.livec .lh small{color:var(--mute);font-size:11.5px}
.livec .lr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:16px 0}
.livec .lr .tm{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;text-align:center}
.livec .lr .big{font-size:30px;font-weight:700}
.livec .lf{display:flex;justify-content:space-between;align-items:center}
.livec .lf a{display:flex;align-items:center;gap:4px;font-weight:600;font-size:12.5px}
.livec .lf svg{width:14px;height:14px}

/* ---------- TABLE ---------- */
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:500;color:var(--mute);text-align:left;padding:10px 12px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td{padding:10px 12px;font-weight:500;white-space:nowrap;font-size:13px}
tbody tr{border-top:1px solid var(--line)}
tbody tr:nth-child(odd){background:rgba(241,241,242,.018)}
td.n,th.n{text-align:center;font-variant-numeric:tabular-nums}
td.b{font-weight:700}
tr.user td:first-child{box-shadow:inset 3px 0 0 var(--y)}
tr.me{background:rgba(255,225,79,.07)!important}
.tc{display:flex;align-items:center;gap:10px}
.tc .nm{font-weight:600;text-transform:uppercase;font-size:12.5px;letter-spacing:.01em}
.pos{display:flex;align-items:center;gap:6px;font-weight:600}
.pos svg{width:11px;height:11px}
.form{display:flex;gap:4px}
.form i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;color:#fff}
.form i.W{background:var(--win)} .form i.L{background:var(--loss)} .form i.N{background:var(--panel3);color:var(--dim)}
.scroll{overflow-x:auto}

/* ---------- LISTS (right column) ---------- */
.lcard{background:var(--panel);border-radius:var(--r);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s}
.lcard:hover{border-color:var(--line2)}
.lcard.me{border-color:rgba(255,225,79,.45)}
.lcard .lt{display:flex;align-items:center;gap:11px}
.lcard .lt .av{width:42px;height:42px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;position:relative;flex:none}
.lcard .lt .av .badge,.lcard .lt .av img{width:30px;height:30px}
.lcard .lt b{display:block;font-size:13.5px;font-weight:600}
.lcard .lt small{display:block;color:var(--mute);font-size:11.5px}
.lcard .lt .when{margin-left:auto;text-align:right}
.lcard .lb{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--mute)}
.lcard .lb b{color:var(--text);font-weight:600}
.lcard .lb .ic{display:flex;gap:6px}
.lcard .lb .ic span{width:22px;height:22px;border-radius:50%;background:var(--panel2);display:grid;place-items:center}
.lcard .lb .ic span img{width:15px;height:15px}
.lcard .lb .ic span.W{background:rgba(54,199,126,.2)} .lcard .lb .ic span.L{background:rgba(239,83,80,.2)}

.top1{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.top1 .feat{position:relative;margin:12px;border-radius:12px;padding:18px 16px;min-height:118px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;
  background:radial-gradient(180px 140px at 85% 30%,color-mix(in srgb,var(--tc) 70%,transparent),transparent 75%),linear-gradient(135deg,#4E5156,#303235)}
.top1 .feat img.bg,.top1 .feat .badge.bg{position:absolute;right:12px;top:12px;width:84px;height:84px;opacity:.95}
.top1 .feat b{font-size:16px;font-weight:700;position:relative}
.top1 .feat small{color:rgba(241,241,242,.8);font-size:12px;position:relative}
.top1 .feat .stat{font-size:12.5px;font-weight:600;color:var(--y);margin-top:2px;position:relative}
.top1 .row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px}
.top1 .row .nm{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top1 .row .v{font-weight:600}
.top1 .row.hl{background:var(--panel2)}

/* ---------- WEEK NAV ---------- */
.wknav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wknav .arrow{width:34px;height:34px;border-radius:9px;background:var(--panel);border:1px solid var(--line2);display:grid;place-items:center}
.wknav .arrow svg{width:16px;height:16px}
.wknav .arrow:disabled{opacity:.35}
.wkstrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.wkstrip::-webkit-scrollbar{display:none}
.wkstrip button{min-width:44px;height:44px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--mute);position:relative}
.wkstrip button small{display:block;font-size:8.5px;font-weight:500;letter-spacing:.06em;margin-top:-3px}
.wkstrip button.on{background:var(--y);color:var(--navy);border-color:var(--y)}
.wkstrip button.cur:not(.on){border-color:rgba(255,225,79,.5);color:var(--text)}
.wkstrip button .s{position:absolute;top:-4px;right:-4px;width:12px;height:12px;color:var(--y)}
.wkstrip button.on .s{color:var(--navy);top:3px;right:3px}

/* timeline */
.tl{position:relative;padding-left:30px}
.tl::before{content:"";position:absolute;left:9px;top:10px;bottom:10px;width:2px;background:linear-gradient(var(--line2),var(--line2))}
.tl .node{position:relative;margin-bottom:12px}

/* ---------- WHEEL ---------- */
.draft{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}

.pteam{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);text-align:left;font-weight:600;font-size:12.5px;line-height:1.2}

/* ---------- CHAT ---------- */
.chat{display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:440px;padding:0;overflow:hidden}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:78%}
.msg .bub{background:var(--panel2);border:1px solid var(--line);border-radius:16px 16px 16px 5px;padding:9px 13px;line-height:1.45;overflow-wrap:anywhere}

.gate{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:40px 20px;flex:1}

/* rules */

.scrim{display:none}


/* ---------- MAC HOLO LOGO ---------- */
@property --rx{syntax:'<number>';inherits:true;initial-value:0}
@property --ry{syntax:'<number>';inherits:true;initial-value:0}
@property --mx{syntax:'<number>';inherits:true;initial-value:50}
@property --my{syntax:'<number>';inherits:true;initial-value:50}
.holo{--w:190px;--rx:6;--ry:-14;--mx:30;--my:35;width:var(--w);aspect-ratio:1058/982;position:relative;perspective:900px;flex:none;display:block}
.holo.anim{animation:holoIdle 9s ease-in-out infinite}
.holo.live{animation:none}
.holo .sh{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(calc(var(--rx)*1deg)) rotateY(calc(var(--ry)*1deg));transition:transform .12s ease-out}
.holo.rest .sh{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.holo .ex,.holo .foil,.holo .glare,.holo .spark{position:absolute;inset:0;-webkit-mask:url(mac-shape.svg) center/100% 100% no-repeat;mask:url(mac-shape.svg) center/100% 100% no-repeat}
.holo .ex{transform:translateZ(calc(var(--i) * var(--w) * -0.009));background:linear-gradient(calc(var(--ry)*3deg + 90deg),#424449,#9aa1ad 35%,#E9EAEB 50%,#8a919d 65%,#35373A)}
.holo .ex.back{background:#151618}
.holo .front{position:absolute;inset:0;isolation:isolate;transform:translateZ(1px)}
.holo .face,.hero .logos .holo img.face{position:absolute;inset:0;width:100%;height:100%;transform:translateZ(0);filter:none}
.holo .foil{mix-blend-mode:color-dodge;opacity:.34;
  background:
   repeating-linear-gradient(calc(110deg + var(--ry)*1deg),
     hsl(0 90% 62%) 0%,hsl(45 95% 60%) 6%,hsl(110 80% 58%) 12%,hsl(185 90% 58%) 18%,hsl(235 90% 66%) 24%,hsl(295 85% 64%) 30%,hsl(360 90% 62%) 36%);
  background-size:170% 170%;background-position:calc(var(--mx)*1%) calc(var(--my)*1%)}
.holo .spark{mix-blend-mode:overlay;opacity:.35;
  background:repeating-linear-gradient(calc(-45deg + var(--ry)*1deg),rgba(255,255,255,.0) 0 6px,rgba(255,255,255,.55) 7px,rgba(255,255,255,0) 9px 14px);
  background-position:calc(var(--mx)*1%) 0}
.holo .glare{mix-blend-mode:soft-light;opacity:.85;
  background:radial-gradient(farthest-corner circle at calc(var(--mx)*1%) calc(var(--my)*1%),rgba(255,255,255,.95) 0%,rgba(255,255,255,.35) 22%,rgba(0,0,0,.45) 85%)}
.holo .shadow{position:absolute;left:12%;right:12%;bottom:-10%;height:14%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent);transform:translateX(calc(var(--ry)*-.6%));filter:blur(2px)}
@keyframes holoIdle{0%,100%{--ry:-20;--rx:8;--mx:15;--my:25}50%{--ry:20;--rx:-4;--mx:85;--my:70}}
@media (prefers-reduced-motion:reduce){.holo.anim{animation:none}}
.rail .rb.conf{background:none;border:0;width:52px;height:52px}
.brand{display:flex;align-items:center;gap:12px}
/* ---------- PLAYER CARDS (v2 · Josh's design, native 1143×1367) ---------- */

  width:calc(1143px*var(--k));height:calc(1367px*var(--k));position:relative;perspective:1600px;cursor:pointer;flex:none;font-family:Inter,Poppins,sans-serif}

  transform:translate(calc(var(--ry,0)*-.9% + 3%),calc(var(--rx,0)*.6% + 4%)) scale(calc(.97 - var(--liftn,0)*.05));opacity:calc(.85 - var(--liftn,0)*.25);transition:transform .25s ease-out,opacity .25s}

/* ======================= CONSTANTS ======================= */
const TEAMS = {
  MIA:{off:75,def:77,g:"#E3263F",school:"Miami (OH)",mascot:"RedHawks",abbr:"MIA",c1:"#C3142D",c2:"#FFFFFF",ovr:76},
  WMU:{off:77,def:73,g:"#F2C200",school:"Western Michigan",mascot:"Broncos",abbr:"WMU",c1:"#6C4023",c2:"#C9A24B",ovr:75},

  AKR:{off:75,def:72,g:"#C9B37E",school:"Akron",mascot:"Zips",abbr:"AKR",c1:"#041E42",c2:"#A89968",ovr:73},
  EMU:{off:75,def:72,g:"#22A85F",school:"Eastern Michigan",mascot:"Eagles",abbr:"EMU",c1:"#006633",c2:"#FFFFFF",ovr:73},

  BGSU:{off:70,def:75,g:"#FF6A1A",school:"Bowling Green",mascot:"Falcons",abbr:"BGSU",c1:"#FE5000",c2:"#4F2C1D",ovr:72},

  KENT:{off:73,def:70,g:"#EAAB00",school:"Kent State",mascot:"Golden Flashes",abbr:"KENT",c1:"#002664",c2:"#EAAB00",ovr:72},

const ESPN={MIA:193,WMU:2711,OHIO:195,AKR:2006,EMU:2199,TOL:2649,BALL:2050,BGSU:189,BUFF:2084,CMU:2117,KENT:2309,SAC:16,MASS:113,NIU:2459};

];
const DEFAULT_DRAFT = {players:DEFAULT_PLAYERS, excluded:["MIA","MASS"], assignments:{}, order:DEFAULT_PLAYERS.map(p=>p.id), log:[]};
const DEFAULT_RULES = [
  ["Difficulty","TBD"],["Quarter length","TBD"],["Accelerated clock","TBD"],["Advance schedule","TBD — e.g. Sun & Wed nights"],
  ["Sim policy","TBD — what happens if someone misses the deadline"],["4th downs","TBD"],["Banned plays / cheese","TBD"],

/* ======================= STATE ======================= */
let DB=null, canWrite=false, authUser=null, member=null;
let live={draft:null,season:null,ready:null,readyMembers:[],chat:[]};
let demo=false, demoData=null, spinning=false, rot=0;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function withDefaults(dr){if(!dr)return clone(DEFAULT_DRAFT);const ps=dr.players||[];const miss=DEFAULT_PLAYERS.filter(p=>!ps.some(x=>x.id===p.id));return miss.length?{...dr,players:ps.concat(clone(miss))}:dr}
const isOptional=id=>!!(DEFAULT_PLAYERS.find(p=>p.id===id)||{}).optional;

const T=c=>TEAMS[c]||{school:c,mascot:"",abbr:(c||"?").slice(0,4).toUpperCase(),c1:"#3A3C41",c2:"#797D85",ovr:null,ext:true};
function lum(hex){const n=parseInt(hex.slice(1),16);const r=(n>>16)/255,g=(n>>8&255)/255,b=(n&255)/255;return .2126*r+.7152*g+.0722*b}
const txtOn=hex=>lum(hex)>.6?"#111":"#fff";

Object.keys(ESPN).forEach(c=>{const i=new Image();i.onload=()=>{LOGO[c]=1;if(!spinning)render()};i.src=logoUrl(c);const w=new Image();w.onload=()=>{WLOGO[c]=w;drawWheel()};w.src=wheelLogoUrl(c)});
function logo(c,size=""){const t=T(c);if(LOGO[c])return `<img class="logo ${size}" src="${logoUrl(c)}" alt="${esc(t.school)}">`;return `<div class="badge ${size}" style="--c1:${t.c1};--c2:${t.c2};color:${txtOn(t.c1)}">${esc(t.abbr)}</div>`}

/* ======================= SEASON MATH ======================= */
function allGames(d){const o=[];(d.season.weeks||[]).forEach(w=>(w.games||[]).forEach(g=>o.push({...g,week:w.week})));return o}
const isFinal=g=>g.final&&g.hs!=null&&g.as!=null;
const isConf=g=>!!(TEAMS[g.home]&&TEAMS[g.away])&&g.conf!==false;
function currentWeek(d){const ws=d.season.weeks||[];if(!ws.length)return null;if(d.season.currentWeek!=null)return d.season.currentWeek;const o=ws.find(w=>(w.games||[]).some(g=>!isFinal(g)));return o?o.week:ws[ws.length-1].week}
function standings(d,upto){
  const rows={};Object.keys(TEAMS).filter(c=>!TEAMS[c].optional||allGames(d).some(g=>g.home===c||g.away===c)).forEach(c=>rows[c]={code:c,cw:0,cl:0,w:0,l:0,pf:0,pa:0,streak:""});
  allGames(d).filter(g=>isFinal(g)&&(upto==null||g.week<=upto)).sort((a,b)=>a.week-b.week).forEach(g=>{const conf=isConf(g);
    [[g.home,g.hs,g.as],[g.away,g.as,g.hs]].forEach(([c,f,a])=>{const r=rows[c];if(!r)return;const won=f>a;r.pf+=f;r.pa+=a;won?r.w++:r.l++;if(conf){won?r.cw++:r.cl++}const s=won?"W":"L";r.streak=r.streak[0]===s?s+(parseInt(r.streak.slice(1))+1):s+"1"})});
  const p=(w,l)=>w+l?w/(w+l):0;
  return Object.values(rows).sort((a,b)=>p(b.cw,b.cl)-p(a.cw,a.cl)||b.cw-a.cw||p(b.w,b.l)-p(a.w,a.l)||(b.pf-b.pa)-(a.pf-a.pa)||T(a.code).school.localeCompare(T(b.code).school));
}
function rec(d,c){return standings(d).find(r=>r.code===c)||{w:0,l:0,cw:0,cl:0,pf:0,pa:0,streak:""}}
function h2h(d){const ps=players(d),a=d.draft.assignments||{},m={};ps.forEach(p=>{m[p.id]={};ps.forEach(q=>m[p.id][q.id]={w:0,l:0})});
  allGames(d).filter(isFinal).forEach(g=>{const hp=ps.find(p=>a[p.id]===g.home),ap=ps.find(p=>a[p.id]===g.away);if(hp&&ap){if(g.hs>g.as){m[hp.id][ap.id].w++;m[ap.id][hp.id].l++}else{m[ap.id][hp.id].w++;m[hp.id][ap.id].l++}}});return m}
const h2hTot=(m,id)=>Object.values(m[id]||{}).reduce((s,x)=>({w:s.w+x.w,l:s.l+x.l}),{w:0,l:0});
function teamGames(d,c){return allGames(d).filter(g=>g.home===c||g.away===c).sort((a,b)=>a.week-b.week)}
function ptsSeries(d,c){return teamGames(d,c).filter(isFinal).map(g=>({wk:g.week,v:g.home===c?g.hs:g.as,o:g.home===c?g.as:g.hs,opp:g.home===c?g.away:g.home}))}
function readyMap(d,wk){const done={...((d.ready&&d.ready.week===wk&&d.ready.done)||{})};(d.readyMembers||[]).forEach(r=>{if(r.week===wk&&r.done&&r.coach)done[r.coach]=true});return done}

const views={home,draft,schedule,standings:standingsView,stats,rivals,chat:chatView,rules,cards:cardlab};

let lastRoute=null, heroTimer=null, heroIdx=0;
function render(){
  const d=D(),r=route(); document.body.classList.remove("drawer"); shell(d,r);
  if(r==="chat"&&lastRoute==="chat"&&document.getElementById("msgs")&&authUser&&member&&member.coach){updateChat();lastRoute=r;return}
  const keep=r===lastRoute?window.scrollY:0;
  document.getElementById("view").innerHTML=views[r](d);

function form(d,c,n=5){const gs=ptsSeries(d,c).slice(-n);const out=gs.map(g=>`<i class="${g.v>g.o?"W":"L"}">${g.v>g.o?"W":"L"}</i>`);while(out.length<n)out.unshift('<i class="N">–</i>');return `<div class="form">${out.join("")}</div>`}
function nextGame(d,c){return teamGames(d,c).find(g=>!isFinal(g))}
function mcard(d,g,cp){
  const fin=isFinal(g),ao=ownerOf(d,g.away),ho=ownerOf(d,g.home),mq=ao&&ho,ra=rec(d,g.away),rh=rec(d,g.home);
  return `<div class="mc ${mq?"marquee":""} ${cp?"cp":""}"><div class="mh"><span>Week ${g.week}${mq?' · <span class="y">Coach vs Coach</span>':isConf(g)?" · MAC":" · Non-conf"}</span>${fin?'<span class="tag final">FINAL</span>':g.week===currentWeek(D())?'<span class="tag live">THIS WEEK</span>':'<span class="tag">UPCOMING</span>'}</div>
  <div class="mr"><div class="tm">${logo(g.away,cp?"":"md")}<span>${esc(cp?T(g.away).abbr:T(g.away).school)}</span></div><div class="sc">${fin?`<span class="${g.as<g.hs?"l":""}">${g.as}</span>:<span class="${g.hs<g.as?"l":""}">${g.hs}</span>`:'<span class="dim" style="font-size:16px">vs</span>'}<small>${fin?"Final":"@"}</small></div><div class="tm">${logo(g.home,cp?"":"md")}<span>${esc(cp?T(g.home).abbr:T(g.home).school)}</span></div></div>
  <div class="mf"><div class="c">${ao?`<span class="who">${esc(ao.name)}</span>`:'<span class="who alt">CPU</span>'}<span class="rec">${ra.w}-${ra.l}</span></div><div class="c"><span class="rec">${rh.w}-${rh.l}</span>${ho?`<span class="who">${esc(ho.name)}</span>`:'<span class="who alt">CPU</span>'}</div></div></div>`;
}
function heroSlides(d){
  const ws=d.season.weeks||[]; if(!ws.length) return [];
  const cw=currentWeek(d), wk=ws.find(w=>w.week===cw)||{games:[]}, a=d.draft.assignments||{}, mine=a[myId()];
  const gs=(wk.games||[]).map(g=>({...g,week:wk.week})).filter(g=>ownerOf(d,g.home)||ownerOf(d,g.away));
  const score=g=>(mine&&(g.home===mine||g.away===mine)?4:0)+(ownerOf(d,g.home)&&ownerOf(d,g.away)?2:0);
  return gs.sort((x,y)=>score(y)-score(x));
}

    return `<div class="hc"><span class="kick">${I.wheel.replace('<svg','<svg width="13" height="13"')} ${drafted<ps.length?"Draft night":"Preseason"}</span><h2>${drafted<ps.length?"Spin for your program":"Every coach has a program"}</h2>

  const lastWk=ws.filter(w=>w.week<cw).slice(-1)[0], lastG=(lastWk?.games||[]).map(g=>({...g,week:lastWk.week})).filter(g=>isFinal(g)&&(ownerOf(d,g.home)||ownerOf(d,g.away)));

let schedWeek=null, schedFilter="all";
function schedule(d){
  const ws=d.season.weeks||[];
  if(!ws.length) return `<div class="ptitle"><h2>Schedule</h2><p>Week-by-week matchups</p></div><div class="panel"><div class="empty"><b>Schedule not imported yet</b>Once the dynasty is created, send Josh screenshots of the schedule and every week shows up here.</div></div>`;
  const a=d.draft.assignments||{}, cw=currentWeek(d);
  const fchips=`<div class="chips scroll" style="margin-bottom:16px"><button class="chip ${schedFilter==="all"?"on":""}" data-sf="all">All games</button><button class="chip ${schedFilter==="coaches"?"on":""}" data-sf="coaches">${I.star}Coaches only</button>${players(d).filter(p=>a[p.id]).map(p=>`<button class="chip ${schedFilter===p.id?"on":""}" data-sf="${p.id}">${LOGO[a[p.id]]?`<img src="${logoUrl(a[p.id])}" alt="">`:""}${esc(p.name)}</button>`).join("")}</div>`;
  if(schedFilter!=="all"&&schedFilter!=="coaches"&&a[schedFilter]){

  }

  const wk=ws.find(w=>w.week===schedWeek); let games=(wk.games||[]).map(g=>({...g,week:wk.week}));
  if(schedFilter==="coaches") games=games.filter(g=>ownerOf(d,g.home)||ownerOf(d,g.away));
  const sc=g=>(ownerOf(d,g.home)&&ownerOf(d,g.away)?2:0)+(ownerOf(d,g.home)||ownerOf(d,g.away)?1:0); games.sort((x,y)=>sc(y)-sc(x));

   <div class="wkstrip" id="wkstrip" style="flex:1">${ws.map(w=>{const mq=(w.games||[]).some(g=>ownerOf(d,g.home)&&ownerOf(d,g.away));return `<button class="${w.week===schedWeek?"on":""} ${w.week===cw?"cur":""}" data-wk="${w.week}">${mq?`<span class="s">${I.star}</span>`:""}${w.week}<small>WK</small></button>`}).join("")}</div>
   <button class="arrow" data-wk="${ws[i+1]?.week??""}" ${i>=ws.length-1?"disabled":""} aria-label="Next week">${I.right}</button></div></div>
  ${fchips}<div class="g3">${games.map(g=>mcard(d,g)).join("")||'<div class="empty">No games match.</div>'}</div>`;

  const nonconf=["Michigan State","Purdue","Illinois","Kentucky","Wisconsin","Iowa State","Kansas","Rutgers","Maryland","Nebraska","UConn","Army","Navy","Liberty","Marshall","Memphis","Tulane"];
  let s=7;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};const weeks=[];
  for(let w=1;w<=4;w++)weeks.push({week:w,games:conf.map((c,i)=>{const opp=nonconf[(i+w*3)%nonconf.length],hm=rnd()>.5;return {home:hm?c:opp,away:hm?opp:c,conf:false}})});
  const arr=[...picks,...pool.filter(c=>!picks.includes(c))];
  for(let r=0;r<8;r++){const g=[];for(let i=0;i<arr.length/2;i++){const x=arr[i],y=arr[arr.length-1-i];if(x!=="BYE"&&y!=="BYE")g.push(rnd()>.5?{home:x,away:y}:{home:y,away:x})}weeks.push({week:r+5,games:g});arr.splice(1,0,arr.pop())}
  const cur=9;weeks.forEach(w=>w.games.forEach(g=>{if(w.week<cur){const hb=T(g.home).ovr||78,ab=T(g.away).ovr||78;g.hs=Math.round(14+rnd()*28+(hb-74)*1.2+3);g.as=Math.round(14+rnd()*28+(ab-74)*1.2);if(g.hs===g.as)g.hs+=3;g.final=true}}));
  const fn=["J. Carter","D. Mills","T. Brooks","K. Owens","M. Ruiz","A. Grant","C. Hayes","R. Banks","L. Price","E. Shaw","Q. Moss","B. Lane","S. Cole","N. Ford","P. Wade","G. Hart","V. Reed","Z. Knox","H. Dunn","O. Pratt"];
  let k=0;const name=()=>fn[(k++)%fn.length],st=[],gp=8;
  conf.forEach(c=>{const m=picks.includes(c)?1.15:.9,att=Math.round((220+rnd()*80)*m),cmp=Math.round(att*(.58+rnd()*.1));
    st.push({name:name(),team:c,pos:"QB",gp,att,cmp,passYds:Math.round(cmp*(10.5+rnd()*2.5)),passTd:Math.round((10+rnd()*10)*m),int:Math.round(2+rnd()*7),car:Math.round(30+rnd()*30),rushYds:Math.round(60+rnd()*200),rushTd:Math.round(rnd()*4)});
    const car=Math.round((110+rnd()*60)*m);st.push({name:name(),team:c,pos:"HB",gp,car,rushYds:Math.round(car*(4+rnd()*2)),rushTd:Math.round((4+rnd()*8)*m),rec:Math.round(8+rnd()*14),recYds:Math.round(60+rnd()*140),recTd:Math.round(rnd()*2)});
    for(let j=0;j<2;j++){const rc=Math.round((25+rnd()*25)*m);st.push({name:name(),team:c,pos:j?"TE":"WR",gp,rec:rc,recYds:Math.round(rc*(11+rnd()*5)),recTd:Math.round((2+rnd()*6)*m)})}
    st.push({name:name(),team:c,pos:"MLB",gp,tkl:Math.round(40+rnd()*35),tfl:Math.round(2+rnd()*7),sacks:+(rnd()*3).toFixed(1),defInt:Math.round(rnd()*2)});
    st.push({name:name(),team:c,pos:"EDGE",gp,tkl:Math.round(20+rnd()*20),tfl:Math.round(4+rnd()*8),sacks:+(2+rnd()*6).toFixed(1),defInt:0})});
  st.forEach((p,i)=>{p.ovr=Math.min(97,70+Math.round(rnd()*18)+(picks.includes(p.team)?4:0));p.num=String(1+Math.floor(rnd()*98))});
  return {draft:dr,season:{season:1,currentWeek:cur,totalWeeks:12,weeks,playerStats:st,news:["Toledo QB throws 4 TDs vs Bowling Green","Western Michigan gets Top 25 votes","Rivalry week: CMU vs WMU"],rules:DEFAULT_RULES},ready:{week:cur,done:{josh:true,caleb:true}},readyMembers:[]};
}
