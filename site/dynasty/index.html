<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Football 27 · MAC Dynasty</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700;1,800;1,900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090f; --bg2:#0c1019; --panel:#111726; --panel2:#172036; --line:#243050;
  --text:#eef2fb; --mute:#8b97b3; --dim:#5a6683;
  --gold:#f2c230; --win:#3ddc84; --loss:#ff5a5a;
  --tc1:#1f4fd6; --tc2:#f2c230; --tcText:#fff;
  --cut:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Barlow,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:56px;
  background:
    radial-gradient(1200px 500px at 85% -10%, color-mix(in srgb,var(--tc1) 38%, transparent), transparent 70%),
    radial-gradient(900px 400px at -10% 0%, color-mix(in srgb,var(--tc2) 14%, transparent), transparent 70%),
    repeating-linear-gradient(115deg, rgba(255,255,255,.018) 0 2px, transparent 2px 22px),
    var(--bg);
  background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.cond{font-family:"Barlow Condensed",sans-serif}
.ital{font-style:italic}

/* ---------- HEADER ---------- */
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(7,9,15,.97),rgba(7,9,15,.88));backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:22px;padding:12px 20px 0}
.brand{display:flex;align-items:center;gap:12px;padding-bottom:12px;flex:none;white-space:nowrap}
.brand .mark{width:44px;height:44px;background:var(--tc1);clip-path:polygon(18% 0,100% 0,82% 100%,0 100%);display:grid;place-items:center;
  font:900 italic 20px "Barlow Condensed";color:var(--tcText);box-shadow:inset 0 -4px 0 var(--tc2)}
.brand h1{font:800 italic 24px/1 "Barlow Condensed";letter-spacing:.5px;text-transform:uppercase}
.brand h1.wm{font:400 23px/1 Graduate,"Barlow Condensed",serif;letter-spacing:1px;font-style:normal;color:#fff;-webkit-text-stroke:1.3px #fff;paint-order:stroke fill;text-shadow:none}
.brand small .sub{color:var(--tc2);font:800 italic 13px "Barlow Condensed";letter-spacing:2px;margin-right:6px}
.brand small{display:block;font:600 11px/1.2 Barlow;color:var(--mute);letter-spacing:2.5px;text-transform:uppercase;margin-top:3px}
nav{display:flex;gap:2px;margin-left:auto;align-self:flex-end;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{font:700 italic 16px "Barlow Condensed";text-transform:uppercase;letter-spacing:.6px;color:var(--mute);text-decoration:none;padding:10px 11px 13px;position:relative;white-space:nowrap}
nav a:hover{color:var(--text)}
nav a.on{color:var(--text)}
nav a.on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:4px;background:var(--tc2);transform:skewX(-20deg)}
.viewas{display:flex;align-items:center;gap:8px;padding-bottom:12px}
.viewas label{font:600 10px Barlow;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
select{font:700 italic 15px "Barlow Condensed";text-transform:uppercase;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:6px 10px;letter-spacing:.5px}

main{max-width:1240px;margin:0 auto;padding:26px 20px 40px}
.banner{max-width:1240px;margin:12px auto 0;padding:0 20px}
.banner div{background:repeating-linear-gradient(135deg,#3a2a00 0 12px,#2a1f00 12px 24px);border:1px solid #6b5100;color:#ffd866;font:700 italic 14px "Barlow Condensed";letter-spacing:1px;text-transform:uppercase;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner button{font:700 italic 13px "Barlow Condensed";text-transform:uppercase;border:1px solid #ffd866;padding:3px 10px}

/* ---------- PANELS ---------- */
.panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);position:relative;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.panel>.ph{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--tc1) 22%,transparent),transparent 60%)}
.ph h2,.ph h3{font:800 italic 19px "Barlow Condensed";text-transform:uppercase;letter-spacing:.8px}
.ph .tag{margin-left:auto;font:600 11px Barlow;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute)}
.ph::before{content:"";width:6px;height:20px;background:var(--tc2);transform:skewX(-20deg)}
.pb{padding:14px 16px}
.grid{display:grid;gap:18px;align-content:start}
.g-home{grid-template-columns:1.6fr 1fr}
.g-2{grid-template-columns:1fr 1fr}
@media(max-width:900px){.g-home,.g-2{grid-template-columns:1fr}}
.pagetitle{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px}
.pagetitle h2{font:900 italic 44px/0.9 "Barlow Condensed";text-transform:uppercase;letter-spacing:.5px}
.pagetitle p{color:var(--mute);font-weight:500;padding-bottom:4px}
.kicker{font:700 12px Barlow;letter-spacing:3px;text-transform:uppercase;color:var(--tc2)}
.empty{color:var(--mute);padding:22px 16px;text-align:center;font-weight:500}
.empty b{display:block;font:800 italic 20px "Barlow Condensed";text-transform:uppercase;color:var(--text);margin-bottom:4px;letter-spacing:.5px}

/* ---------- BADGES ---------- */
.badge{--c1:#333;--c2:#999;--ct:#fff;width:38px;height:38px;flex:none;background:var(--c1);color:var(--ct);display:grid;place-items:center;
  font:900 italic 13px "Barlow Condensed";letter-spacing:.3px;clip-path:polygon(50% 0,100% 18%,100% 70%,50% 100%,0 70%,0 18%);box-shadow:inset 0 -5px 0 var(--c2)}
.logo{width:38px;height:38px;object-fit:contain;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}.logo.sm{width:30px;height:30px}.logo.lg{width:130px;height:130px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.badge.lg{width:110px;height:110px;font-size:34px;box-shadow:inset 0 -14px 0 var(--c2)}
.badge.sm{width:28px;height:28px;font-size:10px;box-shadow:inset 0 -3px 0 var(--c2)}
.utag{display:inline-block;font:700 italic 11px "Barlow Condensed";letter-spacing:1px;text-transform:uppercase;background:var(--gold);color:#111;padding:1px 6px;transform:skewX(-12deg)}
.utag.alt{background:var(--panel2);color:var(--text);border:1px solid var(--line)}

/* ---------- HERO / MATCHUP ---------- */
.hero{padding:22px 22px 18px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
  background:linear-gradient(100deg,color-mix(in srgb,var(--h1,#333) 55%,transparent),transparent 45%,transparent 55%,color-mix(in srgb,var(--h2,#333) 55%,transparent))}
.hero .side{display:flex;align-items:center;gap:16px}
.hero .side.r{flex-direction:row-reverse;text-align:right}
.hero .tname{font:900 italic 30px/0.95 "Barlow Condensed";text-transform:uppercase}
.hero .tsub{color:var(--mute);font-weight:600;font-size:13px;margin-top:4px}
.hero .vs{font:900 italic 40px "Barlow Condensed";color:var(--tc2);text-align:center}
.hero .vs small{display:block;font:600 11px Barlow;letter-spacing:2px;color:var(--mute)}
.hero .score{font:900 italic 54px/1 "Barlow Condensed"}
@media(max-width:620px){.hero{grid-template-columns:1fr}.hero .side.r{flex-direction:row;text-align:left}.hero .vs{text-align:left}}

/* ---------- TABLES ---------- */
table{width:100%;border-collapse:collapse}
th{font:700 11px Barlow;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid rgba(36,48,80,.55);font-weight:500;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.big{font:700 italic 17px "Barlow Condensed"}
tr.user td{background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 9%,transparent),transparent 70%)}
tr.me td{background:linear-gradient(90deg,color-mix(in srgb,var(--tc1) 30%,transparent),transparent 80%)}
.tcell{display:flex;align-items:center;gap:10px}
.tcell .nm{font:700 italic 17px "Barlow Condensed";text-transform:uppercase;letter-spacing:.3px}
.rank{font:800 italic 18px "Barlow Condensed";color:var(--mute);width:26px}
.scroll{overflow-x:auto}

/* ---------- GAME CARDS ---------- */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.gcard{background:var(--panel);border:1px solid var(--line);position:relative;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.gcard.marquee{border-color:color-mix(in srgb,var(--gold) 70%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 40%,transparent) inset}
.gcard .gh{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:var(--panel2);font:700 11px Barlow;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute)}
.gcard .gh .st{color:var(--text)}
.gcard .gh .st.live{color:var(--gold)}
.grow{display:flex;align-items:center;gap:10px;padding:9px 12px}
.grow + .grow{border-top:1px solid rgba(36,48,80,.6)}
.grow .nm{font:700 italic 18px "Barlow Condensed";text-transform:uppercase;flex:1;line-height:1}
.grow .nm small{display:block;font:600 11px Barlow;color:var(--mute);text-transform:none;font-style:normal;margin-top:3px;letter-spacing:.3px}
.grow .sc{font:800 italic 26px "Barlow Condensed";min-width:36px;text-align:right}
.grow.lose .sc,.grow.lose .nm{opacity:.5}
.grow.win .sc::after{content:"◀";font-size:11px;color:var(--tc2);margin-left:4px;vertical-align:middle;font-style:normal}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:700 italic 15px "Barlow Condensed";text-transform:uppercase;letter-spacing:.5px;padding:6px 14px;background:var(--panel);border:1px solid var(--line);transform:skewX(-12deg)}
.chip>span{display:inline-block;transform:skewX(12deg)}
.chip.on{background:var(--tc1);color:var(--tcText);border-color:var(--tc1);box-shadow:inset 0 -3px 0 var(--tc2)}
.chip.has::after{content:"";display:inline-block;width:6px;height:6px;background:var(--gold);border-radius:50%;margin-left:6px;transform:skewX(12deg);vertical-align:middle}

.btn{font:800 italic 17px "Barlow Condensed";text-transform:uppercase;letter-spacing:1px;padding:11px 24px;background:var(--tc1);color:var(--tcText);
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);box-shadow:inset 0 -4px 0 var(--tc2);transition:filter .15s}
.btn:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--panel2);color:var(--text);box-shadow:inset 0 -3px 0 var(--line)}
.btn.gold{background:var(--gold);color:#111;box-shadow:inset 0 -4px 0 #a07c00}
.btn.sm{font-size:14px;padding:7px 16px}

/* ---------- WHEEL ---------- */
.draft{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:960px){.draft{grid-template-columns:1fr}}
.wheelwrap{position:relative;padding:26px;display:flex;flex-direction:column;align-items:center;gap:18px}
.wheelbox{position:relative;width:min(560px,100%);aspect-ratio:1}
#wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 20px 40px rgba(0,0,0,.6))}
.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:44px;height:54px;z-index:3;
  background:var(--gold);clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.pointer.tick{animation:tick .09s}
@keyframes tick{50%{transform:translateX(-50%) rotate(-14deg)}}
.hub{position:absolute;inset:39%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#26324f,#0b0f19);border:4px solid var(--gold);display:grid;place-items:center;text-align:center;z-index:2;
  box-shadow:0 0 0 6px rgba(0,0,0,.4)}
.hub b{font:900 italic clamp(18px,3.6vw,30px)/0.9 "Barlow Condensed";text-transform:uppercase}
.hub small{display:block;font:700 10px Barlow;letter-spacing:2px;color:var(--mute);text-transform:uppercase;margin-bottom:4px}
.upnext{font:800 italic 22px "Barlow Condensed";text-transform:uppercase;letter-spacing:.5px;text-align:center}
.upnext span{color:var(--tc2)}
.board .slot{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid rgba(36,48,80,.55)}
.board .slot:last-child{border-bottom:0}
.board .pick{font:800 italic 18px "Barlow Condensed";color:var(--dim);width:24px}
.board .who{font:800 italic 22px "Barlow Condensed";text-transform:uppercase;width:92px}
.board .tm{flex:1;display:flex;align-items:center;gap:10px;font:700 italic 17px "Barlow Condensed";text-transform:uppercase}
.board .tm.wait{color:var(--dim);font-weight:600}
.board .slot.next{background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 14%,transparent),transparent)}
.board .slot.out{opacity:.4}
.toggle{font:700 11px Barlow;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border:1px solid var(--line);background:var(--panel2)}
.toggle.in{border-color:var(--win);color:var(--win)}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pteam{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--panel2);border:1px solid var(--line);text-align:left;font:700 italic 14px "Barlow Condensed";text-transform:uppercase;line-height:1.05}
.pteam small{display:block;font:600 10px Barlow;color:var(--mute);font-style:normal;letter-spacing:.5px}
.pteam.ex{opacity:.38;text-decoration:line-through}
.pteam.taken{opacity:.55;border-style:dashed}
.pteam:disabled{cursor:default}

/* reveal */
.reveal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(3,5,10,.82);backdrop-filter:blur(6px)}
.reveal.show{display:grid}
.rcard{width:min(620px,92vw);padding:34px 30px;text-align:center;background:linear-gradient(160deg,var(--r1),#05070c 75%);border:2px solid var(--r2);
  clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,26px 100%,0 calc(100% - 26px));animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}}
.rcard .kicker{color:var(--r2)}
.rcard .who{font:900 italic 46px/1 "Barlow Condensed";text-transform:uppercase;margin:6px 0 18px}
.rcard .logo{width:38px;height:38px;object-fit:contain;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}.logo.sm{width:30px;height:30px}.logo.lg{width:130px;height:130px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.badge.lg{margin:0 auto 16px}
.rcard .school{font:900 italic 52px/0.9 "Barlow Condensed";text-transform:uppercase}
.rcard .mascot{font:700 italic 26px "Barlow Condensed";text-transform:uppercase;color:var(--r2);margin-top:4px;letter-spacing:1px}
.rcard .ovr{display:inline-block;margin-top:16px;font:800 italic 18px "Barlow Condensed";letter-spacing:1px;padding:4px 14px;border:1px solid var(--r2)}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(3,5,10,.75)}
.modal.show{display:grid}
.modal .panel{width:min(440px,92vw)}
.modal .pb p{color:var(--mute);margin-bottom:16px;line-height:1.45}
.modal .row{display:flex;gap:10px;justify-content:flex-end}

/* ready board */
.ready{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.rd{padding:10px;background:var(--panel2);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:4px}
.rd b{font:800 italic 18px "Barlow Condensed";text-transform:uppercase}
.rd span{font:700 11px Barlow;letter-spacing:1.5px;text-transform:uppercase;color:var(--loss)}
.rd.done{border-color:color-mix(in srgb,var(--win) 60%,transparent)}
.rd.done span{color:var(--win)}

.leaders{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
@media(max-width:620px){.leaders{grid-template-columns:1fr}}
.ldr{padding:14px 16px;border-right:1px solid var(--line)}
.ldr:last-child{border-right:0}
.ldr .cat{font:700 11px Barlow;letter-spacing:2px;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.ldr .top{display:flex;align-items:center;gap:10px}
.ldr .val{font:900 italic 38px/1 "Barlow Condensed";color:var(--tc2)}
.ldr .pn{font:800 italic 18px/1 "Barlow Condensed";text-transform:uppercase}
.ldr .pn small{display:block;font:600 11px Barlow;color:var(--mute);font-style:normal;text-transform:none;margin-top:3px}
.ldr ol{list-style:none;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.ldr li{display:flex;justify-content:space-between;font-weight:500;color:var(--mute);padding:2px 0;font-size:13px}
.ldr li b{color:var(--text);font-variant-numeric:tabular-nums}

.h2h td.cell{text-align:center;font:800 italic 17px "Barlow Condensed"}
.h2h td.self{background:repeating-linear-gradient(135deg,#0b0f19 0 6px,#111726 6px 12px)}
.h2h td.w{color:var(--win)} .h2h td.l{color:var(--loss)}

.rules li{list-style:none;display:flex;gap:14px;padding:12px 16px;border-bottom:1px solid rgba(36,48,80,.55)}
.rules li:last-child{border-bottom:0}
.rules .rk{font:800 italic 15px "Barlow Condensed";text-transform:uppercase;color:var(--tc2);width:150px;flex:none;letter-spacing:.5px}
.rules .rv{font-weight:500}
.rules .rv.tbd{color:var(--dim);font-style:italic}

/* ticker */
.ticker{position:fixed;left:0;right:0;bottom:0;height:40px;z-index:30;display:flex;background:#04060b;border-top:2px solid var(--tc2);overflow:hidden}
.ticker .lbl{flex:none;position:relative;z-index:2;background:var(--tc1);color:var(--tcText);font:900 italic 16px "Barlow Condensed";text-transform:uppercase;letter-spacing:1px;padding:0 18px 0 16px;display:grid;place-items:center;
  clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.ticker .run{display:flex;align-items:center;gap:40px;white-space:nowrap;padding-left:30px;animation:run 45s linear infinite;font:700 italic 15px "Barlow Condensed";text-transform:uppercase;letter-spacing:.6px}
.ticker .run b{color:var(--tc2)}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.ticker .run{animation:none}}
.status{font:600 11px Barlow;letter-spacing:1px;color:var(--dim);text-transform:uppercase;text-align:right;margin-top:30px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:30px;flex-wrap:wrap}
.commish{max-width:1240px;margin:26px auto 0;padding:0 20px;display:flex;justify-content:flex-end;gap:10px;align-items:center;font:600 12px Barlow;color:var(--dim);letter-spacing:.5px}
.commish button{font:700 italic 13px "Barlow Condensed";text-transform:uppercase;letter-spacing:1px;color:var(--mute);border:1px solid var(--line);padding:5px 12px}
.toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;background:var(--panel2);border:1px solid var(--line);padding:10px 18px;font-weight:600;z-index:70;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand">
      <div class="mark">MD</div>
      <div><h1 class="wm">College Football 27</h1><small><b class="sub">MAC Dynasty</b> <span id="seasonLbl">Season 1 · Preseason</span></small></div>
    </div>
    <nav id="nav">
      <a href="#home">Home</a><a href="#draft">Team Wheel</a><a href="#schedule">Schedule</a><a href="#standings">Standings</a><a href="#stats">Stats</a><a href="#rivals">Rivalries</a><a href="#rules">Rules</a>
    </nav>
    <div class="viewas"><label for="me">Viewing as</label><select id="me"></select></div>
  </div>
</header>
<div class="banner" id="demoBanner" hidden><div><span>Sample data preview — not your real season</span><button id="demoOff">Exit preview</button></div></div>
<main id="view"></main>
<div class="commish" id="commish"></div>

<div class="ticker"><div class="lbl">MAC Wire</div><div class="run" id="ticker"></div></div>

<div class="reveal" id="reveal"><div class="rcard" id="rcard"></div></div>
<div class="modal" id="modal"><div class="panel"><div class="ph"><h3 id="mTitle">Confirm</h3></div><div class="pb"><p id="mBody"></p><div class="row"><button class="btn ghost sm" id="mNo">Cancel</button><button class="btn sm" id="mYes">Confirm</button></div></div></div></div>

<script>
/* ======================= CONSTANTS ======================= */
const TEAMS = {
  MIA:{school:"Miami (OH)",mascot:"RedHawks",abbr:"MIA",c1:"#C3142D",c2:"#FFFFFF",ovr:76},
  WMU:{school:"Western Michigan",mascot:"Broncos",abbr:"WMU",c1:"#6C4023",c2:"#C9A24B",ovr:75},
  OHIO:{school:"Ohio",mascot:"Bobcats",abbr:"OHIO",c1:"#00694E",c2:"#E9E4D4",ovr:74},
  AKR:{school:"Akron",mascot:"Zips",abbr:"AKR",c1:"#041E42",c2:"#A89968",ovr:73},
  EMU:{school:"Eastern Michigan",mascot:"Eagles",abbr:"EMU",c1:"#006633",c2:"#FFFFFF",ovr:73},
  TOL:{school:"Toledo",mascot:"Rockets",abbr:"TOL",c1:"#15397F",c2:"#FFD200",ovr:73},
  BALL:{school:"Ball State",mascot:"Cardinals",abbr:"BALL",c1:"#BA0C2F",c2:"#E6E6E6",ovr:72},
  BGSU:{school:"Bowling Green",mascot:"Falcons",abbr:"BGSU",c1:"#FE5000",c2:"#4F2C1D",ovr:72},
  BUFF:{school:"Buffalo",mascot:"Bulls",abbr:"BUFF",c1:"#005BBB",c2:"#FFFFFF",ovr:72},
  CMU:{school:"Central Michigan",mascot:"Chippewas",abbr:"CMU",c1:"#6A0032",c2:"#FFC82E",ovr:72},
  KENT:{school:"Kent State",mascot:"Golden Flashes",abbr:"KENT",c1:"#002664",c2:"#EAAB00",ovr:72},
  SAC:{school:"Sacramento State",mascot:"Hornets",abbr:"SAC",c1:"#043927",c2:"#C4B581",ovr:72},
  MASS:{school:"UMass",mascot:"Minutemen",abbr:"MASS",c1:"#881C1C",c2:"#C4C4C4",ovr:71},
  NIU:{school:"Northern Illinois",mascot:"Huskies",abbr:"NIU",c1:"#C8102E",c2:"#111111",ovr:70,optional:true}
};
const ESPN={MIA:193,WMU:2711,OHIO:195,AKR:2006,EMU:2199,TOL:2649,BALL:2050,BGSU:189,BUFF:2084,CMU:2117,KENT:2309,SAC:16,MASS:113,NIU:2459};
const logoUrl=c=>`https://a.espncdn.com/i/teamlogos/ncaa/500-dark/${ESPN[c]}.png`;
const wheelLogoUrl=c=>`https://a.espncdn.com/i/teamlogos/ncaa/500/${ESPN[c]}.png`;
const WLOGO={};Object.keys(ESPN).forEach(c=>{const i=new Image();i.onload=()=>{WLOGO[c]=i;drawWheel()};i.src=wheelLogoUrl(c)});
const DEFAULT_PLAYERS = [
  {id:"josh",name:"Josh",active:true},{id:"nate",name:"Nate",active:true},{id:"caleb",name:"Caleb",active:true},
  {id:"matthew",name:"Matthew",active:true},{id:"tyler",name:"Tyler",active:true},{id:"ryan",name:"Ryan",active:false}
];
const DEFAULT_DRAFT = {players:DEFAULT_PLAYERS, excluded:["MIA","MASS","NIU"], assignments:{}, order:DEFAULT_PLAYERS.map(p=>p.id), log:[]};
const DEFAULT_RULES = [
  ["Difficulty","TBD"],["Quarter length","TBD"],["Accelerated clock","TBD"],["Advance schedule","TBD — e.g. Sun & Wed nights"],
  ["Sim policy","TBD — what happens if someone misses the deadline"],["4th downs","TBD"],["Banned plays / cheese","TBD"],
  ["Recruiting","TBD"],["Reporting","Send Josh the final score + box score screenshot after every game"]
].map(([k,v])=>({k,v}));

/* ======================= STATE ======================= */
let DB=null, canWrite=false, dbStatus="local";
let live = {draft:null, season:null, ready:null};
let demo = false, demoData=null;
let spinning=false, rot=0;
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function clone(o){return JSON.parse(JSON.stringify(o))}
function D(){ // current data source
  if(demo) return demoData;
  return {draft: live.draft || clone(DEFAULT_DRAFT), season: live.season || {}, ready: live.ready || {}};
}
const T = c => TEAMS[c] || {school:c, mascot:"", abbr:(c||"?").slice(0,4).toUpperCase(), c1:"#2b3550", c2:"#8b97b3", ovr:null, ext:true};
function lum(hex){const n=parseInt(hex.slice(1),16);const r=(n>>16)/255,g=(n>>8&255)/255,b=(n&255)/255;return .2126*r+.7152*g+.0722*b}
function txtOn(hex){return lum(hex)>.6?"#111":"#fff"}
const LOGO={};Object.keys(TEAMS).forEach(c=>{const i=new Image();i.onload=()=>{LOGO[c]=i;if(!spinning)render()};i.src=logoUrl(c)});
function badge(c,size=""){const t=T(c);if(LOGO[c])return `<img class="logo ${size}" src="${logoUrl(c)}" alt="${esc(t.school)}">`;return `<div class="badge ${size}" style="--c1:${t.c1};--c2:${t.c2};--ct:${txtOn(t.c1)}">${t.abbr}</div>`}
const esc = s => String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

function players(d){return (d.draft.players||[]).filter(p=>p.active)}
function ownerOf(d,code){const a=d.draft.assignments||{};const id=Object.keys(a).find(k=>a[k]===code);return id?(d.draft.players.find(p=>p.id===id)||{name:id}):null}
function myId(){return store.get("macdyn.me")||""}

/* ======================= SEASON MATH ======================= */
function allGames(d){const out=[];(d.season.weeks||[]).forEach(w=>(w.games||[]).forEach(g=>out.push({...g,week:w.week})));return out}
function isFinal(g){return g.final && g.hs!=null && g.as!=null}
function currentWeek(d){
  const ws=d.season.weeks||[]; if(!ws.length) return null;
  if(d.season.currentWeek!=null) return d.season.currentWeek;
  const open=ws.find(w=>(w.games||[]).some(g=>!isFinal(g))); return open?open.week:ws[ws.length-1].week;
}
function standings(d){
  const rows={}; const confCodes=Object.keys(TEAMS).filter(c=>!TEAMS[c].optional||allGames(d).some(g=>g.home===c||g.away===c));
  confCodes.forEach(c=>rows[c]={code:c,cw:0,cl:0,w:0,l:0,pf:0,pa:0,streak:""});
  allGames(d).filter(isFinal).sort((a,b)=>a.week-b.week).forEach(g=>{
    const conf = TEAMS[g.home]&&TEAMS[g.away] && g.conf!==false;
    [[g.home,g.hs,g.as],[g.away,g.as,g.hs]].forEach(([c,f,a])=>{
      const r=rows[c]; if(!r) return; const won=f>a;
      r.pf+=f; r.pa+=a; won?r.w++:r.l++; if(conf){won?r.cw++:r.cl++}
      const s=won?"W":"L"; r.streak = r.streak[0]===s ? s+(parseInt(r.streak.slice(1))+1) : s+"1";
    });
  });
  const pct=(w,l)=>w+l?w/(w+l):0;
  return Object.values(rows).sort((a,b)=>pct(b.cw,b.cl)-pct(a.cw,a.cl)||b.cw-a.cw||pct(b.w,b.l)-pct(a.w,a.l)||(b.pf-b.pa)-(a.pf-a.pa)||T(a.code).school.localeCompare(T(b.code).school));
}
function h2h(d){
  const ps=players(d), a=d.draft.assignments||{}, m={};
  ps.forEach(p=>{m[p.id]={};ps.forEach(q=>m[p.id][q.id]={w:0,l:0})});
  allGames(d).filter(isFinal).forEach(g=>{
    const hp=ps.find(p=>a[p.id]===g.home), ap=ps.find(p=>a[p.id]===g.away);
    if(hp&&ap){ if(g.hs>g.as){m[hp.id][ap.id].w++;m[ap.id][hp.id].l++} else {m[ap.id][hp.id].w++;m[hp.id][ap.id].l++} }
  });
  return m;
}

/* ======================= THEME ======================= */
function applyTheme(){
  const d=D(); const code=(d.draft.assignments||{})[myId()];
  const r=document.documentElement.style;
  if(code){const t=T(code); r.setProperty("--tc1",t.c1); r.setProperty("--tc2", lum(t.c2)<.08?"#f2c230":t.c2); r.setProperty("--tcText",txtOn(t.c1)); document.querySelector(".brand .mark").textContent=t.abbr.slice(0,4)}
  else {r.setProperty("--tc1","#1f4fd6");r.setProperty("--tc2","#f2c230");r.setProperty("--tcText","#fff");document.querySelector(".brand .mark").textContent="MD"}
}
function fillMe(){
  const d=D(), sel=document.getElementById("me"), cur=myId();
  sel.innerHTML=`<option value="">Guest</option>`+(d.draft.players||[]).filter(p=>p.active).map(p=>`<option value="${p.id}" ${p.id===cur?"selected":""}>${esc(p.name)}</option>`).join("");
}
document.getElementById("me").onchange=e=>{store.set("macdyn.me",e.target.value);render()};

/* ======================= VIEWS ======================= */
const views = {home,draft,schedule,standings:standingsView,stats,rivals,rules};
function route(){const h=location.hash.slice(1);return views[h]?h:"home"}
function render(){
  const d=D(); fillMe(); applyTheme();
  const r=route();
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+r));
  const cw=currentWeek(d);
  document.getElementById("seasonLbl").textContent=`· Season ${d.season.season||1} · ${cw?("Week "+cw):(Object.keys(d.draft.assignments||{}).length?"Preseason":"Draft Night")}`;
  document.getElementById("demoBanner").hidden=!demo;
  document.getElementById("view").innerHTML = views[r](d);
  if(r==="draft") mountWheel();
  bindView(r);
  renderTicker(d);
}
window.addEventListener("hashchange",render);

function teamLine(d,c){const o=ownerOf(d,c);return o?`<span class="utag">${esc(o.name)}</span>`:""}

function home(d){
  const ps=players(d), a=d.draft.assignments||{}, cw=currentWeek(d);
  const drafted=ps.filter(p=>a[p.id]).length;
  if(!(d.season.weeks||[]).length){
    return `<div class="pagetitle"><div><div class="kicker">${drafted<ps.length?"Draft night":"Preseason"}</div><h2>${drafted<ps.length?"Spin for your program":"The coaches are set"}</h2></div></div>
    <div class="grid g-home">
      <div class="panel"><div class="ph"><h2>Coaching Staff</h2><span class="tag">${drafted}/${ps.length} assigned</span></div>
        ${userTable(d,false)}
        <div class="pb" style="display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line)">
          <a class="btn" href="#draft" style="text-decoration:none">${drafted<ps.length?"Go to the wheel":"View draft board"}</a>
          <button class="btn ghost" id="demoOn">Preview with sample data</button>
        </div></div>
      <div class="panel"><div class="ph"><h2>Next Steps</h2></div>
        <ol class="rules">
          <li><span class="rk">1 · Spin</span><span class="rv">Everyone gets a MAC program off the wheel.</span></li>
          <li><span class="rk">2 · Schedule</span><span class="rv">Set the conference schedule so every coach plays every other coach, then send Claude a screenshot.</span></li>
          <li><span class="rk">3 · Play</span><span class="rv">After each game, send the box score photo. Standings, stats and rivalries update here.</span></li>
        </ol></div>
    </div>`;
  }
  const wk0=(d.season.weeks||[]).find(w=>w.week===cw)||{games:[]};const wk={...wk0,games:(wk0.games||[]).map(g=>({...g,week:wk0.week}))};
  const userGames=wk.games.filter(g=>ownerOf(d,g.home)||ownerOf(d,g.away));
  const feat=userGames.find(g=>ownerOf(d,g.home)&&ownerOf(d,g.away))||userGames[0];
  const lastWk=(d.season.weeks||[]).filter(w=>w.week<cw).slice(-1)[0];
  const lastUser=(lastWk?.games||[]).map(g=>({...g,week:lastWk.week})).filter(g=>isFinal(g)&&(ownerOf(d,g.home)||ownerOf(d,g.away)));
  return `<div class="pagetitle"><div><div class="kicker">Week ${cw}</div><h2>${feat&&ownerOf(d,feat.home)&&ownerOf(d,feat.away)?"Game of the Week":"This Week"}</h2></div></div>
  <div class="grid g-home">
    <div class="grid">
      ${feat?heroCard(d,feat):`<div class="panel"><div class="empty"><b>Bye week for the coaches</b></div></div>`}
      <div class="panel"><div class="ph"><h2>Week ${cw} — Coaches' Games</h2><a class="tag" href="#schedule" style="color:var(--tc2)">Full schedule →</a></div>
        <div class="pb"><div class="games">${userGames.map(g=>gameCard(d,g)).join("")||`<div class="empty">No coach games this week.</div>`}</div></div></div>
      <div class="panel"><div class="ph"><h2>Stat Leaders</h2><span class="tag">Coaches' teams</span></div>${leaders(d)}</div>
    </div>
    <div class="grid" style="align-content:start">
      <div class="panel"><div class="ph"><h2>Ready to Advance</h2><span class="tag">Week ${cw}</span></div><div class="pb">${readyBoard(d,cw)}</div></div>
      <div class="panel"><div class="ph"><h2>Coaches' Standings</h2></div>${userTable(d,true)}</div>
      ${lastUser.length?`<div class="panel"><div class="ph"><h2>Last Week</h2><span class="tag">Week ${lastWk.week}</span></div><div class="pb"><div class="games" style="grid-template-columns:1fr">${lastUser.map(g=>gameCard(d,g)).join("")}</div></div></div>`:""}
    </div>
  </div>
  ${!demo?"":""}`;
}
function heroCard(d,g){
  const h=T(g.home), a=T(g.away), fin=isFinal(g);
  const side=(c,t,s,r)=>`<div class="side ${r?"r":""}">${badge(c,"lg")}<div><div class="tname">${esc(t.school)}</div><div class="tsub">${esc(t.mascot)} ${teamLine(d,c)}</div>${fin?`<div class="score">${s}</div>`:""}</div></div>`;
  return `<div class="panel" style="--h1:${a.c1};--h2:${h.c1}"><div class="hero">${side(g.away,a,g.as,false)}<div class="vs">@<small>${fin?"FINAL":"WEEK "+g.week}</small></div>${side(g.home,h,g.hs,true)}</div></div>`;
}
function gameCard(d,g){
  const fin=isFinal(g), mq=ownerOf(d,g.home)&&ownerOf(d,g.away);
  const row=(c,s,o)=>{const t=T(c),own=ownerOf(d,c);const cls=fin?(s>o?"win":"lose"):"";
    return `<div class="grow ${cls}">${badge(c,"sm")}<div class="nm">${esc(t.school)}<small>${own?`<span class="utag">${esc(own.name)}</span> `:""}${t.ovr?t.ovr+" OVR":t.ext?"Non-conference":""}</small></div><div class="sc">${fin?s:""}</div></div>`};
  return `<div class="gcard ${mq?"marquee":""}"><div class="gh"><span>${mq?"★ Coach vs Coach":g.conf===false||!(TEAMS[g.home]&&TEAMS[g.away])?"Non-conference":"MAC"}</span><span class="st ${fin?"":"live"}">${fin?"Final":"Week "+g.week}</span></div>${row(g.away,g.as,g.hs)}${row(g.home,g.hs,g.as)}</div>`;
}
function userTable(d,withRec){
  const ps=players(d), a=d.draft.assignments||{}, st=standings(d), m=h2h(d), me=myId();
  const rows=ps.map(p=>{const c=a[p.id];const r=st.find(x=>x.code===c)||{w:0,l:0,cw:0,cl:0};
    const hw=Object.values(m[p.id]||{}).reduce((s,x)=>s+x.w,0), hl=Object.values(m[p.id]||{}).reduce((s,x)=>s+x.l,0);
    return {p,c,r,hw,hl}}).sort((x,y)=>withRec?((y.hw-y.hl)-(x.hw-x.hl)||(y.r.w-y.r.l)-(x.r.w-x.r.l)):0);
  return `<div class="scroll"><table><thead><tr><th>Coach</th><th>Program</th>${withRec?`<th class="n">vs Coaches</th><th class="n">Overall</th>`:`<th class="n">OVR</th>`}</tr></thead><tbody>
    ${rows.map(x=>`<tr class="${x.p.id===me?"me":""}"><td class="big">${esc(x.p.name)}</td><td>${x.c?`<div class="tcell">${badge(x.c,"sm")}<span class="nm">${esc(T(x.c).school)}</span></div>`:`<span style="color:var(--dim)">Awaiting spin</span>`}</td>
    ${withRec?`<td class="n big">${x.hw}-${x.hl}</td><td class="n">${x.r.w}-${x.r.l}</td>`:`<td class="n big">${x.c?T(x.c).ovr:"—"}</td>`}</tr>`).join("")}
  </tbody></table></div>`;
}
function readyBoard(d,wk){
  const ps=players(d), done=(d.ready&&d.ready.week===wk&&d.ready.done)||{};
  const n=ps.filter(p=>done[p.id]).length;
  return `<div class="ready">${ps.map(p=>`<button class="rd ${done[p.id]?"done":""}" data-ready="${p.id}" ${canWrite?"":"disabled"}><b>${esc(p.name)}</b><span>${done[p.id]?"✓ Played":"Not yet"}</span></button>`).join("")}</div>
  <div style="margin-top:10px;color:var(--mute);font-weight:500;font-size:13px">${n===ps.length?"<b style='color:var(--win)'>Everyone's in — advance the week.</b>":`${ps.length-n} still to play.`}</div>`;
}

/* ---------- LEADERS / STATS ---------- */
const STATCATS = {
  passing:{label:"Passing",cols:[["cmp","CMP"],["att","ATT"],["passYds","YDS"],["passTd","TD"],["int","INT"]],sort:"passYds",fmt:p=>p.passYds},
  rushing:{label:"Rushing",cols:[["car","CAR"],["rushYds","YDS"],["ypc","YPC"],["rushTd","TD"]],sort:"rushYds"},
  receiving:{label:"Receiving",cols:[["rec","REC"],["recYds","YDS"],["ypr","YPR"],["recTd","TD"]],sort:"recYds"},
  defense:{label:"Defense",cols:[["tkl","TKL"],["tfl","TFL"],["sacks","SACK"],["defInt","INT"]],sort:"tkl"}
};
function statRows(d,cat,usersOnly){
  const a=Object.values(d.draft.assignments||{});
  return (d.season.playerStats||[]).map(p=>({...p,ypc:p.car?(p.rushYds/p.car).toFixed(1):"",ypr:p.rec?(p.recYds/p.rec).toFixed(1):""}))
    .filter(p=>(p[STATCATS[cat].sort]||0)>0 && (!usersOnly||a.includes(p.team)))
    .sort((x,y)=>(y[STATCATS[cat].sort]||0)-(x[STATCATS[cat].sort]||0));
}
function leaders(d){
  const blocks=[["passing","Passing Yards","passYds"],["rushing","Rushing Yards","rushYds"],["receiving","Receiving Yards","recYds"]];
  return `<div class="leaders">${blocks.map(([cat,lbl,k])=>{const r=statRows(d,cat,true);const t=r[0];
    return `<div class="ldr"><div class="cat">${lbl}</div>${t?`<div class="top">${badge(t.team,"sm")}<div class="pn">${esc(t.name)}<small>${esc(T(t.team).school)} · ${esc(t.pos||"")}</small></div><div class="val" style="margin-left:auto">${t[k].toLocaleString()}</div></div>
    <ol>${r.slice(1,4).map(p=>`<li><span>${esc(p.name)} · ${T(p.team).abbr}</span><b>${p[k].toLocaleString()}</b></li>`).join("")}</ol>`:`<div style="color:var(--dim)">No stats yet</div>`}</div>`}).join("")}</div>`;
}
let statCat="passing", statUsers=true, schedWeek=null, schedFilter="all";
function stats(d){
  const c=STATCATS[statCat], rows=statRows(d,statCat,statUsers), me=(d.draft.assignments||{})[myId()];
  return `<div class="pagetitle"><div><div class="kicker">Season ${d.season.season||1}</div><h2>Player Stats</h2></div></div>
  <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;justify-content:space-between">
    <div class="chips">${Object.entries(STATCATS).map(([k,v])=>`<button class="chip ${k===statCat?"on":""}" data-cat="${k}"><span>${v.label}</span></button>`).join("")}</div>
    <div class="chips"><button class="chip ${statUsers?"on":""}" data-su="1"><span>Coaches' teams</span></button><button class="chip ${!statUsers?"on":""}" data-su="0"><span>All MAC</span></button></div>
  </div>
  <div class="panel"><div class="ph"><h2>${c.label} Leaders</h2><span class="tag">${rows.length} players</span></div>
  ${rows.length?`<div class="scroll"><table><thead><tr><th>#</th><th>Player</th><th>Team</th><th>Pos</th><th class="n">GP</th>${c.cols.map(([k,l])=>`<th class="n">${l}</th>`).join("")}</tr></thead><tbody>
  ${rows.map((p,i)=>`<tr class="${p.team===me?"me":ownerOf(d,p.team)?"user":""}"><td class="rank">${i+1}</td><td class="big">${esc(p.name)}</td><td><div class="tcell">${badge(p.team,"sm")}<span class="nm">${T(p.team).abbr}</span>${teamLine(d,p.team)}</div></td><td>${esc(p.pos||"")}</td><td class="n">${p.gp??""}</td>${c.cols.map(([k])=>`<td class="n ${k===c.sort?"big":""}">${p[k]??0}</td>`).join("")}</tr>`).join("")}
  </tbody></table></div>`:`<div class="empty"><b>No ${c.label.toLowerCase()} stats yet</b>Send Claude a box score screenshot after each game and the leaderboards fill in here.</div>`}</div>`;
}

/* ---------- SCHEDULE ---------- */
function schedule(d){
  const ws=d.season.weeks||[];
  if(!ws.length) return `<div class="pagetitle"><div><div class="kicker">Season ${d.season.season||1}</div><h2>Schedule</h2></div></div>
    <div class="panel"><div class="empty"><b>Schedule not imported yet</b>Once the dynasty is created, send Claude screenshots of the schedule (or each coach's schedule) and every week shows up here.</div></div>`;
  if(schedWeek==null||!ws.find(w=>w.week===schedWeek)) schedWeek=currentWeek(d);
  const wk=ws.find(w=>w.week===schedWeek), a=d.draft.assignments||{};
  let games=(wk.games||[]).map(g=>({...g,week:wk.week}));
  if(schedFilter==="coaches") games=games.filter(g=>ownerOf(d,g.home)||ownerOf(d,g.away));
  else if(schedFilter!=="all") games=games.filter(g=>g.home===a[schedFilter]||g.away===a[schedFilter]);
  games=[...games].sort((x,y)=>(!!(ownerOf(d,y.home)&&ownerOf(d,y.away))-!!(ownerOf(d,x.home)&&ownerOf(d,x.away)))||(!!(ownerOf(d,y.home)||ownerOf(d,y.away))-!!(ownerOf(d,x.home)||ownerOf(d,x.away))));
  return `<div class="pagetitle"><div><div class="kicker">Season ${d.season.season||1}</div><h2>Schedule</h2></div></div>
  <div class="chips" style="margin-bottom:12px">${ws.map(w=>{const hasMq=(w.games||[]).some(g=>ownerOf(d,g.home)&&ownerOf(d,g.away));return `<button class="chip ${w.week===schedWeek?"on":""} ${hasMq?"has":""}" data-wk="${w.week}"><span>${w.label||("Wk "+w.week)}</span></button>`}).join("")}</div>

function drawWheel(){
  const cv=document.getElementById("wheel"); if(!cv) return;
  const d=D(), codes=eligible(d), ctx=cv.getContext("2d"), W=cv.width, R=W/2-20, cx=W/2, cy=W/2;
  ctx.clearRect(0,0,W,W);
  // rim
  ctx.beginPath();ctx.arc(cx,cy,R+16,0,Math.PI*2);ctx.fillStyle="#f2c230";ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,R+6,0,Math.PI*2);ctx.fillStyle="#05070c";ctx.fill();
  if(!codes.length){ctx.fillStyle="#8b97b3";ctx.font="italic 800 60px 'Barlow Condensed'";ctx.textAlign="center";ctx.fillText("NO TEAMS LEFT",cx,cy-220);return}
  const seg=Math.PI*2/codes.length;
  codes.forEach((c,i)=>{
    const t=TEAMS[c], a0=rot+i*seg-Math.PI/2, a1=a0+seg;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a0,a1);ctx.closePath();ctx.fillStyle=t.c1;ctx.fill();
    // accent band
    ctx.beginPath();ctx.arc(cx,cy,R,a0,a1);ctx.arc(cx,cy,R-26,a1,a0,true);ctx.closePath();ctx.fillStyle=t.c2;ctx.fill();
    ctx.strokeStyle="#05070c";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+R*Math.cos(a0),cy+R*Math.sin(a0));ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(a0+seg/2);ctx.textAlign="right";ctx.textBaseline="middle";ctx.fillStyle=txtOn(t.c1);
    const fs=Math.min(62, 360/codes.length*2.6);
    if(WLOGO[c]){const sz=Math.min(140,R*seg*0.58),cr=sz*0.62,d=R-46-cr;ctx.beginPath();ctx.arc(d,0,cr,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=t.c2;ctx.stroke();ctx.save();ctx.translate(d,0);ctx.rotate(Math.PI/2);ctx.drawImage(WLOGO[c],-sz/2,-sz/2,sz,sz);ctx.restore();ctx.fillStyle=txtOn(t.c1);ctx.font=`italic 900 ${fs*.62}px 'Barlow Condensed'`;ctx.fillText(t.abbr,d-cr-16,0);}else{ctx.font=`italic 900 ${fs}px 'Barlow Condensed'`;ctx.fillText(t.abbr,R-48,0);}
    if(!WLOGO[c]){ctx.font=`italic 700 ${fs*.42}px 'Barlow Condensed'`;ctx.globalAlpha=.8;ctx.fillText(t.mascot.toUpperCase(),R-52,fs*.62);ctx.globalAlpha=1;}
    ctx.restore();
  });
  // pegs
  codes.forEach((c,i)=>{const a=rot+i*seg-Math.PI/2;ctx.beginPath();ctx.arc(cx+(R+11)*Math.cos(a),cy+(R+11)*Math.sin(a),7,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill()});
}
function mountWheel(){drawWheel(); if(document.fonts) document.fonts.ready.then(drawWheel)}
function rand(n){const u=new Uint32Array(1);crypto.getRandomValues(u);return u[0]%n}
function spin(){
  if(spinning) return; const d=D(); const codes=eligible(d), who=nextUp(d); if(!codes.length||!who) return;
  spinning=true; document.getElementById("spin").disabled=true;
  const win=rand(codes.length), seg=Math.PI*2/codes.length;
  const target=-(win+0.5)*seg + (Math.random()-.5)*seg*.7;
  const tau=Math.PI*2; const delta=((target-rot)%tau+tau)%tau;
  const start=rot, end=rot+tau*(6+rand(3))+delta, dur=6200, t0=performance.now();
  let lastSeg=null; const ptr=document.getElementById("ptr");
  const ease=x=>1-Math.pow(1-x,4);
  (function f(now){
    const p=Math.min(1,(now-t0)/dur); rot=start+(end-start)*ease(p); drawWheel();
    const s=Math.floor(((-rot%tau)+tau)%tau/seg); if(s!==lastSeg){lastSeg=s;ptr.classList.remove("tick");void ptr.offsetWidth;ptr.classList.add("tick")}
    if(p<1) requestAnimationFrame(f); else { rot=end%tau; finishSpin(who,codes[win]); }
  })(t0);
}
