<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15161c">
<meta name="robots" content="noindex, nofollow">
<title>Gridiron IQ</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f5; --card:#fff; --ink:#1b1d28; --ink2:#6f7380; --mute:#9a9eaa; --line:#eceef3; --tint:#f5f6f9;
  --accent:#f47a36; --accent-soft:#fdeee4; --good:#1e9e6a; --good-soft:#e4f6ed; --bad:#e04b4b; --bad-soft:#fdeaea;
  --shadow:0 14px 34px rgba(27,29,40,.09);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 "Plus Jakarta Sans",system-ui,sans-serif}
h1,h2,h3{margin:0;font-weight:700;line-height:1.2;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* dark header */
.hero{background:linear-gradient(135deg,#15161c 0%,#272932 55%,#3b3d47 100%);color:#fff;padding:20px 28px 176px;border-radius:0 0 32px 32px}
.hero-in{max-width:1400px;margin:0 auto}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:34px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;font-size:19px;letter-spacing:-.01em}
.mark{width:30px;height:30px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
.mark i{display:block;width:14px;height:2.5px;background:#fff;border-radius:2px;box-shadow:0 -5px 0 #fff,0 5px 0 #fff}
nav{display:flex;gap:6px}
nav a{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.62);text-decoration:none;padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px}
nav a svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a:hover{color:#fff}
nav a[aria-current]{background:rgba(255,255,255,.14);color:#fff}
.hero small{display:block;color:rgba(255,255,255,.6);font-size:14px;margin-bottom:4px}
.hero h1{font-size:30px}
.hero p{margin:10px 0 0;color:rgba(255,255,255,.7);max-width:62ch}
.back{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px;margin-bottom:14px}
.back:hover{background:rgba(255,255,255,.22)}

main{max-width:1456px;margin:-152px auto 0;padding:0 28px 48px;position:relative}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 14px}
.sec h2{font-size:18px}
.sec span{color:var(--accent);font-weight:600;font-size:14px}
.sec.onhero h2{color:#fff}

.chips{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.chip{background:#fff;border:0;border-radius:99px;padding:9px 18px;font-size:14px;font-weight:600;color:var(--ink);box-shadow:0 6px 16px rgba(27,29,40,.07)}
.chip[aria-pressed=true]{background:var(--accent);color:#fff}

/* lesson cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.lcard{border:0;padding:10px 10px 16px;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:100%;transition:transform .15s}
.lcard:hover{transform:translateY(-3px)}
.thumb{position:relative;aspect-ratio:16/10;border-radius:18px;background:#111 no-repeat;background-size:230%;box-shadow:0 10px 20px rgba(27,29,40,.18)}
.badge{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(27,29,40,.6);backdrop-filter:blur(4px);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.badge.done{background:var(--accent)}
.lcard h3{font-size:17px;margin:14px 6px 6px}
.lcard p{margin:0 6px 10px;color:var(--ink2);font-size:13.5px;line-height:1.45}
.facts{display:flex;gap:14px;margin:0 6px;font-size:13px;color:var(--ink2)}
.facts span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:3px;background:var(--accent);margin-right:6px}

/* the frame */
.work{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:22px;align-items:start}
.stage{position:relative;background:#000;border-radius:24px;overflow:hidden;line-height:0;container-type:inline-size;box-shadow:var(--shadow)}
.stage img{width:100%;height:auto;display:block}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.hit{fill:transparent;cursor:pointer;outline:none}
.hit:focus-visible{stroke:#fff;stroke-width:5;stroke-dasharray:10 8}
.stage.tap .hit:hover{fill:rgba(255,255,255,.14)}
.ring{fill:none;stroke-width:4}
.ring.o{stroke:#ff9a52} .ring.d{stroke:#fff;stroke-dasharray:11 6}
.ring.hi{stroke-width:7;fill:rgba(244,122,54,.28)}
.ring.wrong{stroke:#ff5a5a;stroke-dasharray:none;fill:rgba(224,75,75,.25)}
.guide{stroke:#fff;stroke-width:3.5;stroke-dasharray:10 9;fill:none;opacity:.9}
.route{stroke:#ff9a52;stroke-width:5;fill:none;stroke-linecap:round}
.lab{position:absolute;transform:translate(-50%,0);white-space:nowrap;pointer-events:none;
  font:700 clamp(8px,1.3cqw,12.5px)/1.25 "Plus Jakarta Sans",sans-serif;padding:.22em .7em;border-radius:99px}
.lab.o{background:var(--accent);color:#fff}
.lab.d{background:#fff;color:var(--ink);border-radius:.5em;transform:translate(-50%,-100%)}
.lab.note{background:rgba(23,24,31,.88);color:#fff;font-weight:600}
.lab.gap{background:rgba(23,24,31,.88);color:#fff;min-width:1.9em;text-align:center}
.lab.gap.open{background:#fff;color:var(--accent);outline:.16em dashed var(--accent)}
.cap{color:var(--mute);font-size:13px;margin:10px 8px 0}

/* the side sheet */
.sheet{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:22px}
.sheet h2{font-size:22px;margin-bottom:10px}
.sheet h3{font-size:16px;margin:18px 0 6px}
.sheet p{margin:0 0 12px;color:var(--ink2);max-width:60ch}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;font-size:13px;color:var(--mute);font-weight:600}
.meta b{color:var(--ink);font-weight:700;margin-right:8px}
.pill{background:var(--accent);color:#fff;border-radius:99px;padding:5px 13px;font-weight:700;font-size:13px;white-space:nowrap}
.q{font-weight:700;font-size:19px;line-height:1.35;margin:0 0 14px;color:var(--ink) !important}
.opts{display:grid;gap:10px;margin:0 0 14px}
.opt{display:flex;align-items:center;gap:12px;background:var(--tint);border:1.5px solid transparent;border-radius:16px;padding:11px 14px;text-align:left;font-weight:600;line-height:1.4}
.opt .let{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default;color:var(--mute)}
.opt.picked{color:var(--ink)}
.opt.g1{background:var(--good-soft);border-color:var(--good)} .opt.g1 .let{background:var(--good);color:#fff}
.opt.g5{background:var(--accent-soft);border-color:var(--accent)} .opt.g5 .let{background:var(--accent);color:#fff}
.opt.g0{background:var(--bad-soft);border-color:var(--bad)} .opt.g0 .let{background:var(--bad);color:#fff}
.opt.best:not(.picked){color:var(--ink);border:1.5px dashed var(--good)}
.fb{border-radius:16px;padding:12px 16px;margin:0 0 16px;color:var(--ink);line-height:1.5}
.fb.g1{background:var(--good-soft)} .fb.g5{background:var(--accent-soft)} .fb.g0{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px}
.fb.g1 b{color:var(--good)} .fb.g5 b{color:#c9581a} .fb.g0 b{color:var(--bad)}
.btn{background:var(--ink);color:#fff;border:0;border-radius:99px;padding:13px 26px;font-weight:700;box-shadow:0 10px 22px rgba(27,29,40,.22)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.orange{background:var(--accent);box-shadow:0 10px 22px rgba(244,122,54,.3)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tapcue{display:flex;align-items:center;gap:12px;background:var(--tint);border-radius:16px;padding:11px 14px;font-weight:600;color:var(--ink) !important}
.tapcue::before{content:"";flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);box-shadow:inset 0 0 0 9px var(--accent-soft),inset 0 0 0 12px var(--accent)}
.kind{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--tint);color:var(--ink2)}
.kind.frame{background:var(--accent-soft);color:#c9581a}
dl{margin:0} dt{font-weight:700;margin-top:14px;margin-bottom:4px} dd{margin:0;color:var(--ink2)}
.fine{font-size:13px;color:var(--mute) !important;margin-top:14px !important}

/* progress and captures */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.bar{height:10px;background:var(--tint);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child th,tr:last-child td{border-bottom:0}
th{color:var(--mute);font-weight:600;width:32%}
td.n{white-space:nowrap;color:var(--accent);font-weight:700;text-align:right}
ol.shots{list-style:none;padding:0;margin:0;counter-reset:s}
ol.shots li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:2px 12px;padding:10px 0;font-weight:600}
ol.shots li::before{content:counter(s);grid-row:1/3;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800}
ol.shots small{grid-column:2;color:var(--ink2);font-weight:400;font-size:13.5px}


/* video */
.vwrap{background:#000;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);line-height:0}
.vwrap video{width:100%;height:auto;display:block;aspect-ratio:16/9;background:#000}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 4px 0}
.ctrl input[type=range]{flex:1 1 180px;accent-color:var(--accent);min-width:140px}
.cbtn{background:#fff;border:0;border-radius:99px;padding:8px 15px;font-weight:700;font-size:13.5px;box-shadow:0 6px 16px rgba(27,29,40,.07)}
.cbtn[aria-pressed=true]{background:var(--ink);color:#fff}
.cbtn.main{background:var(--accent);color:#fff;min-width:78px}
.tabs{display:flex;gap:10px;margin:0 0 14px;flex-wrap:wrap}
@media(max-width:760px){.vwrap{border-radius:18px}}

/* coverage guide */
.guide-card{margin-top:4px}
.gsec h4{margin:16px 0 6px;font-size:14px;font-weight:800;color:var(--ink)}
.gsec ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.gsec li{position:relative;padding-left:22px;color:var(--ink2);line-height:1.45;font-size:14.5px}
.gsec li::before{content:"";position:absolute;left:4px;top:.55em;width:8px;height:8px;border-radius:3px;background:var(--mute)}
.gsec.good li::before{background:var(--good)} .gsec.bad li::before{background:var(--bad)}
.gconf{margin:14px 0 0 !important;background:var(--tint);border-radius:14px;padding:10px 14px;color:var(--ink) !important;font-size:14.5px}
details.more{margin:0 0 16px;border-radius:16px;background:var(--tint);padding:4px 16px 14px}
details.more summary{cursor:pointer;font-weight:700;padding:10px 0 6px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.more summary::after{content:"+";font-size:20px;color:var(--accent);font-weight:800}
details.more[open] summary::after{content:"–"}
details.more summary::-webkit-details-marker{display:none}
.gcols{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px;align-items:start}
@media(max-width:980px){.work,.cols{grid-template-columns:1fr}}
@media(max-width:760px){
  body{padding-bottom:88px}
  .hero{padding:18px 18px 150px;border-radius:0 0 26px 26px}
  .bar-top{margin-bottom:24px}
  .hero h1{font-size:24px}
  main{padding:0 14px 24px;margin-top:-132px}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;justify-content:space-around;gap:0;padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;box-shadow:0 -8px 28px rgba(27,29,40,.1)}
  nav a{flex-direction:column;gap:3px;padding:8px 6px;font-size:11px;color:var(--mute);position:relative;border-radius:12px}
  nav a svg{width:23px;height:23px}
  nav a:hover{color:var(--ink)}
  nav a[aria-current]{background:none;color:var(--accent)}
  nav a[aria-current]::before{content:"";position:absolute;top:-8px;left:50%;width:22px;height:3px;margin-left:-11px;border-radius:0 0 3px 3px;background:var(--accent)}
  .stage{border-radius:18px}
  .sheet{padding:18px}
}
@media(prefers-reduced-motion:reduce){.lcard{transition:none}}
</style>
</head>

function Stage(f){

  const defs=svg.firstChild,labs=el('div');
  const root=el('div',{class:'stage'},[el('img',{src:F.src,alt:F.title,width:W,height:H}),svg,labs]);
  const pct=(x,y)=>`left:${x/W*100}%;top:${y/H*100}%`;
  function note(x,y,text,cls,align){const n=el('div',{class:'lab '+cls,style:pct(x,y)},text);if(align==='l')n.style.transform='none';if(align==='r')n.style.transform='translate(-100%,0)';labs.append(n);}
  function draw(o={}){
    svg.replaceChildren(defs);labs.replaceChildren();

    (o.layers||[]).forEach(k=>{const L=F.L[k];if(!L)return;
      (L.rings||[]).forEach(id=>ring.add(id));

      (L.gaps||[]).forEach(g=>note(g[0],L.gy,g[1]+(g[2]?' open':''),'gap'+(g[2]?' open':'')));
    });
    const P=F.P.map(a=>pOf(f,a[0]));
    P.forEach(p=>{
      if(ring.has(p.id)||hi.has(p.id)||wrong.has(p.id))
        svg.append(sv('ellipse',{class:`ring ${p.s}${hi.has(p.id)?' hi':''}${wrong.has(p.id)?' wrong':''}`,cx:p.ft[0],cy:p.ft[1],rx:p.hit[2]*1.15,ry:p.hit[2]*.36}));

{id:'front',f:'a1',pos:'50% 50%',side:'Offense',unit:'Fronts and box count',title:'Read the front',blurb:'Hands down, the standing backer, and what seven in the box means.',steps:[
 {k:'info',ph:'Introduce',h:'Start with who is on the line',body:['The front is the group of defenders close enough to play the run or rush the passer right now. Linemen have a hand near the ground. Anyone else standing on the line is a question to answer before the snap.','Here the defense is in white.']},
 {k:'choice',ph:'Observe',dim:'rec',q:'How many defenders are down in a lineman\'s stance?',opts:[['Three',0,'There are two ends and two tackles.'],['Four',1,'Two ends and two tackles: a four-down front.'],['Five',0,'The fifth man on the line is standing up.']],after:{rings:['deL','dtL','dtR','deR'],labels:['deL','dtL','dtR','deR']}},
 {k:'tap',ph:'Identify',dim:'rec',q:'A fifth defender is on the line, standing up. Tap him.',ok:['sam'],yes:'He is over the tight end and wing, the side with the extra blockers. He can rush, set the edge or drop into coverage.',no:'He is on the right, standing over the tight end and wing. The other standing defenders are 5 yards or more off the ball.',after:{layers:['front'],labels:['sam']}},
 {k:'tap',ph:'Identify',dim:'rec',q:'Tap one of the two linebackers behind the line.',ok:['lbL','lbR'],yes:'Two linebackers at 5 yards, stacked behind the tackles.',no:'The two linebackers are 5 yards deep, directly behind the defensive tackles.',after:{layers:['lbs'],labels:['lbL','lbR']}},
 {k:'choice',ph:'Predict',dim:'dec',q:'Five on the line and two linebackers make seven in the box. The offense has seven blockers on or near the line. What does that tell you?',opts:[['The run game is even, and nobody extra is coming',1,'Seven for seven, and both safeties are deep. Nothing in this picture says blitz.'],['A blitz is coming',0,'Nobody extra has walked up, and both safeties are 11 yards deep.'],['The defense is light against the run',.5,'It is even, not light. The two deep safeties are the defenders who are not helping on the run.']],after:{layers:['front','lbs','shell']}},
 {k:'info',ph:'Review',h:'A picture, not a promise',body:['Four down, a standing backer on the strong side, two linebackers at 5 yards. That is the picture before the snap. The next read is the players behind them.'],show:{layers:['front','lbs'],labels:['sam','lbL','lbR']}}
]},
{id:'shell',f:'a1',pos:'50% 30%',side:'Offense',unit:'Coverage shells',title:'One high or two high',blurb:'Count the deep safeties on two of your plays, then watch each one develop.',steps:[
 {k:'info',ph:'Introduce',h:'Count the deep safeties',body:['One deep safety in the middle means the middle of the field is closed: think Cover 1 or Cover 3. Two deep safeties means it is open: think Cover 2 or Cover 4.','Depth is the tell. A safety at 10 yards or more is showing deep.']},
 {k:'tap',ph:'Observe',dim:'rec',q:'Tap a deep safety.',ok:['sL','sR'],yes:'Two safeties, each about 11 yards deep, each on a hash.',no:'The safeties are the two defenders about 11 yards deep, one on each hash.',after:{layers:['shell'],labels:['sL','sR'],hi:['sL','sR']}},
 {k:'choice',ph:'Identify',dim:'rec',q:'How many deep safeties, and is the middle of the field open or closed?',opts:[['One, closed',0,'There are two, and neither is standing in the middle.'],['Two, open',1,'Two high. Nobody is in the deep middle before the snap.'],['None',0,'Two defenders are 11 yards deep.']],after:{layers:['shell']}},
 {k:'clip',ph:'Reveal',clip:'p01',h:'Watch the two safeties',body:['The defense called Cover 2. Press Snap, then step forward a frame at a time: both safeties back up and widen to their halves of the field.']},
 {k:'tap',ph:'Observe',f:'b1',dim:'rec',q:'A different play. The defense is in navy here. Tap the deepest defender.',ok:['fs'],yes:'One safety, about 16 yards deep, in the exact middle of the field.',no:'The deepest defender is the safety in the middle of the field, about 16 yards off the ball.',after:{layers:['one'],labels:['fs']}},
 {k:'choice',ph:'Identify',f:'b1',dim:'rec',q:'How many deep safeties, and is the middle open or closed?',opts:[['One, closed',1,'One high. The middle of the field has a defender standing in it.'],['Two, open',0,'Only one defender is deeper than 8 yards.'],['None',0,'The free safety is 16 yards deep.']],after:{layers:['one']}},
 {k:'tap',ph:'Predict',f:'b1',dim:'rec',q:'Every defense has two safeties. Tap the one who has come down.',ok:['ss'],yes:'He is 5 yards deep over the right wing. A safety that low is playing man or the run, not deep zone.',no:'He is on the right, 5 yards deep over the wing. A safety that low is playing man or the run, not deep zone.',after:{layers:['one','down'],labels:['fs','ss']}},
 {k:'clip',ph:'Reveal',clip:'p14',h:'Watch the one safety',body:['The defense called Cover 1. The free safety stays in the middle while everyone else turns and runs with a receiver.']},
 {k:'info',ph:'Review',h:'Recognition before reaction',body:['Two high on the hashes, or one high in the middle. That single count narrows the coverage before the ball is snapped, and the first second after the snap confirms it.'],f:'b1',show:{layers:['one','down'],labels:['fs','ss']}}
]},
{id:'verts',f:'a1',pos:'50% 40%',side:'Offense',unit:'Play study',title:'Four Verticals against Cover 2',blurb:'Your own rep: the read before the snap, the picture after it, and the full play.',steps:[
 {k:'info',ph:'Introduce',h:'The call',body:['You called Four Verticals: four receivers run straight up the field. The defense called Cover 2.','The idea is simple arithmetic. Four deep routes, two deep safeties.'],show:{layers:['shell','verts']}},
 {k:'choice',ph:'Predict',dim:'rec',q:'Two deep safeties against four vertical routes. Which defenders are under the most stress?',opts:[['The safeties: each has two routes on his half and can take only one',1,'That is the whole play. Each safety is caught between the outside route and the seam on his side.'],['The corners',.5,'They are stressed too, but they have a safety over the top. The safeties have nobody behind them.'],['The defensive line',0,'They rush either way. The stress is on the deep defenders.']],after:{layers:['shell','verts'],hi:['sL','sR']}},
 {k:'choice',ph:'Decide',dim:'dec',q:'What do you watch as you drop back?',opts:[['One safety, and throw to whichever of his two routes he leaves',1,'Pick a side before the snap and read that safety. He cannot be right twice.'],['Both safeties at once',.5,'You cannot track both. Pick a side and read one.'],['The pass rush',0,'Feel the rush. Your eyes belong on the safety.'],['Your favorite receiver',0,'That turns a read into a guess.']],after:{layers:['shell','verts']}},
 {k:'tap',ph:'Observe',f:'a2',dim:'rec',q:'Two seconds after the snap. Tap the defender who has run to the deep middle.',ok:['mk'],yes:'A linebacker has dropped between the safeties. That is the Tampa 2 version of Cover 2, and it takes away the middle seam.',no:'He is in the center of the field, between the two safeties. A linebacker has dropped there: the Tampa 2 version of Cover 2, which takes away the middle seam.',after:{layers:['tampa'],labels:['mk','s2l','s2r']}},
 {k:'choice',ph:'Decide',f:'a2',dim:'dec',q:'With the middle taken away, where is the space?',opts:[['Down a sideline, outside the safety',1,'On the left, the safety is about 12 yards inside the receiver. A ball thrown now fits between the corner underneath and the safety over the top.'],['The deep middle',0,'Three defenders are converging there.'],['A short dump to the back',.5,'Safe, and sometimes right. But this picture has a deep throw open.']],after:{layers:['tampa'],labels:['wl','cl','s2l'],hi:['wl']}},
 {k:'clip',ph:'Reveal',clip:'p01',h:'Now watch your rep',body:['See which way each safety goes and where the ball ends up. Judge the decision first and the result second: a sound read can still lose to a great play.']},
 {k:'info',ph:'Review',h:'What carries over',body:['Against two high safeties, vertical routes make each safety choose. Read one of them. If a linebacker runs the middle, the sideline windows open up.'],f:'a2',show:{layers:['tampa']}}
]},
{id:'cover1',f:'b1',pos:'50% 34%',side:'Defense',unit:'Play study',title:'Cover 1 from the defense',blurb:'One deep safety and everyone else in man. See what the call asks of each player.',steps:[
 {k:'info',ph:'Introduce',h:'The call',body:['You are the defense, in navy, and you called Cover 1. The player with the ring is the one you control, a defensive tackle.','Cover 1 is man coverage across the board with one safety deep in the middle as the only help.']},
 {k:'tap',ph:'Observe',dim:'rec',q:'Tap the only deep defender.',ok:['fs'],yes:'The free safety, about 16 yards deep in the middle. He is the help for everyone.',no:'It is the free safety, about 16 yards deep in the middle of the field.',after:{layers:['one'],labels:['fs']}},
 {k:'choice',ph:'Identify',dim:'rec',q:'How many receivers can go out for a pass on this play?',opts:[['Three',0,'Count the two wings and the back as well as the two receivers out wide.'],['Four',0,'Two receivers wide, two wings, and the running back.'],['Five',1,'Two receivers wide and off screen, a wing on each side, and the running back. Each one needs a defender.']],after:{layers:['ghost'],rings:['wl','wr','rb'],labels:['wl','wr','rb','cbL','cbR']}},
 {k:'tap',ph:'Identify',dim:'asg',q:'Tap the defender lined up to cover the right wing, #80.',ok:['ss'],yes:'The strong safety has come down to 5 yards, right over him. That is why only one safety is deep.',no:'It is the safety at 5 yards, directly over #80. He came down to take the wing, which is why only one safety is deep.',after:{layers:['down','one'],labels:['ss','wr'],hi:['ss']}},
 {k:'choice',ph:'Predict',dim:'asg',q:'A corner gets beaten deep down the sideline. Who can help him?',opts:[['The free safety, and it is a long run from the middle',1,'He is the only deep help, and the sideline is the farthest point from where he stands. That is the risk in Cover 1.'],['Nobody',.5,'Close to true. The free safety is the only help, and he has a long way to go.'],['The nearest linebacker',0,'The linebackers have their own men or are rushing.']],after:{layers:['one'],labels:['cbL','cbR','fs']}},
 {k:'choice',ph:'Decide',dim:'dec',q:'You are the defensive tackle. What is your job on this call?',opts:[['Rush through your gap and stay in your lane',1,'Man coverage holds up only as long as the rush gets home. Stay in your lane so the quarterback has nowhere to step up.'],['Drop back and help in coverage',0,'Nobody is asking the tackle to cover. Leaving the rush gives the quarterback all day.'],['Chase the first receiver who crosses in front of you',0,'He already has a defender. Your man is the quarterback.']],after:{hi:['dt1'],labels:['dt1']}},
 {k:'tap',ph:'Observe',f:'b2',dim:'rec',q:'Two seconds after the snap. Tap the free safety.',ok:['fs'],yes:'Still alone in the deep middle. Everyone else is running with a receiver.',no:'He is still in the deep middle, alone. Everyone else is running with a receiver.',after:{layers:['man'],labels:['fs','lbrb','rb']}},
 {k:'clip',ph:'Reveal',clip:'p14',h:'Now watch your rep',body:['Two receivers cross in the middle and each is chased by a defender. A defender leaves to follow the back. Those are the signs of man coverage, from either side of the ball.']},
 {k:'info',ph:'Review',h:'What carries over',body:['One safety deep in the middle and defenders with their backs to the quarterback: that is Cover 1. On offense, crossing routes and the sideline shot are how you attack it. On defense, the rush has to get there.'],f:'b2',show:{layers:['man']}}
]},
{id:'zone',f:'c1',pos:'50% 52%',side:'Defense',unit:'Play study',title:'Stopping inside zone',blurb:'Gaps, the extra safety, and what the tackle you control has to do.',steps:[
 {k:'info',ph:'Introduce',h:'The call',body:['You are the defense, in navy, in Cover 3. The offense runs inside zone with a lead blocker.','Run defense is about gaps. Every space between blockers needs a defender assigned to it.']},
 {k:'choice',ph:'Observe',dim:'rec',q:'How many defenders are on the line of scrimmage?',opts:[['Four',0,'Count the linebacker standing wide on the left edge.'],['Five',1,'Four linemen and a linebacker standing on the left edge.'],['Six',0,'The safety on the right is 4 yards back, off the line.']],after:{rings:['sam','dt1','dt2','dt3','deR'],labels:['sam','dt1','dt2','dt3','deR']}},
 {k:'tap',ph:'Identify',dim:'rec',q:'A safety has walked down outside the tight end. Tap him.',ok:['ss'],yes:'With one safety deep, the other becomes an extra run defender. He is the edge player on that side.',no:'He is on the right, 4 yards deep and outside the tight end. With one safety deep, the other becomes an extra run defender.',after:{layers:['down','one'],labels:['ss','fs']}},
 {k:'choice',ph:'Identify',dim:'asg',q:'Which gaps have no defender lined up in them right now?',opts:[['Both A gaps',0,'A tackle is shaded on the center\'s left, so the left A gap is taken.'],['The right A gap, and the edge outside the tight end',1,'Nobody is between the center and right guard, and nobody is on the line outside the tight end.'],['The left B gap and the left C gap',0,'You are in the left B gap, and the standing linebacker has the left edge.']],after:{layers:['gaps']}},
 {k:'choice',ph:'Predict',dim:'asg',q:'Who is responsible for those two open spaces?',opts:[['The linebacker behind the right A gap, and the safety who came down',1,'Second-level players fill what the line does not cover. The linebacker fits the A gap; the safety sets the edge.'],['The defensive tackles',0,'They already have gaps. Leaving one to chase another opens a new hole.'],['The corners',0,'They are out wide on the receivers.']],after:{layers:['gaps','lbs','down'],hi:['will','ss']}},
 {k:'choice',ph:'Decide',dim:'dec',q:'You are the tackle in the left B gap. The line in front of you steps to your left as one. What do you do?',opts:[['Stay in your gap and fight across the blocker\'s face',1,'Zone blocking wants you to get washed past your gap. Hold it, stay square, and the back has one less place to go.'],['Run around the block to chase the ball',.5,'It works when you are fast enough. When you are not, you have just opened your gap for a cutback.'],['Back off the line and wait',0,'That gives the blockers free movement and the back a head start.']],after:{layers:['gaps'],hi:['dt1'],labels:['dt1']}},
 {k:'tap',ph:'Observe',f:'c2',dim:'rec',q:'One second after the snap. Tap the lead blocker.',ok:['lead'],yes:'#44 is leading through the right side. The linebacker filling that gap has to meet him.',no:'It is #44, on the right, heading upfield ahead of the back.',after:{layers:['flow'],labels:['lead','edge']}},
 {k:'choice',ph:'Decide',f:'c2',dim:'asg',q:'The defender on the left edge is unblocked, and the play is going away from him. What is his job?',opts:[['Close down the line and watch for the cutback or the quarterback keeping it',1,'He is the backside player. If he runs flat out for the ball, the cutback lane and the quarterback are both free.'],['Sprint across the field to the ball',.5,'He might make the tackle, but he gives up the cutback and anything coming back his way.'],['Drop into pass coverage',0,'The ball has been handed off.']],after:{layers:['flow'],hi:['edge']}},
 {k:'clip',ph:'Reveal',clip:'p17',h:'Now watch your rep',body:['Step through the first second. Watch the double teams, the lead blocker, and whether each gap ends up with a defender in it.']},
 {k:'info',ph:'Review',h:'What carries over',body:['Count the gaps, know which one is yours, and stay in it. The players who make the tackle on inside zone are usually the ones the line left free: a linebacker, or the safety who came down.'],f:'c2',show:{layers:['flow']}}
]}
];

LESSONS.push(
{id:'motion',f:'m1',pos:'30% 60%',side:'Offense',unit:'Motion and shifts',title:'Motion tells you man or zone',blurb:'The same shift against two coverages. Watch who moves with it.',steps:[
 {k:'info',ph:'Introduce',h:'Make the defense move',body:['When you shift or motion a player, the defense has to react. How it reacts tells you the coverage before the ball is snapped.','In man coverage a defender travels with his receiver. In zone, defenders hold their areas and only slide.'],show:{layers:['three'],labels:['w3','w80','w42']}},
 {k:'choice',ph:'Observe',dim:'rec',nd:1,q:'Before anything moves, how many receivers can you see left of the tackle?',opts:[['Two',0,'#3, #80 and #42 are all on the left.'],['Three',1,'#3, #80 and #42. Nobody is on the right yet.'],['Four',0,'Three are visible.']],after:{layers:['three'],labels:['w3','w80','w42']}},
 {k:'tap',ph:'Identify',f:'m2',dim:'rec',nd:1,q:'#42 and #80 have shifted to the right, and #3 is in motion. Tap a defender who went with them.',ok:['d1','d2','d3'],yes:'He was on the other side a moment ago. Two defenders crossed the formation with #42 and #80, and a third is running with the motion.',no:'Look above #42 and #80 on the right: two defenders came across with them. A third is running across with the motion.',after:{layers:['travel'],labels:['w42','w80','w3']}},
 {k:'choice',ph:'Identify',f:'m2',dim:'rec',nd:1,q:'Defenders crossing the formation with receivers means what?',opts:[['Man coverage',1,'Each defender has a man, so when the man moves, he moves.'],['Zone coverage',0,'Zone defenders stay with their area, not with a receiver.'],['A blitz',0,'It tells you coverage, not pressure.']],after:{layers:['travel','deep']}},
 {k:'clip',ph:'Reveal',clip:'p10',h:'Watch them travel',body:['The defense called Cover 2 Man. Watch the defenders run across with the shift, then turn and chase after the snap.']},
 {k:'info',ph:'Observe',f:'m3',h:'Same shift, different call',body:['The same formation again. This time notice the corner on the right before anything moves: he is lined up with no receiver in front of him.'],show:{layers:['empty','three'],labels:['cbR']}},
 {k:'tap',ph:'Identify',f:'m4',dim:'rec',nd:1,q:'After the same shift. Tap a corner who is still where he started.',ok:['cbL','cbR'],yes:'Both corners held their side. The receivers left and nobody followed them.',no:'Both corners are still out wide where they started. The receivers left and nobody followed.',after:{layers:['stay','slide'],labels:['w42','w80','w3']}},
 {k:'choice',ph:'Identify',f:'m4',dim:'rec',nd:1,q:'Nobody ran across; the linebackers just slid over a gap. Man or zone?',opts:[['Man',0,'In man, defenders would have crossed with #42 and #80.'],['Zone',1,'They adjusted their areas instead of chasing receivers.']],after:{layers:['stay','slide']}},
 {k:'clip',ph:'Reveal',clip:'p11',h:'Watch them stay',body:['The defense called Cover 4. The defenders slide and stay, then drop to areas after the snap.']},
 {k:'info',ph:'Review',f:'m4',h:'What carries over',body:['One motion before the snap answers the man-or-zone question for free. Man: someone runs with him. Zone: they point, slide and stay.'],show:{layers:['stay','slide']}}
]},
{id:'blitz',f:'z1',pos:'50% 44%',side:'Offense',unit:'Pressure',title:'Spot the blitz',blurb:'A blitz that does not look like one, and what to do when it comes.',steps:[
 {k:'info',ph:'Introduce',h:'Count who can rush',body:['You are in the I-formation with the quarterback under center. The defense called Man Blitz.','Before the snap, count the defenders on the line and the ones close enough to add on.']},
 {k:'choice',ph:'Observe',dim:'rec',q:'How many defenders are on the line of scrimmage?',opts:[['Four',0,'There are two ends and three inside players.'],['Five',1,'Five on the line.'],['Six',0,'The linebackers are 5 yards back.']],after:{layers:['line']}},
 {k:'choice',ph:'Predict',dim:'rec',nd:1,q:'Five on the line, two linebackers at 5 yards, two safeties at 11. Does this look like a blitz?',opts:[['Not clearly. It could be an ordinary defense',1,'Right. Nothing here gives it away, and both linebackers are coming anyway. Good defenses hide it.'],['Yes, obviously',0,'Nobody extra has walked up and both safeties are deep. It is disguised.'],['No, it cannot be a blitz',.5,'It does not look like one, but you can never rule it out from the picture alone.']],after:{layers:['line','lbs','shell']}},
 {k:'tap',ph:'Identify',dim:'rec',nd:1,q:'Tap one of the two linebackers who will rush.',ok:['lbL','lbR'],yes:'Both linebackers come. With five on the line, that makes seven possible rushers.',no:'They are the two defenders 5 yards deep behind the line. Both come on this call.',after:{layers:['lbs'],labels:['lbL','lbR']}},
 {k:'choice',ph:'Predict',dim:'asg',q:'Your five linemen can block five. Who has to pick up the extra rushers?',opts:[['The fullback and the running back',1,'Backs are the adjustable part of the protection. If they both stay in, you have blockers but fewer receivers.'],['The receivers',0,'They are running routes.'],['Nobody; throw before they arrive',.5,'Sometimes that is the answer, but only if a route is built to be open right away.']],after:{layers:['backs','lbs'],labels:['fb','hb']}},
 {k:'tap',ph:'Observe',f:'z2',dim:'rec',nd:1,q:'A second and a half after the snap. Tap the only defender deep in the middle.',ok:['fs'],yes:'One safety rotated to the middle. Everyone else is rushing or locked on a receiver.',no:'He is in the middle of the field near the 15. One safety rotated there; everyone else is rushing or in man.',after:{layers:['one','rush'],labels:['fs']}},
 {k:'choice',ph:'Decide',f:'z2',dim:'dec',q:'Against a blitz with man coverage behind it, which throw wins?',opts:[['A quick one to a receiver who beats his man right away',1,'The ball has to be out before the rush arrives, and man coverage means one good release is enough.'],['A slow-developing deep route',0,'You will not have the time.'],['Hold the ball and scramble',.5,'It can work, but with this many rushers you are betting on your legs.']],after:{layers:['one'],labels:['wl'],hi:['wl']}},
 {k:'clip',ph:'Reveal',clip:'p04',h:'Now watch your rep',body:['Count the rushers as they come and see how long you have before the ball has to be gone.']},
 {k:'clip',ph:'Reveal',clip:'p05',h:'A second blitz',body:['Your other rep against Man Blitz, from an empty backfield. With no back to help, the ball has to come out even faster. This clip starts in the wide play-art view.']},
 {k:'info',ph:'Review',f:'z2',h:'What carries over',body:['You will not always see a blitz coming. Know before the snap who your backs are blocking and which route is your quick answer, so the decision is already made.'],show:{layers:['one','rush']}}
]},
{id:'c3',f:'t1',pos:'50% 30%',side:'Defense',unit:'Play study',title:'Four Verticals against Cover 3',blurb:'The one-high version of the same play: four deep routes against three deep defenders.',steps:[
 {k:'info',ph:'Introduce',h:'The call',body:['You are the defense, in navy, in Cover 3. The offense runs four receivers straight up the field.','Cover 3 puts three defenders deep: the free safety in the middle and a corner on each outside third.']},
 {k:'tap',ph:'Observe',dim:'rec',q:'Tap the only deep safety.',ok:['fs'],yes:'The free safety, about 17 yards deep in the middle.',no:'It is the free safety, about 17 yards deep in the middle of the field.',after:{layers:['one'],labels:['fs']}},
 {k:'choice',ph:'Identify',dim:'asg',q:'Cover 3 has three deep defenders. Who are the other two?',opts:[['The two corners, backing up to the outside thirds',1,'Each corner takes a deep third and the free safety takes the middle third.'],['The two linebackers',0,'They play underneath.'],['The safety who came down',0,'He is an underneath defender on this call.']],after:{layers:['one','corners','down'],labels:['cbL','cbR','fs']}},
 {k:'choice',ph:'Predict',dim:'rec',q:'Four vertical routes against three deep defenders. Who is in the bind?',opts:[['The free safety: a seam route on each side of him',1,'The corners each have one route. The free safety has two, and he can only break on one.'],['The corners',.5,'They are tested, but each has just one deep route to play.'],['The defensive line',0,'They rush either way.']],after:{layers:['one'],hi:['fs']}},
 {k:'tap',ph:'Observe',f:'t2',dim:'rec',nd:1,q:'Two seconds in. Tap a receiver running up a seam.',ok:['seamL','seamR'],yes:'A seam on each side of the free safety, exactly as drawn up.',no:'The seams are the two inside vertical routes, one on each side of the free safety.',after:{layers:['deep','seams'],labels:['seamL','seamR','fs']}},

/* ---------- progress (one browser only) ---------- */
const DIM={rec:'Recognition',asg:'Assignment',dec:'Decision'};
const KEY='gridiron-iq-v2';
let S={dims:{rec:[0,0],asg:[0,0],dec:[0,0]},done:{},miss:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.dims)S=Object.assign(S,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function record(dim,grade,q){S.dims[dim][0]+=grade;S.dims[dim][1]+=1;
  if(grade<1)S.miss[q]=(S.miss[q]||0)+1;else if(S.miss[q]){S.miss[q]-=1;if(!S.miss[q])delete S.miss[q];}save();}

/* ---------- step runner (lessons and practice share it) ---------- */
function runSteps(steps,onDone,defF){
  const left=el('div'),sheet=el('div',{class:'sheet'});
  let i=0,earned=0,graded=0,st=null,curF=null;
  const wrap=el('div',{class:'work'},[left,sheet]);
  function frame(f){f=f||defF;if(curF!==f){st=Stage(f);curF=f;left.replaceChildren(st.root,el('p',{class:'cap'},FR[f].title+'. Overlays are drawn on the real frame.'));}return st;}
  function next(){i++;i<steps.length?show():onDone({earned,graded,sheet,left});}
  function head(s){return el('div',{class:'meta'},[el('span',{},[el('b',{},s.ph||'Drill'),s.dim?DIM[s.dim]:'']),el('span',{class:'pill'},`${i+1} of ${steps.length}`)]);}
  function nextBtn(){const b=el('button',{class:'btn',onclick:next},i+1<steps.length?'Next':'Finish');setTimeout(()=>b.focus({preventScroll:true}),0);return b;}
  function fb(g,title,why){return el('div',{class:'fb g'+(g===1?1:g?5:0),role:'status'},[el('b',{},title),why]);}
  function show(){const s=steps[i];sheet.replaceChildren(head(s));
    if(s.k==='info'){frame(s.f).draw(s.show||{});
      sheet.append(el('h2',{},s.h),...s.body.map(t=>el('p',{},t)),nextBtn());}
    if(s.k==='clip'){const c=CLIPS.find(x=>x.id===s.clip),pl=Player(c);curF=null;
      left.replaceChildren(pl.root,el('p',{class:'cap'},clipTitle(c)+'. Your recording, starting just before the snap.'));
      sheet.append(el('h2',{},s.h),...s.body.map(t=>el('p',{},t)),el('div',{class:'row'},[nextBtn(),el('button',{class:'btn ghost',onclick:pl.restart},'Play from the start')]));}
    if(s.k==='choice'){const stg=frame(s.f);stg.draw(s.before||{});
      const box=el('div',{class:'opts'});
      s.opts.forEach((o,n)=>box.append(el('button',{class:'opt',onclick:e=>{
        [...box.children].forEach((b,j)=>{b.disabled=true;if(s.opts[j][1]===1)b.classList.add('best');});
        e.currentTarget.classList.add('picked','g'+(o[1]===1?1:o[1]?5:0));
        earned+=o[1];graded++;record(s.dim,o[1],s.q);stg.draw(s.after||{});
        sheet.append(fb(o[1],o[1]===1?'Sound.':o[1]?'Acceptable, with a catch.':'Not this one.',o[2]),nextBtn());
      }},[el('span',{class:'let'},'ABCD'[n]),el('span',{},o[0])])));
      sheet.append(el('p',{class:'q'},s.q),box);}
    if(s.k==='tap'){const f=s.f||defF,stg=frame(f);
      sheet.append(el('p',{class:'q'},s.q),el('p',{class:'tapcue'},'Tap a player in the frame.'));
      stg.draw({onTap:id=>{const ok=s.ok.includes(id);earned+=ok?1:0;graded++;record(s.dim,ok?1:0,s.q);
        const a=Object.assign({},s.after||{});a.hi=(a.hi||[]).concat(s.ok);
        if(!ok){a.wrong=[id];a.labels=(a.labels||[]).concat(id);}
        stg.draw(a);sheet.lastChild.remove();
        sheet.append(fb(ok?1:0,ok?'That\'s him.':`You tapped the ${pOf(f,id).name}.`,ok?s.yes:s.no),nextBtn());}});}
  }
  show();return wrap;
}

/* ---------- video player with film controls ---------- */
function Player(clip){
  const v=el('video',{src:`clips/${clip.id}.mp4`,poster:`clips/${clip.id}.jpg`,preload:'metadata',playsinline:'',muted:''});v.muted=true;
  const scrub=el('input',{type:'range',min:0,max:1000,value:0,'aria-label':'Position in the clip'});
  const play=el('button',{class:'cbtn main',onclick:()=>v.paused?v.play().catch(()=>{}):v.pause()},'Play');
  const speeds=el('span',{class:'row'});let rate=1;
  function paintSpeeds(){speeds.replaceChildren(...[[1,'Full speed'],[.5,'Half'],[.25,'Quarter']].map(r=>el('button',{class:'cbtn','aria-pressed':rate===r[0],onclick:()=>{rate=r[0];v.playbackRate=rate;paintSpeeds();}},r[1])));}
  paintSpeeds();
  let tgt=0;const now=()=>v.seeking?tgt:v.currentTime;const go=t=>{v.pause();tgt=Math.max(0,Math.min(t,(v.duration||99)-.03));v.currentTime=tgt;};
  v.addEventListener('play',()=>play.textContent='Pause');v.addEventListener('pause',()=>play.textContent='Play');
  v.addEventListener('timeupdate',()=>{if(v.duration)scrub.value=v.currentTime/v.duration*1000;});
  scrub.addEventListener('input',()=>{if(v.duration){v.pause();v.currentTime=scrub.value/1000*v.duration;}});
  v.addEventListener('click',()=>play.click());
  const root=el('div',{},[el('div',{class:'vwrap'},v),el('div',{class:'ctrl'},[play,
    el('button',{class:'cbtn',onclick:()=>go(0)},'Pre-snap'),el('button',{class:'cbtn',onclick:()=>go(clip.snap)},'Snap'),
    el('button',{class:'cbtn','aria-label':'Back one frame',onclick:()=>go(now()-1/30)},'‹ Frame'),el('button',{class:'cbtn','aria-label':'Forward one frame',onclick:()=>go(now()+1/30)},'Frame ›'),scrub]),
    el('div',{class:'ctrl'},speeds)]);
  return {root,v,restart:()=>{v.currentTime=0;v.playbackRate=rate;v.play().catch(()=>{});}};
}

}

function drillPool(){
  const taps=['a1','b1','c1'].flatMap(f=>FR[f].P.map(a=>pOf(f,a[0])).map(p=>({k:'tap',f,dim:'rec',q:`Tap the ${p.name}.`,ok:[p.id],yes:p.here,no:`The ${p.name} is marked now. ${p.here}`,after:{labels:[p.id]}})));
  const qs=LESSONS.flatMap(L=>L.steps.filter(s=>(s.k==='tap'||s.k==='choice')&&!s.nd&&!/^(A different|Two players|Two seconds|One second|One more|So what|Every defense|A fifth|With the middle|Who is responsible|The defender on)/.test(s.q)).map(s=>Object.assign({f:L.f},s,{ph:'Drill'})));
  return taps.concat(qs);
}
function practice(){
  hero('Reps','Practice','Call the coverage on your own clips, run quick reads on the annotated frames, or study the coverage guide.');
  const passN=CLIPS.filter(c=>c.type==='pass').length;
  const card=(pos,badge,h,p,facts,fn)=>el('button',{class:'card lcard',onclick:fn},[
    el('div',{class:'thumb',style:pos},el('span',{class:'badge done','aria-hidden':'true'},badge)),el('h3',{},h),el('p',{},p),el('div',{class:'facts'},facts.map(f=>el('span',{},f)))]);
  app.replaceChildren(el('div',{class:'grid'},[
    card(`background-image:url(clips/p14.jpg);background-size:cover;background-position:center`,'▶','Call the coverage','See the defense before the snap, name the coverage, then watch the play to check yourself.',['6 clips a round',passN+' pass plays'],coverageRound),
    card('background-image:url(frames/s_c1.jpg);background-size:cover;background-position:center','▶','Quick reads','Find positions by alignment, count the front and read the shell on your annotated frames.',['10 reads',drillPool().length+' in the pool'],quickRound),
    card('background-image:url(frames/s_a2.jpg);background-size:cover;background-position:center','i','Coverage guide','How to spot each coverage, what beats it, and what to avoid. With your own clips as examples.',[Object.keys(FAM).length+' coverages','Reference'],coverageGuide)]));
}
function coverageGuide(){
  hero('Reference','Coverage guide','How to spot each coverage before the snap, confirm it after, and attack it.',['Practice',practice]);
  app.replaceChildren(el('div',{class:'gcols'},Object.keys(FAM).map(k=>{const f=FAM[k],ex=CLIPS.filter(c=>c.fam===k);
    return el('div',{class:'sheet'},[el('div',{class:'meta'},[el('span',{},[el('b',{},(k==='c0'||k==='zb')?'Pressure':f.shell===1?'One high':'Two high')]),el('span',{class:'pill'},ex.length+(ex.length===1?' clip':' clips'))]),
      el('h2',{},f.name),famGuide(k,true),
      el('div',{class:'row',style:'margin-top:14px'},ex.slice(0,3).map(c=>el('button',{class:'cbtn',style:'background:var(--tint);box-shadow:none',onclick:()=>openClip(c)},'Watch: '+c.off+(c.side==='Offense'?' (you on offense)':' (you on defense)'))))]);})));
  window.scrollTo(0,0);
}
function quickRound(){
  const pool=drillPool().sort(()=>Math.random()-.5).slice(0,10);
  hero('Reps','Quick reads',null,['Practice',practice]);
  app.replaceChildren(runSteps(pool,r=>{r.left.replaceChildren();
    r.sheet.replaceChildren(el('div',{class:'meta'},[el('span',{},[el('b',{},'Round finished')]),el('span',{class:'pill'},`${fmt(r.earned)} of ${r.graded}`)]),
      el('h2',{},`You got ${fmt(r.earned)} of ${r.graded}`),
      el('div',{class:'row'},[el('button',{class:'btn',onclick:quickRound},'Run another round'),el('button',{class:'btn ghost',onclick:()=>go('progress')},'See my progress')]));}));
  window.scrollTo(0,0);
}
function coverageRound(){
  const list=CLIPS.filter(c=>c.type==='pass').sort(()=>Math.random()-.5).slice(0,6);
  let i=0,earned=0;
  hero('Reps','Call the coverage',null,['Practice',practice]);
  const left=el('div'),sheet=el('div',{class:'sheet'});
  app.replaceChildren(el('div',{class:'work'},[left,sheet]));
  function show(){
    const c=list[i],f=FAM[c.fam],pl=Player(c);
    left.replaceChildren(pl.root,el('p',{class:'cap'},'The clip is paused before the snap. Step through it or scrub if you want a closer look.'));
    const others=Object.keys(FAM).filter(k=>k!==c.fam).sort(()=>Math.random()-.5).slice(0,3);
    const keys=[c.fam,...others].sort((a,b)=>Object.keys(FAM).indexOf(a)-Object.keys(FAM).indexOf(b));
    const box=el('div',{class:'opts'});
    keys.forEach((k,n)=>box.append(el('button',{class:'opt',onclick:e=>{
      const g=k===c.fam?1:FAM[k].shell===f.shell?.5:0;earned+=g;record('rec',g,'Call the coverage: '+f.name);
      [...box.children].forEach((b,j)=>{b.disabled=true;if(keys[j]===c.fam)b.classList.add('best');});
      e.currentTarget.classList.add('picked','g'+(g===1?1:g?5:0));
      sheet.append(el('div',{class:'fb g'+(g===1?1:g?5:0),role:'status'},[el('b',{},g===1?'That was the call.':g?'Right shell, different coverage.':'Not this one.'),
        `The defense called ${c.def}. ${f.what}`]),el('p',{},f.watch),
        el('div',{class:'row'},[el('button',{class:'btn',onclick:()=>{i++;i<list.length?show():done();}},i+1<list.length?'Next clip':'Finish'),el('button',{class:'btn ghost',onclick:pl.restart},'Watch again')]),
        el('details',{class:'more',open:''},[el('summary',{},'How to read and beat '+f.name),famGuide(c.fam)]));
      pl.restart();
    }},[el('span',{class:'let'},'ABCD'[n]),el('span',{},FAM[k].name)])));
    sheet.replaceChildren(el('div',{class:'meta'},[el('span',{},[el('b',{},'Predict'),'Recognition']),el('span',{class:'pill'},`${i+1} of ${list.length}`)]),
      el('p',{class:'q'},'What coverage is the defense about to play?'),box);
  }
  function done(){left.replaceChildren();
    sheet.replaceChildren(el('div',{class:'meta'},[el('span',{},[el('b',{},'Round finished')]),el('span',{class:'pill'},`${fmt(earned)} of ${list.length}`)]),
      el('h2',{},`You got ${fmt(earned)} of ${list.length}`),el('p',{},'Naming the exact coverage before the snap is hard, and defenses disguise. Getting the shell right, one deep or two, is the read that matters most.'),
      el('div',{class:'row'},[el('button',{class:'btn',onclick:coverageRound},'Run another round'),el('button',{class:'btn ghost',onclick:coverageGuide},'Open the coverage guide')]));}
  show();window.scrollTo(0,0);
}

function film(){
  hero('Your captures','Film room','Every play you recorded, with slow motion and frame-by-frame stepping. The annotated frames are here too.');
  let side='All';
  const grid=el('div',{class:'grid'}),chips=el('div',{class:'chips'});
  function paint(){
    chips.replaceChildren(...['All','Offense','Defense','Annotated frames'].map(k=>el('button',{class:'chip','aria-pressed':side===k,onclick:()=>{if(k==='Annotated frames')return freeze();side=k;paint();}},k==='Offense'?'You on offense':k==='Defense'?'You on defense':k)));
    grid.replaceChildren(...CLIPS.filter(c=>side==='All'||c.side===side).map(c=>el('button',{class:'card lcard',onclick:()=>openClip(c)},[
      el('div',{class:'thumb',style:`background-image:url(clips/${c.id}.jpg);background-size:cover;background-position:center`},el('span',{class:'badge','aria-hidden':'true'},'▶')),
      el('h3',{},clipTitle(c)),el('div',{class:'facts'},[el('span',{},c.side==='Offense'?'You on offense':'You on defense'),el('span',{},c.type==='run'?'Run':'Pass')])])));
  }
  paint();
  app.replaceChildren(el('div',{class:'sec onhero'},[el('h2',{},'Clips'),el('span',{},CLIPS.length+' plays')]),chips,grid);
}
function openClip(c){
  const f=FAM[c.fam],pl=Player(c);
  hero(c.side==='Offense'?'You on offense':'You on defense',clipTitle(c),null,['All clips',film]);
  const sheet=el('div',{class:'sheet'},[el('div',{class:'meta'},[el('span',{},[el('b',{},'Play card')]),el('span',{class:'pill'},c.type==='run'?'Run':'Pass')]),
    el('dl',{},[el('dt',{},el('span',{class:'kind frame'},'Offense')),el('dd',{},c.off+(c.sure?'':'. This name is my best read of your play-call screen, not confirmed.')),
      el('dt',{},el('span',{class:'kind frame'},'Defense')),el('dd',{},c.def+', from the play-call screen.'),
      el('dt',{},el('span',{class:'kind'},'Football principle')),el('dd',{},f.what),
      el('dt',{},el('span',{class:'kind'},'What to watch')),el('dd',{},c.type==='run'?'Watch the offensive line\'s first steps, then which defender ends up unblocked at the point of attack.':f.watch)]),
    el('details',{class:'more'},[el('summary',{},'How to read and beat '+f.name),famGuide(c.fam)]),
    el('p',{class:'fine'},'Use Pre-snap and Snap to jump, then step a frame at a time through the first second of the play.')]);
  app.replaceChildren(el('div',{class:'work'},[pl.root,sheet]));window.scrollTo(0,0);
}
function freeze(f){
  f=f||'a1';const F=FR[f];
  hero('Annotated frames',F.title,'Turn overlays on and off, or tap any player for his card.',['All clips',film]);
  const st=Stage(f),sheet=el('div',{class:'sheet'});
  const on={off:false,def:false};Object.keys(F.L).forEach(k=>on[k]=false);let sel=null;
  const names=Object.assign({off:'Offense labels',def:'Defense labels'},Object.fromEntries(Object.entries(F.L).map(([k,v])=>[k,v.name])));
  const chips=el('div',{class:'chips'}),pick=el('div',{class:'chips'},Object.keys(FR).map(k=>el('button',{class:'chip','aria-pressed':k===f,onclick:()=>freeze(k)},FR[k].title.replace(/, before the snap$/,', pre-snap').replace(/, (a second|two seconds|one second).*$/,', post-snap'))));
  function redraw(){
    st.draw({layers:Object.keys(F.L).filter(k=>on[k]),labels:[].concat(on.off?ids(f,'o'):[],on.def?ids(f,'d'):[],sel?[sel]:[]),hi:sel?[sel]:[],onTap:id=>{sel=id;redraw();}});
    chips.replaceChildren(...Object.keys(names).map(k=>el('button',{class:'chip','aria-pressed':on[k],onclick:()=>{on[k]=!on[k];redraw();}},names[k])));
    if(sel){const p=pOf(f,sel),r=ROLE[p.kind];
      sheet.replaceChildren(el('div',{class:'meta'},[el('span',{},[el('b',{},'Player card')]),el('span',{class:'pill'},p.s==='o'?'Offense':'Defense')]),el('h2',{},p.tag),
        el('dl',{},[el('dt',{},el('span',{class:'kind frame'},'In this frame')),el('dd',{},p.here),
          el('dt',{},el('span',{class:'kind'},'Football principle')),el('dd',{},r[0]),
          el('dt',{},el('span',{class:'kind'},'What he reads')),el('dd',{},r[1])]),
        el('p',{class:'fine'},'A position\'s job depends on the play call. This card describes alignment and typical role.'));
    }else sheet.replaceChildren(el('h2',{},'Freeze frame'),el('p',{},'Tap any player in the frame to see where he is lined up, his typical role, and what he reads.'),
        el('div',{class:'row'},el('button',{class:'btn',onclick:()=>openClip(CLIPS.find(c=>c.id===F.clip))},'Watch this play')));
  }
  redraw();
  app.replaceChildren(el('div',{class:'sec onhero'},[el('h2',{},'Frames and overlays')]),pick,chips,el('div',{class:'work'},[st.root,sheet]));window.scrollTo(0,0);
}

function progress(){
  hero('Skill profile','Progress','Scores track the quality of your reads and decisions. Saved in this browser only.');
  const a=el('div',{class:'sheet'},[el('h2',{},'Skill profile')]);
  Object.keys(DIM).forEach(d=>{const [c,n]=S.dims[d],pc=n?Math.round(c/n*100):0;
    a.append(el('h3',{},DIM[d]),el('div',{class:'bar'},el('i',{style:`width:${pc}%`})),el('p',{class:'fine',style:'margin-top:0 !important'},n?`${pc}% across ${n} reads`:'No reads yet'));});
  const doneN=LESSONS.filter(L=>S.done[L.id]).length,nx=LESSONS.find(L=>!S.done[L.id]);
  a.append(el('p',{style:'margin-top:16px'},`${doneN} of ${LESSONS.length} lessons completed.`),
    el('div',{class:'row'},[el('button',{class:'btn',onclick:()=>nx?openLesson(nx):go('practice')},nx?'Next up: '+nx.title:'Run a practice round'),
      el('button',{class:'btn ghost',onclick:()=>{S={dims:{rec:[0,0],asg:[0,0],dec:[0,0]},done:{},miss:{}};save();progress();}},'Reset progress')]));
  const b=el('div',{class:'sheet'},[el('h2',{},'What is beating me')]);
  const miss=Object.entries(S.miss).sort((x,y)=>y[1]-x[1]).slice(0,8);
  if(miss.length){const t=el('table');miss.forEach(m=>t.append(el('tr',{},[el('td',{},m[0]),el('td',{class:'n'},m[1]+(m[1]>1?' misses':' miss'))])));b.append(t);}
  else b.append(el('p',{},'Nothing missed yet. Run a lesson or a practice round and the reads you get wrong will be listed here.'));
  app.replaceChildren(el('div',{class:'cols'},[a,b]));
}

}

const RENDER={learn,practice,'film-room':film,progress,captures};
function go(v){if(location.hash==='#'+v)route();else location.hash=v;}
function route(){const v=RENDER[location.hash.slice(1)]?location.hash.slice(1):'learn';
  document.getElementById('nav').replaceChildren(...Object.keys(VIEWS).map(k=>{const a=el('a',{href:'#'+k,html:`<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg><span>${VIEWS[k]}</span>`});if(k===v)a.setAttribute('aria-current','page');return a;}));
  RENDER[v]();window.scrollTo(0,0);}
addEventListener('hashchange',route);route();
