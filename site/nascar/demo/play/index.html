<style>

nav button.on,.btn.pri{background:var(--ac);color:#111;border-color:var(--ac);font-weight:600}

textarea,input,select{background:#222733;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px;font:inherit;width:100%}

.drv .bdg{height:30px;width:auto;flex:none}.drv .nm{flex:1;min-width:0;line-height:1.2}.drv .mk{width:40px;height:auto;flex:none}

<div style="background:#ffcc00;color:#111;text-align:center;font-size:12px;font-weight:700;padding:5px 8px">DEMO · made-up players and drivers · nothing is saved</div>

<script>
// ===== DEMO MODE: in-memory fake of Firebase + made-up data. Nothing is saved or sent anywhere. =====
(function () {
  const ME = 'jordan@demo.test', H = 3600e3, store = {}, listeners = [];
  const clone = o => JSON.parse(JSON.stringify(o)), colOf = p => p.split('/')[0];
  const snapCol = c => { const docs = Object.keys(store).filter(p => colOf(p) === c).map(p => ({ id: p.split('/').slice(1).join('/'), data: () => clone(store[p]) })); return { forEach: f => docs.forEach(f) }; };
  const snapDoc = p => ({ exists: p in store, id: p, data: () => (p in store ? clone(store[p]) : undefined) });
  const notify = p => listeners.forEach(l => { if (l.kind === 'col' && l.path === colOf(p)) l.cb(snapCol(l.path)); if (l.kind === 'doc' && l.path === p) l.cb(snapDoc(p)); });
  const write = (p, d, o) => { store[p] = (o && (o.merge || o.mergeFields)) ? Object.assign(store[p] || {}, clone(d)) : clone(d); };
  const docRef = p => ({ path: p, set: async (d, o) => { write(p, d, o); notify(p); }, onSnapshot: cb => { listeners.push({ kind: 'doc', path: p, cb }); setTimeout(() => cb(snapDoc(p)), 0); } });
  const db = {
    doc: docRef,
    collection: c => ({ onSnapshot: cb => { listeners.push({ kind: 'col', path: c, cb }); setTimeout(() => cb(snapCol(c)), 0); } }),
    batch: () => { const ops = []; return { set: (r, d, o) => ops.push([r.path, d, o]), commit: async () => { ops.forEach(([p, d, o]) => { write(p, d, o); notify(p); }); } }; },
    runTransaction: async fn => { const ops = []; await fn({ get: async r => snapDoc(r.path), set: (r, d) => ops.push([r.path, d]) }); ops.forEach(([p, d]) => { write(p, d); notify(p); }); }
  };
  const auth = { onAuthStateChanged: cb => setTimeout(() => cb({ email: ME }), 0), signInWithPopup: async () => {} };
  window.firebase = { initializeApp() {}, firestore: () => db, auth: Object.assign(() => auth, { GoogleAuthProvider: function () {} }) };

  // ---------- made-up league ----------
  let seed = 7; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const P = { 'maya@demo.test': 'Maya', 'dre@demo.test': 'Dre', [ME]: 'Jordan', 'priya@demo.test': 'Priya' };
  Object.entries(P).forEach(([e, name]) => store['members/' + e] = { name });
  const NAMES = ['Cole Ransom', 'Tyler Voss', 'Mason Pike', 'Jace Holloway', 'Rex Calder', 'Wade Brennan', 'Colt Maddox', 'Nash Delaney', 'Reid Sutter', 'Beau Garrison', 'Clay Whitlock', 'Dane Foster',
    'Heath Merrick', 'Troy Ellison', 'Grant Pruitt', 'Luke Danner', 'Kyle Brandt', 'Owen Tackett', 'Shane Redding', 'Cade Winslow', 'Brock Hadley', 'Levi Carrow', 'Zane Mercer', 'Eli Thornton',
    'Pat Lindqvist', 'Hank Rowley', 'Ray Kessler', 'Dale Penrose', 'Gus Halvorsen', 'Moe Tillman', 'Ned Calloway', 'Walt Sterling', 'Abe Fontaine', 'Vic Navarro', 'Roy Ketchum', 'Sam Okafor'];
  const NUMS = [4, 7, 9, 11, 12, 15, 17, 19, 20, 21, 22, 23, 24, 34, 38, 41, 42, 43, 45, 47, 48, 51, 54, 60, 6, 8, 10, 14, 16, 31, 35, 50, 66, 71, 77, 88];
  const CLR = ['#e5484d', '#3e9bff', '#ffcc00', '#46c37b', '#b07cff', '#ff8a3d', '#2dd4bf', '#f472b6', '#94a3b8', '#84cc16', '#fb7185', '#60a5fa'];
  const drivers = NAMES.map((name, i) => ({ id: String(NUMS[i]), num: String(NUMS[i]), name, team: 'Demo Racing', color: CLR[(i * 5) % CLR.length],
    seasonPts: i < 12 ? 600 - i * 18 : i < 24 ? 380 - (i - 12) * 9 : 250 - (i - 24) * 8, wins: i < 4 ? 4 - i : 0 }));
  drivers.forEach(d => store['drivers/' + d.id] = d);
  const tiers = {}; drivers.forEach((d, i) => tiers[d.id] = i < 12 ? 'A' : i < 24 ? 'B' : 'C');

  function draftSim(seq, upto) {
    const picks = [], taken = new Set(), had = {};
    seq.slice(0, upto).forEach((e, k) => {
      const need = ['A', 'B', 'C'].filter(t => !(had[e] || []).includes(t)), t = need[Math.floor(rnd() * need.length)];
      const pool = drivers.filter(d => tiers[d.id] === t && !taken.has(d.id)), d = pool[Math.floor(rnd() * rnd() * pool.length)];
      taken.add(d.id); (had[e] = had[e] || []).push(t); picks.push({ email: e, driverId: d.id, auto: false, at: Date.now() - (upto - k) * H });
    });
    return picks;
  }
  const first = { 1: ['dre@demo.test', ME, 'maya@demo.test', 'priya@demo.test'], 2: ['priya@demo.test', 'maya@demo.test', ME, 'dre@demo.test'],
    3: ['maya@demo.test', 'dre@demo.test', 'priya@demo.test', ME], 4: ['dre@demo.test', 'priya@demo.test', ME, 'maya@demo.test'] };
  const races = { 1: 'Lakeside 400', 2: 'Riverbend 300', 3: 'Summit 500', 4: 'Harbor City 400' };
  const seqOf = n => { const f = first[n]; return [...f, ...f.slice().reverse(), ...f]; };
  [1, 2, 3].forEach(n => {
    const seq = seqOf(n), picks = draftSim(seq, 12);
    const order = drivers.slice().sort((a, b) => (b.seasonPts / 12 + rnd() * 30) - (a.seasonPts / 12 + rnd() * 30)).map(d => d.id);
    const pts = {}; order.forEach((id, i) => pts[id] = i === 0 ? 40 : Math.max(1, 37 - (i + 1)));
    const qual = drivers.slice().sort((a, b) => (b.seasonPts / 15 + rnd() * 25) - (a.seasonPts / 15 + rnd() * 25)).slice(0, 12).map(d => d.id);
    const led = {}; [order[0], order[1], order[Math.floor(rnd() * 6) + 2]].forEach((id, i) => led[id] = [120, 62, 18][i]);
    store['weeks/w' + n] = { n, race: races[n], status: 'scored', lockAt: Date.now() - (5 - n) * 24 * H, tiers, seq, picks, deadline: Date.now(), openedAt: Date.now() - 6 * 24 * H };
    store['scores/w' + n] = { pts, order, qual, led, t: Date.now() };
  });
  const seq4 = seqOf(4);
  store['weeks/w4'] = { n: 4, race: races[4], status: 'open', lockAt: Date.now() + 3 * 24 * H, tiers, seq: seq4, picks: draftSim(seq4, 2), deadline: Date.now() + 9 * H + 25 * 60000, openedAt: Date.now() - 3 * H };
  store['config/league'] = { currentWeek: 4 };
})();
</script>
<script>
// ====== PASTE YOUR FIREBASE WEB CONFIG HERE (Firebase console > Project settings > Your apps) ======
const firebaseConfig = {
  apiKey: "PASTE_API_KEY", authDomain: "PASTE_PROJECT_ID.firebaseapp.com", projectId: "PASTE_PROJECT_ID", appId: "PASTE_APP_ID"
};
// ====== The league commissioner (admin). Use the Google account you will sign in with. Lowercase. ======
const COMMISH = "jordan@demo.test";
const PICK_HOURS = 12, H = 3600e3;
const TIER_SIZE = 12; // A = top 12, B = next 12, C = rest

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore(), auth = firebase.auth();
const S = { user: null, got: {}, authDone: false, members: {}, drivers: {}, weeks: {}, scores: {}, league: {}, tab: 'draft', wk: null };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const isAdmin = () => S.user && S.user.email.toLowerCase() === COMMISH;
const me = () => S.user && S.user.email.toLowerCase();
const nameOf = e => (S.members[e] && S.members[e].name) || (e || '').split('@')[0];
const dname = id => S.drivers[id] ? S.drivers[id].name : id;

// ---------- standings ----------
// bonus points: qualifying 5/3/1, led a lap +5, most laps led +5 (ties share it). Computed from sc.qual / sc.led, never stored.
const QB = [5, 3, 1], QL = ['Pole', 'Q2', 'Q3'];
function bonusOf(sc, id) {
  const q = (sc.qual || []).indexOf(id), led = Number((sc.led || {})[id] || 0), mx = Math.max(0, ...Object.values(sc.led || {}).map(Number));
  const b = { q: q >= 0 && q < 3 ? QB[q] : 0, qn: q >= 0 && q < 3 ? QL[q] : '', l: led > 0 ? 5 : 0, m: led > 0 && led === mx ? 5 : 0, laps: led };
  b.t = b.q + b.l + b.m; return b;
}
const drvPts = (sc, id) => Number((sc.pts || {})[id] || 0) + bonusOf(sc, id).t;
const bonusChips = (sc, id) => { const b = bonusOf(sc, id); return [b.q && `${b.qn} +${b.q}`, b.l && `Led +${b.l}`, b.m && `Most led +${b.m}`].filter(Boolean).map(t => `<span class="bn">${t}</span>`).join(''); };
function totals(uptoWeek) {
  const T = {};
  Object.keys(S.members).forEach(e => T[e] = { pts: 0, wins: 0 });
  Object.values(S.weeks).filter(w => w.status === 'scored' && (uptoWeek == null || w.n <= uptoWeek)).forEach(w => {
    const sc = S.scores['w' + w.n] || {}, wt = {};
    w.picks.forEach(p => { const v = drvPts(sc, p.driverId); wt[p.email] = (wt[p.email] || 0) + v; if (T[p.email]) T[p.email].pts += v; });
    const best = Math.max(0, ...Object.values(wt));
    if (best > 0) Object.keys(wt).forEach(e => { if (wt[e] === best && T[e]) T[e].wins++; });
  });
  return T;
}
function standingsList(uptoWeek) {
  const T = totals(uptoWeek);
  return Object.keys(T).map(e => ({ e, ...T[e] })).sort((a, b) => b.pts - a.pts || b.wins - a.wins || a.e.localeCompare(b.e));
}

// ---------- draft logic ----------
function autoPick(w, email) {
  const taken = new Set(w.picks.map(p => p.driverId));
  const have = new Set(w.picks.filter(p => p.email === email).map(p => w.tiers[p.driverId]));
  return Object.values(S.drivers).filter(d => !taken.has(d.id) && w.tiers[d.id] && !have.has(w.tiers[d.id]))
    .sort((a, b) => (b.seasonPts || 0) - (a.seasonPts || 0))[0]?.id;
}
function applyTimeouts(w, now) {
  let ch = false;
  while (w.status === 'open' && w.picks.length < w.seq.length && (now >= w.lockAt || now >= w.deadline)) {
    const em = w.seq[w.picks.length], d = autoPick(w, em);
    if (!d) break;
    w.picks.push({ email: em, driverId: d, auto: true, at: Math.min(now, w.deadline) });
    if (now < w.lockAt) w.deadline += PICK_HOURS * H;
    ch = true;
  }
  if (w.status === 'open' && (w.picks.length >= w.seq.length || now >= w.lockAt)) { w.status = 'locked'; ch = true; }
  return ch;
}
async function mutateWeek(n, fn) {
  const ref = db.doc('weeks/w' + n);
  return db.runTransaction(async t => {
    const s = await t.get(ref); if (!s.exists) return;
    const w = s.data(); if (fn(w)) t.set(ref, w);
  });
}
async function pickDriver(n, id) {
  await mutateWeek(n, w => {
    applyTimeouts(w, Date.now());
    if (w.status !== 'open') { alert('Draft is closed.'); return false; }
    if (w.seq[w.picks.length] !== me()) { alert("It's not your turn."); return false; }
    if (w.picks.some(p => p.driverId === id)) { alert('Already taken.'); return false; }
    const t = w.tiers[id];
    if (w.picks.some(p => p.email === me() && w.tiers[p.driverId] === t)) { alert('You already have a tier ' + t + ' driver.'); return false; }
    w.picks.push({ email: me(), driverId: id, auto: false, at: Date.now() });
    w.deadline = Date.now() + PICK_HOURS * H;
    if (w.picks.length >= w.seq.length) w.status = 'locked';
    return true;
  });
}
function fmtLeft(ms) { if (ms <= 0) return 'now'; const h = Math.floor(ms / H), m = Math.floor(ms % H / 60000); return h + 'h ' + m + 'm'; }

// ---------- admin actions ----------
async function importDrivers() {
  const lines = document.getElementById('drvTxt').value.split('\n').map(l => l.trim()).filter(Boolean);
  const batch = db.batch(); let n = 0;
  lines.forEach(l => { const [name, num, team, pts, wins] = l.split(',').map(x => x.trim()); if (!name || !num) return;
    batch.set(db.doc('drivers/' + num), { id: num, name, num, team: team || '', seasonPts: Number(pts) || 0, wins: Number(wins) || 0 }, { merge: true }); n++; });
  await batch.commit(); alert('Imported ' + n + ' drivers');
}
async function saveMembers() {
  const lines = document.getElementById('memTxt').value.split('\n').map(l => l.trim()).filter(Boolean);
  const batch = db.batch();
  lines.forEach(l => { const [em, name] = l.split(',').map(x => x.trim()); if (em) batch.set(db.doc('members/' + em.toLowerCase()), { name: name || em.split('@')[0] }); });
  await batch.commit(); alert('Saved');
}
async function openWeek() {
  const n = Number(document.getElementById('wkN').value), race = document.getElementById('wkRace').value.trim(),
    lock = new Date(document.getElementById('wkLock').value).getTime();
  if (!n || !lock) return alert('Need week number and lock time');
  if (lock < Date.now() + 3600e3) return alert('Lock time must be at least 1 hour from now.');
  const ds = Object.values(S.drivers).sort((a, b) => (b.seasonPts || 0) - (a.seasonPts || 0) || (b.wins || 0) - (a.wins || 0));
  if (ds.length < 3) return alert('Import drivers first');
  const tiers = {}; ds.forEach((d, i) => tiers[d.id] = i < TIER_SIZE ? 'A' : i < TIER_SIZE * 2 ? 'B' : 'C');
  const emails = Object.keys(S.members);
  let first;
  const scored = Object.values(S.weeks).some(w => w.status === 'scored' && w.n < n);
  if (scored) first = standingsList(n - 1).map(x => x.e).reverse().filter(e => emails.includes(e)); // last place first
  else first = emails.slice().sort(() => Math.random() - .5);
  const seq = [...first, ...first.slice().reverse(), ...first];
  await db.doc('weeks/w' + n).set({ n, race, status: 'open', lockAt: lock, tiers, seq, picks: [], deadline: Date.now() + PICK_HOURS * H, openedAt: Date.now() });
  await db.doc('config/league').set({ currentWeek: n }, { merge: true });
  S.wk = n;
}
async function saveScores(n) {
  const lines = document.getElementById('scTxt').value.split('\n').map(l => l.trim()).filter(Boolean), pts = {}, order = [], miss = [];
  lines.forEach(l => { const i = l.lastIndexOf(','); const key = l.slice(0, i).trim().toLowerCase(), v = Number(l.slice(i + 1));
    const d = Object.values(S.drivers).find(d => d.num === key || d.name.toLowerCase() === key); if (d && !isNaN(v)) { pts[d.id] = v; order.push(d.id); } else miss.push(l); });
  await db.doc('scores/w' + n).set({ pts, order, t: Date.now() }, { merge: true });
  await db.doc('weeks/w' + n).set({ status: 'scored' }, { merge: true });
  alert('Saved ' + Object.keys(pts).length + ' scores' + (miss.length ? '. Unmatched: ' + miss.join(' | ') : ''));
}
async function saveQual(n) {
  const lines = document.getElementById('qualTxt').value.split('\n').map(l => l.trim()).filter(Boolean), qual = [], unknown = [], dup = [];
  lines.forEach(l => { const raw = l.replace(/^\?/, '').split(',')[0].trim(), key = raw.toLowerCase(), d = Object.values(S.drivers).find(d => d.num === key || d.name.toLowerCase() === key);
    if (!d) { qual.push('?' + raw); unknown.push(raw); } else if (qual.includes(d.id)) dup.push(l); else qual.push(d.id); });
  // shortcut: names not in the driver pool are kept as "?name" placeholders so everyone's start position stays right; a typo also becomes a placeholder, so check the alert
  await db.doc('scores/w' + n).set({ qual }, { merge: true });
  alert('Saved ' + qual.length + ' qualifying spots' + (unknown.length ? '. Not in driver pool (kept as placeholders): ' + unknown.join(' | ') : '') + (dup.length ? '. Duplicates skipped: ' + dup.join(' | ') : ''));
}
async function saveLed(n) {
  const lines = document.getElementById('ledTxt').value.split('\n').map(l => l.trim()).filter(Boolean), led = {}, miss = [];
  lines.forEach(l => { const i = l.lastIndexOf(','); const key = l.slice(0, i).trim().toLowerCase(), v = Number(l.slice(i + 1));
    const d = i > 0 && Object.values(S.drivers).find(d => d.num === key || d.name.toLowerCase() === key); if (d && v >= 0 && !isNaN(v) && led[d.id] == null) led[d.id] = v; else miss.push(l); });
  await db.doc('scores/w' + n).set({ led }, { mergeFields: ['led'] });
  alert('Saved laps led for ' + Object.keys(led).length + ' drivers' + (miss.length ? '. Unmatched or duplicate: ' + miss.join(' | ') : ''));
}
async function unlock(n) { await db.doc('weeks/w' + n).set({ status: 'open', lockAt: Date.now() + 6 * H }, { merge: true }); }

// ---------- views ----------
function weekPick() {
  const ns = Object.values(S.weeks).map(w => w.n).sort((a, b) => b - a);
  if (!S.wk) S.wk = S.league.currentWeek || ns[0] || null;
  return S.wk;
}
function weekSelect() {
  const ns = Object.values(S.weeks).map(w => w.n).sort((a, b) => b - a);
  return ns.length ? `<select style="width:auto" onchange="S.wk=+this.value;render()">${ns.map(n => `<option value="${n}" ${n === S.wk ? 'selected' : ''}>Week ${n}${S.weeks['w' + n].race ? ' – ' + esc(S.weeks['w' + n].race) : ''}</option>`).join('')}</select>` : '';
}
function vDraft() {
  const n = weekPick(), w = S.weeks['w' + n];
  if (!w) return `<div class="card">No draft open yet.${isAdmin() ? ' Open one from the Admin tab.' : ''}</div>`;
  const now = Date.now(), open = w.status === 'open', turn = w.seq[w.picks.length], myTurn = open && turn === me();
  const mine = w.picks.filter(p => p.email === me()), myTiers = new Set(mine.map(p => w.tiers[p.driverId]));
  const owner = {}; w.picks.forEach(p => owner[p.driverId] = p.email);
  let h = `<div class="card"><div class="row"><h2 style="flex:1">${esc(w.race || 'Week ' + w.n)}</h2>${weekSelect()}</div>`;
  h += open ? `<div>On the clock: <b>${esc(nameOf(turn))}</b> <span class="mu">(auto-pick in ${fmtLeft(w.deadline - now)})</span></div>
     <div class="mu">Draft locks ${new Date(w.lockAt).toLocaleString()} (${fmtLeft(w.lockAt - now)})</div>`
    : `<div><b>${w.status === 'scored' ? 'Scored' : 'Draft closed'}</b></div>`;
  h += `<h3>Pick order</h3><div class="seq">${w.seq.map((e, i) => { const p = w.picks[i];

function computeAwards() {
  const out = {}, give = (id, e, tag) => { out[id] = out[id] || {}; (out[id][e] = out[id][e] || []).push(tag); };
  const ws = Object.values(S.weeks).filter(w => w.status === 'scored' && (S.scores['w' + w.n] || {}).pts).sort((a, b) => a.n - b.n);
  const run = {}, totals = [];
  ws.forEach(w => {
    const sc = S.scores['w' + w.n], pts = sc.pts, tag = 'W' + w.n;
    const order = sc.order && sc.order.length ? sc.order : Object.keys(pts).sort((a, b) => pts[b] - pts[a]);
    const pos = {}; order.forEach((id, i) => pos[id] = i + 1);
    const P = id => Number(pts[id] || 0), R = id => pos[id] || 99;
    const by = {}; w.picks.forEach(p => (by[p.email] = by[p.email] || []).push(p.driverId));
    const emails = Object.keys(by), tot = {};
    emails.forEach(e => tot[e] = by[e].reduce((t, id) => t + drvPts(sc, id), 0));
    const sv = emails.map(e => tot[e]).sort((a, b) => b - a), hi = sv[0], lo = sv[sv.length - 1];
    const margin = sv.length > 1 ? sv[0] - sv[1] : 0, hasPrior = ws.some(x => x.n < w.n);
    emails.forEach(e => {
      const ids = by[e], won = hi > 0 && tot[e] === hi, full = ids.length === 3;
      totals.push({ e, t: tot[e], tag });
      run[e] = won ? (run[e] || 0) + 1 : 0;
      if (won) give('winner', e, tag);
      if (run[e] === 3) give('streak', e, tag);
      if (ids.some(id => R(id) === 1)) give('flag', e, tag);
      if (ids.some(id => w.tiers[id] === 'C' && R(id) <= 10)) give('sleeper', e, tag);
      if (full && ids.every(id => R(id) <= 10)) give('perfect', e, tag);
      if (won && hasPrior && w.seq[0] === e) give('comeback', e, tag);
      if (full && ids.every(id => P(id) >= 30)) give('triple', e, tag);
      if (full && ids.every(id => R(id) >= 20)) give('part', e, tag);
      if (hi > lo && tot[e] === lo) give('spoon', e, tag);
      if (w.picks[0] && w.picks[0].email === e && R(w.picks[0].driverId) >= 15) give('fire', e, tag);
      const a = ids.find(id => w.tiers[id] === 'A'), c = ids.find(id => w.tiers[id] === 'C');
      if (a && c && P(a) < P(c)) give('tierfail', e, tag);
      if (ids.some(id => R(id) === order.length)) give('cursed', e, tag);
      if (won && margin <= 5) give('photo', e, tag);
      if (won && margin >= 50) give('blowout', e, tag);
      if (ids.filter(id => R(id) <= 3).length >= 2) give('podium', e, tag);
      if (full && ids.every(id => R(id) <= 5)) give('dream', e, tag);
    });
  });
  const max = Math.max(0, ...totals.map(x => x.t)), seen = {};
  if (max > 0) totals.filter(x => x.t === max).forEach(x => { if (!seen[x.e]) { seen[x.e] = 1; give('big', x.e, x.tag); } });
  if (ws.length) {
    const L = standingsList(), mw = Math.max(...L.map(r => r.wins));
    give('champ', L[0].e, 'now'); if (L[1]) give('runner', L[1].e, 'now');
    if (mw > 0) L.filter(r => r.wins === mw).forEach(r => give('mostwins', r.e, 'now'));
    if (L.length > 1) give('last', L[L.length - 1].e, 'now');
  }
  return out;
}
