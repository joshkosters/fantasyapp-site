/* Layout: card on a dark table with tilt, controls beside it, tier ladder below.
   Card geometry and colors come from the Figma Driver Card frame (1212 x 1412).

:root{

  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;

}
*{box-sizing:border-box}

  padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

.main{display:flex;flex-wrap:wrap;gap:22px}
.stage{flex:1 1 340px;min-width:0;border:1px solid var(--line);border-radius:14px;padding:30px 16px;display:grid;place-items:center;touch-action:none;
  background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--glow) 24%,transparent),transparent 64%),var(--panel);
  --rx:5deg;--ry:-8deg;--gx:30%;--gy:20%;--fx:30%;--fy:30%;--ang:40deg}

.stage.rest .tilt .flip{transition:transform .6s ease}

.flip.on{--fl:180deg}
.front,.tilt .bkw{grid-area:1/1;transform-style:preserve-3d}
.front{transition:visibility 0s .35s}.flip.on .front{visibility:hidden}
.tilt .bkw{transform:rotateY(180deg);transform-style:flat;backface-visibility:hidden;visibility:hidden;transition:visibility 0s .35s}.flip.on .bkw{visibility:visible}
.tilt .bk .ring{transform:none}
.bd{position:absolute;left:calc(var(--u)*44);top:calc(var(--u)*44);width:calc(var(--u)*1124);height:calc(var(--u)*1324);color:#fff;padding:calc(var(--u)*56) calc(var(--u)*64);box-sizing:border-box;display:flex;flex-direction:column}

.bd .box{background:#000;border-radius:calc(var(--u)*34);padding:calc(var(--u)*22) calc(var(--u)*40);flex:1;display:flex;flex-direction:column;justify-content:space-between}

.panel{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:20px}
.group{display:flex;flex-direction:column;gap:9px}

.mini[aria-pressed=true]{transform:translateY(-4px)}
.mini .cap{font-size:12px;font-weight:600;text-align:center;letter-spacing:.06em;text-transform:uppercase}
.mini .cap small{display:block;color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none}
.note{color:var(--muted);font-size:13px;max-width:70ch;margin:0}

/* ---- card: 1 Figma px = var(--u) ---- */
.slot{container-type:inline-size;width:100%}
.card{position:relative;aspect-ratio:1212/1412;--u:calc(100cqw/1212);font-family:'Inter',sans-serif;transform-style:preserve-3d}
.ring{position:absolute;inset:0;background:var(--ring)}
.ring::after{content:"";position:absolute;inset:0;mix-blend-mode:overlay;opacity:var(--sheen);
  background:conic-gradient(from var(--ang),transparent 0,rgba(255,255,255,.7) 9%,transparent 21%,transparent 50%,rgba(255,255,255,.7) 59%,transparent 71%)}
.shapes{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
/* depth stack, back to front: frame (foil + sheen), face gradient + foil + glare, photo, color block + info box + text */
.fg{position:absolute;inset:0;isolation:isolate}
.ph,.dt{position:absolute;inset:0}
.ffx{position:absolute;left:calc(var(--u)*44);top:calc(var(--u)*44);width:calc(var(--u)*1124);height:calc(var(--u)*1324);pointer-events:none}
.ring::before,.ffx::before{content:"";position:absolute;inset:0;mix-blend-mode:color-dodge;
  background:linear-gradient(115deg,#ff5ecb,#6dffe0,#ffe66d,#6d9bff,#ff5ecb);background-size:260% 260%;background-position:var(--fx) var(--fy)}
.bfx{position:absolute;left:calc(var(--u)*44);top:calc(var(--u)*696);width:calc(var(--u)*1124);height:calc(var(--u)*672);pointer-events:none;mix-blend-mode:soft-light;opacity:calc(.15 + var(--foil)*.35);
  background:radial-gradient(farthest-corner circle at var(--gx) calc((var(--gy) - 49.3%)*2.1),rgba(255,255,255,.9),rgba(255,255,255,0) 60%),
  linear-gradient(115deg,transparent 38%,rgba(255,255,255,.8) 50%,transparent 62%) var(--fx) 0/320% 100%}
.ring::before{mix-blend-mode:overlay;opacity:calc(var(--foil)*1.1)}

.ffx::after{content:"";position:absolute;inset:0;mix-blend-mode:soft-light;opacity:calc(.25 + var(--foil)*.4);
  background:radial-gradient(farthest-corner circle at var(--gx) var(--gy),rgba(255,255,255,.7),rgba(255,255,255,0) 55%)}
/* real depth on the tilting card; scale offsets the perspective so layers line up at rest */
.tilt .ring{transform:translateZ(-14px) scale(1.0127)}
.tilt .ph{transform:translateZ(8px) scale(.9928)}
.tilt .dt{transform:translateZ(12px) scale(.9891)}
.c{position:absolute;white-space:nowrap;line-height:1.21;font-style:normal}
.rl{left:calc(var(--u)*80);top:calc(var(--u)*201);font-size:calc(var(--u)*86);font-weight:500;color:var(--ink2)}
.rn{left:calc(var(--u)*80);top:calc(var(--u)*269);font-size:calc(var(--u)*254.325);font-weight:900;color:var(--ink)} .rn,.rl{filter:drop-shadow(0 0 calc(var(--u)*7) var(--halo,transparent)) drop-shadow(0 0 calc(var(--u)*3) var(--halo,transparent))} .card.ultra .rn,.card.legendary .rn,.card.mythic .rn{background-image:linear-gradient(105deg,transparent 30%,rgba(0,0,0,.4) 41%,var(--gl,#fff) 50%,rgba(0,0,0,.4) 59%,transparent 70%),linear-gradient(var(--ink),var(--ink));background-size:300% 100%,100% 100%;background-repeat:no-repeat;background-position:100% 0,0 0;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent} .card.legendary .rn{--gl:#ffe27a} .card.mythic .rn{--gl:#cfeaff} .card:hover .rn{animation:glint 1s ease} .stage:not(.rest) .card .rn{animation:none;background-position:var(--gx,50%) 0,0 0} @keyframes glint{from{background-position:100% 0,0 0}to{background-position:0% 0,0 0}}

.nm span{font-weight:300}.nm b{font-weight:900}

:root{--bg:#07080e;--glass:rgba(255,255,255,.045);--stroke:rgba(255,255,255,.1);--txt:#eef1f8;--dim:#98a0b5;--a1:#7c5cff;--a2:#29d3ff;--disp:'Montserrat','Inter',sans-serif;--body:'Montserrat','Inter',system-ui,sans-serif;color-scheme:dark}

/* ===== Ridgeline-inspired: charcoal glass, electric lime, shop backdrop ===== */
:root{--bg:#0a0a0a;--glass:rgba(14,14,14,.7);--stroke:rgba(255,255,255,.09);--txt:#f4f5ef;--dim:#9a9d94;--a1:#FFCC01;--a2:#FFCC01;--lime:#FFCC01;--disp:'Outfit','Montserrat',sans-serif;--body:'Outfit','Montserrat',system-ui,sans-serif}

/* rank glow + rays */

.slot:has(>.card.ultra,>.card.legendary,>.card.mythic)::before{content:"";position:absolute;inset:-16%;z-index:-1;pointer-events:none;border-radius:50%;
 background:repeating-conic-gradient(from 0deg,rgba(var(--gc),.0) 0 9deg,rgba(var(--gc),.38) 11deg 13deg,rgba(var(--gc),0) 15deg 24deg),radial-gradient(closest-side,rgba(var(--gc),.55),rgba(var(--gc),0) 72%);
 -webkit-mask:radial-gradient(closest-side,#000 55%,transparent 100%);mask:radial-gradient(closest-side,#000 55%,transparent 100%);opacity:.8;transition:transform .12s ease-out,opacity .2s}
.slot:has(>.card.ultra){--gc:184,107,255}
.slot:has(>.card.legendary){--gc:255,204,1}
.slot:has(>.card.mythic){--gc:150,220,255}

/* ===== EVE-inspired: warm charcoal, ember orange, outlined controls ===== */
:root{--lime:#FFCC01;--a1:#FFCC01;--a2:#FFCC01;--ember:#FFCC01;--ember2:#FFE066;--disp:'Manrope','Outfit',sans-serif;--body:'Manrope','Outfit',system-ui,sans-serif;--stroke:rgba(255,255,255,.07);--txt:#f2f1ef;--dim:#9b9894;--glass:rgba(24,24,26,.78)}

 background:
 radial-gradient(3px 3px at 8% 14%,rgba(255,204,1,.55),transparent 70%),radial-gradient(2px 2px at 22% 62%,rgba(255,204,1,.45),transparent 70%),radial-gradient(4px 4px at 36% 24%,rgba(255,224,102,.35),transparent 70%),
 radial-gradient(2px 2px at 48% 80%,rgba(255,204,1,.4),transparent 70%),radial-gradient(3px 3px at 61% 12%,rgba(255,224,102,.4),transparent 70%),radial-gradient(2px 2px at 72% 48%,rgba(255,204,1,.5),transparent 70%),
 radial-gradient(5px 5px at 84% 26%,rgba(255,204,1,.3),transparent 70%),radial-gradient(2px 2px at 91% 70%,rgba(255,224,102,.45),transparent 70%),radial-gradient(3px 3px at 15% 88%,rgba(255,204,1,.35),transparent 70%),radial-gradient(2px 2px at 55% 55%,rgba(255,224,102,.35),transparent 70%),
 radial-gradient(60% 40% at 12% 8%,rgba(255,204,1,.12),transparent 70%),radial-gradient(50% 40% at 95% 95%,rgba(255,204,1,.08),transparent 70%),
 linear-gradient(rgba(9,9,10,.8),rgba(9,9,10,.9))}

.plate small{color:var(--ember);letter-spacing:.24em}

.felt,.shelf,.ledger,.panel,.doc,.rules{background:linear-gradient(150deg,rgba(40,40,44,.74),rgba(21,21,23,.86))!important;border:1px solid rgba(255,255,255,.055)!important;border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 24px 60px rgba(0,0,0,.45)!important}

.dockrow{border-top:1px dashed rgba(255,255,255,.1)}

::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}

/* badge-style position pills */
.slab{position:relative;overflow:hidden;padding:6px 14px;
 background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 62%,#fff) 0%,var(--pc) 46%,color-mix(in srgb,var(--pc) 70%,#000) 100%);
 border:1px solid color-mix(in srgb,var(--pc) 55%,#fff);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 3px rgba(0,0,0,.3),0 3px 7px rgba(0,0,0,.5),0 0 16px color-mix(in srgb,var(--pc) 38%,transparent);
 text-shadow:0 1px 0 rgba(255,255,255,.4)}

.slab::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:slabsheen 5s ease-in-out infinite;pointer-events:none}

/* pill per Driver-pill.svg: flat fill, concentric outline ring, soft layered shadow */

 outline:1.5px solid var(--pc);outline-offset:3px;margin:4px auto 18px;padding:8px 20px;

.slab svg{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.25))}

  radial-gradient(40% 30% at 50% 0,rgba(255,255,255,.07),transparent 70%),linear-gradient(170deg,#1b1b1e,#0a0a0b)!important;

 radial-gradient(2px 2px at 8% 66%,rgba(255,204,1,.35),transparent 70%),radial-gradient(2px 2px at 30% 88%,rgba(255,255,255,.3),transparent 70%),radial-gradient(2px 2px at 70% 82%,rgba(255,255,255,.35),transparent 70%)}

.peek.l{transform:scale(.86) perspective(700px) rotateY(18deg)}.peek.r{transform:scale(.86) perspective(700px) rotateY(-18deg)}

@media (max-width:860px){.peek{display:none}.gnav{position:absolute;top:44%;z-index:5;width:44px;height:44px}.gnav[data-nav="-1"]{left:0}.gnav[data-nav="1"]{right:0}.modal.gall .stage.gst{width:min(330px,72vw)}}

function viewRules(){const S=(h,b)=>`<section class="doc"><h3>${h}</h3>${b}</section>`;
 return`<div class="docs">
 ${S('The goal','<p>You are a crew chief. Four managers (you and three rivals) build a garage of driver cards at an auction, set a seven-card lineup every race week, and score points from real 2026 Cup Series results. Most points at the end of the season wins.</p>')}
 ${S('What a card is','<p>Every card is one real driver playing one position, so Larson as a Passer and Larson as a Hot Shoe are two different cards. Cards are unique: only one manager can own a given card at a time.</p><p>The big number is the rating. It comes from how that driver ranks at that position this season, and it moves after every race. Colors show rarity: Mythic (#1 at the position), Legendary (2 to 4), Ultra (5 to 10), Rare (11 to 20) and Common (21 and below). A green or red arrow means the driver moved up or down 3 or more places over the last 3 races. Flip a card to see how it scores and its season-to-date numbers.</p>')}
 ${S('The seven positions',`<ul>${PKS.map(p=>`<li><b>${POS[p].n}.</b> ${DESC[p]}. <span class="rr">Per race: ${SCAP[p][0]} to ${SCAP[p][1]}</span> <span class="rr">Volatility: ${volI(p)} ${VOLN[VOL[p].l]}</span></li>`).join('')}</ul><p><b>Volatility</b> shows how risky a position is, like a stock: the more bars, the more its points swing from race to race compared with its average. Low is steady; Extreme means big hits and big misses.</p><p>Each card also has its own volatility level, shown on the card, that updates after every race. A card that swings hard from big scores to bad ones climbs the scale; a steady one drops. Early in the year it leans on its position's average until it has a few races.</p><p>Every position has a lowest and highest score a card can earn in a single race. Anything beyond that is cut off at the limit.</p><p>You start one card at each position. A driver can appear only once in your lineup, even if you own several of his cards. A Pit Crew card is a car number, and it counts as that driver for this rule.</p>`)}
 ${S('The draft','<p>The season opens with an auction. Each manager has $100 to fill 12 cards. Managers take turns putting a card on the block: you open the bidding, everyone bids up in dollars, and the highest bid wins the card. Every card shows a market value based on its rank, so you can see what is a bargain. You must keep $1 for each empty roster spot. Spend it all: unspent draft money is lost. Stars and scrubs, or a balanced roster? It is up to you. You can let the computer finish the auction for you at any time.</p>')}
 ${S('Weekly lineups','<p>Before each race, open the Lineup tab. The preview shows the track, how heavily passing is weighted there, and which positions scored well on past visits. Your seven starting spots sit on top, each labeled with its position, and everything else is on your bench below. Drag a bench card up to start it, drag a starter down to bench it, or tap Change on a slot. Auto-set lineup fills it for you. An empty slot scores 0. Then play the race: every starter scores from that real race, and your total goes on the league table.</p>')}
 ${S('The 10-start cap','<p>Each card can start only ten times for you in a season. Starting a card in a race uses one, even on a bad day. A card at 10 of 10 is exhausted: it is released automatically after that race and goes back to the waiver wire, so you cannot hoard cards you can no longer use. The Roster tab shows starts left at each position against races remaining, and turns red when you are short. Over 34 races a single position needs about seven different cards, and your roster holds only 12, so waiver pickups are how you keep a full lineup all year.</p>')}
 ${S('Matchup','<p>The Matchup tab shows every manager\'s lineup. Before a race your rivals\' cards stay face-down and only you can see yours. When you play the race, all four lineups flip over one by one with the points each card scored.</p>')}
 ${S('Waivers','<p>Cards nobody owns sit on the waiver wire. In season you get a separate $50 waiver budget. To claim a card, open it, choose a bench card to drop, and place a blind bid. Bids run once a week, on Wednesday morning (in the practice game, press Run Wednesday waivers, or they run when you play the race). The highest bid wins and the winner pays that amount. A tie goes to the manager lowest in the standings. Each manager can win up to two claims a week, and results are shown to everyone afterward. A $0 bid is fine for filler cards. Once Wednesday waivers have run, free agency opens: you can add any card nobody owns, instantly and for free, and drop any bench card, right up until the race starts. First come, first served. You cannot drop a card that is in your lineup, so move it to the bench first.</p>')}
 ${S('Trades','<p>Open any of your cards, starter or bench, and tap Trade to offer it to a rival for one of their cards, or tap a rival\'s card in the Matchup tab and choose Offer a trade. Rivals answer right away, any day, separate from waivers: they accept if the swap is not clearly in your favor. Starts already used travel with the card. A rival can also offer you a swap; it shows on your Lineup tab until the next waivers run. Trades are one card for one card, no cash. If you trade a starter, its lineup spot opens until you fill it.</p>')}

 ${S('The Chase','<p>After race '+(N-CHASE)+' the regular season ends and the Chase begins. Everyone releases their whole roster and there is a new auction with a fresh $100, a fresh $50 waiver budget, and a new set of ten starts for every card. The worst regular season finisher nominates first. Regular season points do not carry over, but they earn a head start: 1st place gets +100, 2nd +60, 3rd +30, and 4th nothing. The last '+CHASE+' races decide the champion: most Chase points wins.</p>')}

  if($c('[data-start]')){G.lineup.me[cur.pk]=cur.no;done();return}
  if($c('[data-bench]')){delete G.lineup.me[cur.pk];done();return}
  if($c('[data-trade]')){tdr={k:cur.pk+cur.no};openCard(cur.pk,cur.no,0);return}
  if($c('[data-tback]')){tdr=null;openCard(cur.pk,cur.no,0);return}
  if($c('[data-tsend]')){const k=cur.pk+cur.no,x=$('tsel').value;if(x){const mine=G.own[k]==='me',t=mine?{from:'me',to:G.own[x],give:k,get:x}:{from:'me',to:G.own[k],give:x,get:k};(G.tlog=G.tlog||[]).push(tradeAnswer(t));G.tlog=G.tlog.slice(-3)}done();return}
  if($c('[data-drop]')){delete G.own[cur.pk+cur.no];done();return}
  if($c('[data-nominate]')){if(G.lot||nextNom()[0]!=='me')return;const o=Math.max(1,Math.min(maxBid('me'),+$('openin').value||1));G.nom+=nextNom()[1];G.lot={pk:cur.pk,no:cur.no,bid:o,high:'me',nom:'me',log:['You opened at $'+o]};closeOv();$('modal').className='modal';afterMy();render();return}
    if($c('[data-fa]')){const d=$('dropsel').value||null,k=cur.pk+cur.no;if(G.wdone===G.w&&!G.own[k]&&used('me',k)<CAP&&(roster('me').length<ROSTER||d)&&(!d||(G.own[d]==='me'&&!inLineup('me',d)))){if(d)delete G.own[d];G.own[k]='me';save()}closeOv();$('modal').className='modal';render();return}
  if($c('[data-claim]')){const d=$('dropsel').value||null,k=cur.pk+cur.no,bid=Math.max(0,Math.min(G.faab.me,Math.floor(+$('bidin').value||0)));if(G.wdone!==G.w&&used('me',k)<CAP&&G.claims.length<5&&!(d&&G.claims.some(c=>c.drop===d)))G.claims.push({add:k,drop:d,bid});done();return}
  if($c('[data-close]')||T===$('ov')){closeOv();$('modal').className='modal'}return}
 const s=$c('[data-slot]');if(s&&G.phase==='season'){showSlot(s.dataset.slot);return}
 const c=$c('[data-card]');if(c){const[pk,no]=c.dataset.card.split(':'),box=c.closest('.case,.hand,.mat,#dock,.mscroll');SEQ=box?[...new Set([...box.querySelectorAll('[data-card]')].map(x=>x.dataset.card))]:[c.dataset.card];openCard(pk,+no)}});
let drag=null,noClick=false;
const toast=m=>{try{parent.postMessage({cc:3,m},'*')}catch(e){}const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400)};
function tryStart(pk,no){const c=slotOf('me',no);if(used('me',pk+no)>=CAP)return'That card has no starts left.';if(c&&c!==pk)return`${DBY[no].l} already starts as ${POS[c].sub}.`;G.lineup.me[pk]=no;return''}
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.hc,.sl .pc[data-card]');if(!el||G.phase!=='season'||e.button>0)return;const[pk,no]=el.dataset.card.split(':');drag={el,pk,no:+no,x:e.clientX,y:e.clientY,moved:false,slot:!el.classList.contains('hc')}});
document.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(!drag.moved){if(Math.hypot(dx,dy)<8)return;drag.moved=true;const r=drag.el.getBoundingClientRect(),g=drag.el.cloneNode(true);g.classList.add('ghost');g.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px`;document.body.appendChild(g);drag.g=g;drag.el.classList.add('dragging');
  if(!drag.slot){const b=document.querySelector(`.slbox[data-pk="${drag.pk}"]`);if(b)b.classList.add('target')}}
 drag.g.style.transform=`translate(${dx}px,${dy}px) scale(1.08)`});
function endDrag(e,cancel){if(!drag)return;const d=drag;drag=null;document.querySelectorAll('.target').forEach(x=>x.classList.remove('target'));if(!d.moved)return;
 noClick=true;setTimeout(()=>noClick=false,0);d.g.remove();d.el.classList.remove('dragging');if(cancel)return;const dy=e.clientY-d.y;
 if(d.slot){if(dy>70){delete G.lineup.me[d.pk];save();render()}return}
 const over=document.elementFromPoint(e.clientX,e.clientY),box=over&&over.closest('.slbox');
 if(box&&box.dataset.pk!==d.pk){toast(`That card plays ${POS[d.pk].sub}. Drop it on the ${POS[d.pk].sub} slot.`);return}
 if(dy>-70&&!box)return;const m=tryStart(d.pk,d.no);if(m)toast(m);else{save();render()}}
document.addEventListener('pointerup',e=>endDrag(e,false));document.addEventListener('pointercancel',e=>endDrag(e,true));
document.addEventListener('click',e=>{if(noClick){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('mouseover',e=>{const h=e.target.closest('.hc');if(h&&$('handcap'))$('handcap').textContent=h.dataset.cap});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeOv();$('modal').className='modal'}else if(e.key==='ArrowLeft')nav(-1);else if(e.key==='ArrowRight')nav(1)});
let tx=null;document.addEventListener('touchstart',e=>{tx=e.target.closest('.gall')?e.touches[0].clientX:null},{passive:true});document.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>70)nav(dx<0?1:-1)});
const PRE=((location.hash||'').slice(1)||'lineup');
document.documentElement.classList.add('embed','p-'+PRE);
function seasonAt(w){newSeason();G.auto=true;advance();refresh();for(let i=0;i<w&&G.w<N;i++)runRace();refresh()}
const TABS={lineup:'team',match:'match',cards:'waivers',waivers:'waivers',sched:'sched',league:'league',coll:'coll',rules:'rules',fan:'team'};
if(PRE==='draft'){newSeason();tab='draft'}
else{seasonAt(PRE==='league'?14:8);tab=TABS[PRE]||'team'}
render();
if(PRE==='fan'){const picks=PKS.map(pk=>[pk,NOS.slice().sort((a,b)=>RK[pk][a]-RK[pk][b])[0]]),n=picks.length,mid=(n-1)/2;
 $('view').innerHTML=`<div class="handw"><div class="hand">${picks.map(([pk,no],i)=>{const d=i-mid;return`<button class="hc" data-card="${pk}:${no}" data-cap="" style="--r:${(d*4.5).toFixed(1)}deg;--y:${(d*d*5).toFixed(0)}px;--pc:${PCOL[pk]};z-index:${i+1}"><div class="pc">${cardHTML(no,pk)}</div></button>`}).join('')}</div></div>`}
const post=o=>{try{parent.postMessage(Object.assign({cc:1,p:PRE},o),'*')}catch(e){}};
let MM=false;
const measure=()=>{if(MM)return;const w=document.querySelector('.wrap');post({h:Math.ceil(w.getBoundingClientRect().bottom+window.scrollY)+(PRE==="fan"?14:28)})};
new ResizeObserver(measure).observe(document.querySelector('.wrap'));window.addEventListener('load',measure);setTimeout(measure,400);setTimeout(measure,1500);
new MutationObserver(()=>{const on=$('ov').classList.contains('on');if(on===MM)return;MM=on;document.documentElement.classList.toggle('mm',on);post({modal:on});if(!on)setTimeout(measure,60)}).observe($('ov'),{attributes:true,attributeFilter:['class']});


</script>
