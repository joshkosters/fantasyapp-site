<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4d22">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Us">
<title>Us</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>
:root{
  --forest:#1f4d22; --green:#2e6b2f; --green2:#3f8a3f; --ink:#163817; --text:#22332a; --muted:#6f7d71;
  --lime:#a8e063; --lime2:#c9ef95; --lime-soft:#eaf7d8; --bg:#eef1ea; --card:#ffffff; --line:#e4e9e0;
  --red:#e5484d; --red-soft:#fde9e9; --amber:#d9900f; --amber-soft:#fdf1d8;
  --shadow:0 1px 2px rgba(22,56,23,.04),0 8px 24px rgba(22,56,23,.06);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* hero */
.hero{background:var(--forest);padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px) 44px calc(env(safe-area-inset-left) + 16px)}
.hrow{display:flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;border-radius:50%;background:var(--lime);color:var(--forest);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px}
.mpill{flex:1;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.1);border-radius:999px;height:46px;padding:0 5px;color:#fff}
.mpill button{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.mpill .label{font-weight:700;font-size:15px;letter-spacing:.01em}
.hbtn{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;flex:none}

/* panel */
.panel{margin-top:-26px;background:var(--bg);border-radius:28px 28px 0 0;min-height:70vh;padding:20px calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 120px) calc(env(safe-area-inset-left) + 14px)}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 16px}
.titlerow h1{margin:0;font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.cta{border:0;border-radius:999px;background:var(--green);color:#fff;font-weight:700;padding:11px 18px;display:flex;align-items:center;gap:7px;font-size:15px;box-shadow:0 6px 16px rgba(46,107,47,.25)}
.cta svg{width:18px;height:18px}

/* stat cards */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{position:relative;background:var(--card);border-radius:20px;padding:14px 14px 13px;box-shadow:var(--shadow);overflow:hidden}
.stat .k{font-size:13px;font-weight:600;color:var(--text);padding-right:38px}
.stat .v{font-size:23px;font-weight:800;color:var(--ink);margin:6px 0 4px;letter-spacing:-.01em;white-space:nowrap}
.stat .sub{font-size:12px;color:var(--muted)}
.stat .sub b{color:var(--text);font-weight:700}
.stat .ic{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.stat .ic svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:4px;margin-top:8px;padding:3px 8px;border-radius:8px;font-size:12px;font-weight:700;background:var(--lime-soft);color:var(--green)}
.chip.bad{background:var(--red-soft);color:var(--red)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip svg{width:12px;height:12px;stroke-width:2.4}

/* cards */
.card{background:var(--card);border-radius:22px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.chead h3{margin:0;font-size:16px;font-weight:800;color:var(--ink)}
.chead .meta{font-size:12px;color:var(--muted);font-weight:600}
.seg{display:flex;gap:6px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--text)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.kpis{display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.kpis b{color:var(--ink);font-size:16px;font-weight:800;margin-left:4px}
.dotb{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;margin-left:6px;vertical-align:-5px}
.dotb.bad{background:var(--red)}
.dotb svg{width:12px;height:12px;stroke-width:2.6}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:inherit;font-size:11px;fill:var(--muted)}
.empty-chart{padding:26px 10px;text-align:center;color:var(--muted);font-size:13px}

/* list rows */
.ghead{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0 2px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.ghead span:last-child{font-weight:600;text-transform:none;letter-spacing:0}
.line{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:11px 0;border-bottom:1px solid var(--line)}
.card .line:last-child{border-bottom:0}
.cav{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.lmain{flex:1;min-width:0}
.line-top{display:flex;justify-content:space-between;gap:10px;font-weight:700;color:var(--ink)}
.line-top .left{font-weight:700;color:var(--green);white-space:nowrap;font-size:14px}
.line-top .left.neg{color:var(--red)} .line-top .left.warn{color:var(--amber)}
.lbar{height:7px;border-radius:7px;background:#edf1ea;margin:7px 0 5px;overflow:hidden}
.lbar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--green2),var(--lime))}
.lbar i.warn{background:var(--amber)} .lbar i.neg{background:var(--red)}
.line-sub{font-size:12px;color:var(--muted)}
.line-sub .roll{color:var(--green);font-weight:700}
.line-sub .roll.neg{color:var(--red)}

/* expenses */
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:0 14px;height:46px;box-shadow:var(--shadow);margin-bottom:10px;color:var(--muted)}
.search input{border:0;outline:none;background:none;flex:1;height:100%;font-size:15px;color:var(--text)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--text)}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips select{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:13px;font-weight:700}
.dayhead{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:14px 6px 6px}
.erow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:11px 0;border-bottom:1px solid var(--line)}
.card .erow:last-child{border-bottom:0}
.emain{flex:1;min-width:0}
.emain b{display:block;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emain span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eamt{font-weight:800;white-space:nowrap;color:var(--ink)}
.eamt.refund{color:var(--green)}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;padding:1px 6px;border-radius:6px;background:var(--ink);color:#fff;margin-left:5px;vertical-align:1px}
.who{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:800;background:var(--lime);color:var(--forest);margin-right:4px;vertical-align:-4px}
.who.p2{background:#f6d9b8;color:#8a5a1c}

/* notices */
.notice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--ink);color:#fff;border-radius:20px;padding:13px 14px;margin-bottom:12px;font-weight:700;box-shadow:var(--shadow)}
.notice .ico{width:38px;height:38px;border-radius:50%;background:var(--lime);color:var(--forest);display:grid;place-items:center;flex:none}
.notice small{display:block;font-weight:500;color:rgba(255,255,255,.7);font-size:12px}
.notice .go{margin-left:auto;background:var(--lime);color:var(--forest);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800;white-space:nowrap}
.mini{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.card .mini:last-child{border-bottom:0}
.mini .t{flex:1;min-width:0;font-weight:700;color:var(--ink)}
.mini .t small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.mini .r{font-weight:800;white-space:nowrap;color:var(--ink);text-align:right}
.mini .r small{display:block;font-weight:600;color:var(--muted);font-size:11px}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.ck.on{background:var(--green);border-color:var(--green);color:#fff}
.ck.part{border-color:var(--lime);background:var(--lime-soft);color:var(--green)}
.ck svg{width:14px;height:14px;stroke-width:3}
.gbar{height:8px;border-radius:8px;background:#edf1ea;overflow:hidden;margin-top:6px}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--lime));border-radius:8px}

/* empty / banners / buttons */
.empty{text-align:center;color:var(--muted);padding:30px 16px}
.empty h3{color:var(--ink);margin:0 0 6px;font-size:18px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;background:var(--green);color:#fff}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.lime{background:var(--lime);color:var(--forest)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.block{display:block;width:100%}
.stack{display:grid;gap:10px;margin-top:16px}
.banner{background:var(--red-soft);color:var(--red);border-radius:14px;padding:11px 13px;font-size:13px;font-weight:600;margin-bottom:12px}
.banner.info{background:var(--lime-soft);color:var(--green)}
.linkbtn{border:0;background:none;color:var(--green);font-weight:700;padding:8px 0;font-size:14px}

/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:30;display:flex;gap:4px;background:var(--green);border-radius:999px;padding:6px;box-shadow:0 10px 30px rgba(22,56,23,.35)}
.dock button{position:relative;height:46px;min-width:46px;border:0;border-radius:999px;background:none;color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;font-weight:700;font-size:13px;letter-spacing:.02em;text-transform:uppercase}
.dock button.on{background:var(--lime);color:var(--forest)}
.dock button span.lbl{display:none}
.dock button.on span.lbl{display:inline}
.dock .badge{position:absolute;top:3px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;letter-spacing:0}
.dock .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:#f2b84b}

/* plan editor */
.psec h3{margin:4px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800}
.prow{display:grid;grid-template-columns:1fr 112px 32px 32px;gap:6px;align-items:center;padding:5px 0}
.prow input,.gname,.pmore input,.pmore select{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;width:100%;min-width:0}
.pamt{position:relative}
.pamt span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.pamt input{padding-left:20px;text-align:right}
.ib{width:32px;height:32px;border-radius:10px;border:0;background:none;color:var(--muted);display:grid;place-items:center;font-size:15px}
.ib.has{color:var(--green);background:var(--lime-soft)}
.ib.confirm{background:var(--red-soft);color:var(--red);width:auto;padding:0 6px;font-size:11px;font-weight:800}
.pmore{grid-column:1 / -1;background:var(--bg);border-radius:14px;padding:10px;display:grid;gap:8px}
.pmore input,.pmore select{background:#fff;padding:8px 10px;font-size:14px}
.pmore .r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.chk input{width:18px;height:18px;accent-color:var(--green);flex:none}
.chk.inl{justify-content:space-between}
.chk.inl input,.chk.inl select{width:auto;max-width:150px}
.pgroup{display:flex;gap:8px;align-items:center;padding:12px 0 2px}
.gname{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.05em;background:transparent;border-color:transparent;padding:6px 4px;color:var(--ink)}
.gname:focus{border-color:var(--line);background:var(--bg)}
.gsub{font-size:12px;color:var(--muted);white-space:nowrap}
.addl{border:0;background:none;color:var(--green);font-weight:700;padding:8px 0 10px;font-size:14px}
.ptotal{display:flex;justify-content:space-between;font-weight:800;padding:10px 0 4px;border-top:1px solid var(--line);margin-top:4px;color:var(--ink)}
.savebar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 80px);z-index:29}
.savebar .in{max-width:536px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:20px;padding:10px 10px 10px 16px;box-shadow:0 10px 30px rgba(22,56,23,.3)}
.savebar .info{flex:1;font-size:12px;color:rgba(255,255,255,.7)}
.savebar .info b{display:block;color:#fff;font-size:15px}
.savebar .info b.neg{color:#ff9a9d}
.savebar .btn{padding:10px 14px}
.savebar .btn.sec{background:rgba(255,255,255,.1);color:#fff;border:0}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(15,30,16,.45);z-index:40;opacity:0;transition:opacity .2s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:28px 28px 0 0;max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding:10px calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 20px) calc(env(safe-area-inset-left) + 18px)}
.sheet.show{transform:none}
.sheet .in{max-width:560px;margin:0 auto}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0 0 14px;font-size:21px;color:var(--ink);font-weight:800}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;font-size:16px}
.amtbig{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:6px 14px}
.amtbig span{font-size:30px;font-weight:700;color:var(--muted)}
.amtbig input{border:0!important;background:none!important;font-size:34px!important;font-weight:800;padding:6px 0!important;outline:none;color:var(--ink)}
.toggle{display:flex;gap:6px;margin-bottom:12px;background:var(--bg);padding:4px;border-radius:14px}
.toggle button{flex:1;border:0;background:none;border-radius:10px;padding:9px;font-weight:700;font-size:13px;color:var(--muted)}
.toggle button.on{background:var(--ink);color:#fff}
.err{color:var(--red);font-size:13px;font-weight:600;min-height:18px;margin:-4px 0 8px}
.lsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.lsum div{background:var(--bg);border-radius:14px;padding:10px;font-size:12px;color:var(--muted);font-weight:600}
.lsum b{display:block;color:var(--ink);font-size:16px;font-weight:800}
.lsum b.neg{color:var(--red)}
.lnote{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:12px}

/* settings switches */
.sw{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw .t{flex:1}
.sw .t b{display:block;color:var(--ink)}
.sw .t small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sw.sub{padding-left:16px}
.sw input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:999px;background:#d7ded3;position:relative;transition:background .2s;flex:none;margin:0;cursor:pointer}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.sw input:checked{background:var(--green)}
.sw input:checked::after{left:23px}
.sw input:disabled{opacity:.4}

/* inbox */
.syncbar{display:flex;align-items:center;gap:10px;margin:0 2px 12px;font-size:13px;color:var(--muted);font-weight:600}
.syncbar .grow{flex:1}
.syncbar button{border:0;background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;box-shadow:var(--shadow);display:flex;gap:6px;align-items:center}
.syncbar button svg{width:15px;height:15px}
.icard{background:#fff;border-radius:20px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.icard .t{display:flex;justify-content:space-between;gap:10px;font-weight:800;color:var(--ink)}
.icard .t .amt.in{color:var(--green)}
.icard .s{font-size:12px;color:var(--muted);margin:2px 0 10px}
.icard .a{display:grid;grid-template-columns:1fr auto auto;gap:6px}
.icard select{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 8px;min-width:0;font-size:14px}
.icard select.sug{border-color:var(--lime);background:var(--lime-soft)}
.icard .a button{border:0;border-radius:12px;padding:0 14px;font-weight:700;font-size:14px}
.icard .add{background:var(--green);color:#fff}
.icard .skip{background:var(--bg);color:var(--muted)}
.icard .ib-note{grid-column:1 / -1;width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 10px;font-size:14px;margin-top:6px}
.icard.busy{opacity:.5;pointer-events:none}

/* report */
.legend{display:grid;gap:7px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;color:var(--text);font-weight:600}
.legend b{color:var(--ink)}
.donutwrap{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.pva{display:grid;gap:12px}
.pva .row .top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink)}
.pva .row .top span:last-child{font-weight:600;color:var(--muted)}
.pva .track{position:relative;height:10px;border-radius:10px;background:#edf1ea;margin-top:6px;overflow:hidden}
.pva .track i{position:absolute;left:0;top:0;bottom:0;border-radius:10px;background:linear-gradient(90deg,var(--green2),var(--lime))}
.pva .track i.over{background:var(--red)}

<script>
/* ================= helpers ================= */
const $ = s => document.querySelector(s);

const pad = n => String(n).padStart(2, '0');

function weekId(d = new Date()) { const x = new Date(d); const k = (x.getDay() + 6) % 7; x.setDate(x.getDate() - k); return isoDay(x); }
const when = ts => {
  const d = new Date(ts), now = new Date(), mins = Math.round((now - d) / 60000);
  if (mins < 1) return 'just now'; if (mins < 60) return mins + ' min ago';
  if (isoDay(d) === isoDay(now)) return 'today ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

  if (isoDay(d) === isoDay(y)) return 'yesterday ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
};
const timeText = ts => new Date(ts).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' });
const ICONS = {

/* ================= people ================= */

const ALLOWED = { 'joshkosters@gmail.com': 'Josh', 'tlturner9@gmail.com': 'T' };
const nameOf = em => (S.names[em] || ALLOWED[em] || 'Partner').split(' ')[0];

/* ================= content (original, written for this app) ================= */
const REFLECTIONS = [
  'Small moments add up. A two-minute check-in today can matter more than a big gesture next month.',
  'You don’t have to agree to understand. Today, try to understand one thing before you respond to it.',

    await db.doc(`private/${S.me}/feelings/${id}`).set(priv);
    closeSheet(); S.draft = null;
    toast(d.share === 'private' ? 'Saved privately' : `Shared with ${nameOf(S.partner)}`);
  } catch (e) { fail(e); }
}

/* ----- Pause sheet ----- */

/* ----- Commitment sheet ----- */

/* ----- Settings ----- */
function openSettings() {
  openSheet(`<h2>Settings</h2>
    <div class="acct"><span class="t">Signed in as<b>${esc(S.me)}</b></span><button class="btn sec" style="padding:8px 14px" data-action="signout">Sign out</button></div>
    <div class="card" style="box-shadow:none;border:1px solid var(--line)"><div class="chead"><h3>Privacy</h3></div>
      <p style="margin:0 0 8px;font-size:14px">Feelings, notes, check-in answers and drafts are private by default. The database itself refuses to show them to anyone but you. Sharing makes a separate copy that ${esc(nameOf(S.partner))} can see; “Stop sharing” deletes that copy, though ${esc(nameOf(S.partner))} may already have read it.</p>
      <button class="btn sec block" data-action="privacy-check">Run privacy check</button><div class="chk-res" id="chkRes"></div></div>

      <a class="btn sec block" style="margin-top:10px;text-align:center;text-decoration:none" href="/budget/">Open Budget</a></div>`);
}
async function privacyCheck() {
  const out = $('#chkRes'); out.innerHTML = 'Checking…';
  const P = S.partner, db = S.db, res = [];
  const expectDenied = async (label, fn) => { try { await fn(); res.push([label, false]); } catch (e) { res.push([label, e && e.code === 'permission-denied']); } };
  await expectDenied(`Read ${nameOf(P)}'s private feelings`, () => db.collection(`private/${P}/feelings`).limit(1).get());
  await expectDenied(`Read ${nameOf(P)}'s private check-in`, () => db.collection(`private/${P}/checkins`).limit(1).get());
  await expectDenied(`Write into ${nameOf(P)}'s private area`, () => db.doc(`private/${P}/feelings/_probe`).set({ x: 1 }));
  await expectDenied(`Post a feeling as ${nameOf(P)}`, () => db.doc('us_feelings/_probe_' + uid()).set({ author: P, ts: Date.now() }));
  const cid = '_probe_' + uid();
  await expectDenied(`Accept a commitment for ${nameOf(P)}`, () => db.doc('us_commitments/' + cid).set({ proposer: S.me, owners: [P], acceptedBy: [P], status: 'active', text: 'probe' }));
  let ownOk = true; try { await db.collection(`private/${S.me}/feelings`).limit(1).get(); } catch (e) { ownOk = false; }
  out.innerHTML = res.map(([l, ok]) => `<div>${ok ? '<span class="ok">Blocked ✓</span>' : '<span class="bad">NOT blocked ✗</span>'} ${esc(l)}</div>`).join('') + `<div>${ownOk ? '<span class="ok">Allowed ✓</span>' : '<span class="bad">Blocked ✗</span>'} Read your own private feelings</div>`;
}
async function exportData() {
  const db = S.db, me = S.me, data = { exportedAt: new Date().toISOString(), account: me };
  for (const c of ['feelings', 'checkins', 'prefs']) { const s = await db.collection(`private/${me}/${c}`).get(); data['private_' + c] = s.docs.map(d => ({ id: d.id, ...d.data() })); }
  data.shared_feelings = S.shared.filter(f => f.author === me);
  data.pauses = S.pauses.filter(p => p.author === me);
  data.checkins_shared = Object.values(S.checkins).filter(c => c.author === me);
  data.commitments = S.commitments;
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `us-data-${isoDay()}.json`; a.click();
}
async function wipe(t) {
  if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'Tap again to delete everything private'; return; }
  t.disabled = true;
  const db = S.db;
  for (const c of ['feelings', 'checkins', 'prefs']) { const s = await db.collection(`private/${S.me}/${c}`).get(); for (const d of s.docs) await d.ref.delete(); }
  closeSheet(); toast('Your private entries are deleted');
}

/* ================= actions ================= */
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'fSearch') { captureLogger(); drawLogger(); return; }
  if (t.dataset && t.dataset.ci) saveCheckinDebounced();
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.name === 'vis') { captureLogger(); S.draft.share = t.value; drawLogger(); }
  if (t.dataset && t.dataset.cishare) saveCheckinDebounced();
});
document.addEventListener('focusout', ev => { if (ev.target.dataset && ev.target.dataset.ci) setTimeout(render, 50); });
let ciT;
function saveCheckinDebounced() { clearTimeout(ciT); ciT = setTimeout(saveCheckin, 700); }
async function saveCheckin() {
  const answers = {}, share = {};
  document.querySelectorAll('[data-ci]').forEach(el => { answers[el.dataset.ci] = el.value; });
  document.querySelectorAll('[data-cishare]').forEach(el => { share[el.dataset.cishare] = el.checked; });
  S.myCheckin = { week: weekId(), answers, share, updatedAt: Date.now() };
  try { await S.db.doc(`private/${S.me}/checkins/${weekId()}`).set(S.myCheckin); } catch (e) { fail(e); }
}
async function shareCheckin() {
  await saveCheckin();
  const { answers, share } = S.myCheckin, wk = weekId(), out = {};
  for (const [k] of CHECKIN) if (share[k] && (answers[k] || '').trim()) out[k] = answers[k].trim();
  if (!Object.keys(out).length) { toast('Check “Share this answer” on at least one answer'); return; }
  try { await S.db.doc(`us_checkins/${wk}_${S.me}`).set({ author: S.me, week: wk, answers: out, sharedAt: Date.now() }); toast(`Shared ${Object.keys(out).length} answer${Object.keys(out).length > 1 ? 's' : ''}`); }
  catch (e) { fail(e); }
}
async function savePrefs(patch) { S.prefs = { ...S.prefs, ...patch }; try { await S.db.doc(`private/${S.me}/prefs/main`).set(S.prefs); } catch (e) {} }

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-action],[data-tab]'); if (!t) return;
  if (t.dataset.tab && !t.dataset.action) { S.tab = t.dataset.tab; if (sheetOpen) closeSheet(); render(); window.scrollTo({ top: 0 }); markSeen(); return; }
  const a = t.dataset.action, id = t.dataset.id, db = S.db;
  const run = p => p.catch(fail);
  switch (a) {
    case 'signin': return signIn();
    case 'signout': return firebase.auth().signOut().then(() => location.reload());
    case 'settings': return openSettings();
    case 'budget': location.href = '/budget/'; return;
    case 'refl-next': S.refl++; return render();
    case 'refl-save': { const i = +t.dataset.i, list = S.prefs.savedReflections || []; savePrefs({ savedReflections: list.includes(i) ? list.filter(x => x !== i) : [...list, i] }).then(render); return; }
    case 'log': return openLogger(t.dataset.q || '');
    case 'lq': captureLogger(); S.draft.quad = t.dataset.q; if ($('#fSearch')) $('#fSearch').value = ''; return drawLogger();
    case 'lw': captureLogger(); S.draft.label = t.dataset.w; S.draft.quad = quadOf(t.dataset.w); return drawLogger();
    case 'li': captureLogger(); S.draft.intensity = S.draft.intensity === +t.dataset.n ? 0 : +t.dataset.n; return drawLogger();
    case 'lc': { captureLogger(); const c = t.dataset.c, cs = S.draft.contexts; S.draft.contexts = cs.includes(c) ? cs.filter(x => x !== c) : [...cs, c]; return drawLogger(); }
    case 'ls': captureLogger(); S.draft.support = S.draft.support === t.dataset.s ? '' : t.dataset.s; return drawLogger();
    case 'lsw': captureLogger(); S.draft.shareWhat = t.dataset.v; return drawLogger();
    case 'feel-save': return saveFeeling();
    case 'share-later': { const f = S.myFeelings.find(x => x.id === id); if (f) { S.draft = { ...f, share: 'share', shareWhat: 'label', status: '' }; drawLogger(); } return; }
    case 'unshare': { const f = S.myFeelings.find(x => x.id === id); if (!f) return; return run((async () => { await db.doc('us_feelings/' + f.sharedId).delete(); await db.doc(`private/${S.me}/feelings/${f.id}`).set({ ...f, sharedId: null }); toast(`No longer shared. ${nameOf(S.partner)} may have already seen it.`); })()); }
    case 'feel-del': {
      if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'Tap again'; return; }
      const f = S.myFeelings.find(x => x.id === id); if (!f) return;
      return run((async () => { if (f.sharedId) await db.doc('us_feelings/' + f.sharedId).delete(); await db.doc(`private/${S.me}/feelings/${f.id}`).delete(); toast('Deleted'); })());
    }
    case 'respond': { const f = S.shared.find(x => x.id === id); if (!f) return; const cur = (f.responses || {})[S.me]; const responses = { ...(f.responses || {}) }; if (cur && cur.text === t.dataset.r) delete responses[S.me]; else responses[S.me] = { text: t.dataset.r, at: Date.now() }; return run(db.doc('us_feelings/' + id).update({ responses, seenBy: [...new Set([...(f.seenBy || []), S.me])] }).then(() => toast('Sent'))); }
    case 'ff': S.feelFilter = t.dataset.v; render(); return markSeen();
    case 'pause': return openPause();
    case 'pause-send': {
      const reason = (document.querySelector('input[name="pst"]:checked') || {}).value || '';
      const at = $('#pAt').value ? new Date($('#pAt').value).getTime() : null;
      const msg = $('#pMsgOn').checked ? $('#pMsg').value.trim() : '';
      return run(db.collection('us_pauses').doc(uid()).set({ author: S.me, reason, returnAt: at, message: msg, status: 'paused', createdAt: Date.now(), ackBy: [] }).then(() => { closeSheet(); S.tab = 'talk'; render(); toast(`${nameOf(S.partner)} will see your pause`); }));
    }
    case 'pause-edit': return openPause(S.pauses.find(p => p.id === id));
    case 'pause-save-edit': { const at = $('#pAt').value ? new Date($('#pAt').value).getTime() : null; return run(db.doc('us_pauses/' + id).update({ returnAt: at, updatedAt: Date.now() }).then(() => { closeSheet(); toast('Updated'); })); }
    case 'pause-ready': return run(db.doc('us_pauses/' + id).update({ status: 'ready', readyAt: Date.now() }).then(() => toast(`${nameOf(S.partner)} will see you're ready`)));
    case 'pause-close': return run(db.doc('us_pauses/' + id).update({ status: 'closed', closedAt: Date.now() }).then(() => toast('Pause closed')));
    case 'pause-ack': { const p = S.pauses.find(x => x.id === id); return run(db.doc('us_pauses/' + id).update({ ackBy: [...new Set([...(p.ackBy || []), S.me])], ackAt: Date.now() }).then(() => toast('Sent'))); }
    case 'ci-share': return shareCheckin();
    case 'commit-new': return openCommit();
    case 'c-save': {
      const text = $('#cText').value.trim(); if (!text) { $('#cErr').textContent = 'Write the commitment first.'; return; }
      const own = (document.querySelector('input[name="cOwn"]:checked') || {}).value || 'me';
      const owners = own === 'me' ? [S.me] : own === 'them' ? [S.partner] : [S.me, S.partner];
      const acceptedBy = owners.includes(S.me) ? [S.me] : [];
      const status = owners.every(o => acceptedBy.includes(o)) ? 'active' : 'proposed';
      return run(db.collection('us_commitments').doc(uid()).set({ text, owners, acceptedBy, proposer: S.me, status, due: $('#cDue').value || null, note: $('#cNote').value.trim(), createdAt: Date.now() }).then(() => { closeSheet(); toast(status === 'active' ? 'Added' : `Sent to ${nameOf(S.partner)} to accept`); }));
    }
    case 'c-accept': { const c = S.commitments.find(x => x.id === id); const acc = [...new Set([...(c.acceptedBy || []), S.me])]; return run(db.doc('us_commitments/' + id).update({ acceptedBy: acc, status: c.owners.every(o => acc.includes(o)) ? 'active' : 'proposed', acceptedAt: Date.now() })); }
    case 'c-decline': return run(db.doc('us_commitments/' + id).update({ status: 'released', releasedAt: Date.now(), note: 'Not right now' }).then(() => toast('Okay, set aside for now')));
    case 'c-withdraw': return run(db.doc('us_commitments/' + id).delete());
    case 'c-done': return run(db.doc('us_commitments/' + id).update({ status: 'done', doneAt: Date.now() }).then(() => toast('Nice. Marked done.')));
    case 'c-release': return run(db.doc('us_commitments/' + id).update({ status: 'released', releasedAt: Date.now() }).then(() => toast('Released. That’s okay.')));
    case 'c-edit': return openCommit(S.commitments.find(x => x.id === id));
    case 'c-save-edit': return run(db.doc('us_commitments/' + id).update({ text: $('#cText').value.trim(), due: $('#cDue').value || null, note: $('#cNote').value.trim() }).then(() => { closeSheet(); toast('Saved'); }));
    case 'privacy-check': return privacyCheck();
    case 'export': return exportData().catch(fail);
    case 'wipe': return wipe(t).catch(fail);
  }
});
function markSeen() {
  if (S.tab === 'feelings' && S.feelFilter === 'theirs') S.shared.filter(f => f.author === S.partner && !(f.seenBy || []).includes(S.me)).forEach(f => S.db.doc('us_feelings/' + f.id).update({ seenBy: [...(f.seenBy || []), S.me] }).catch(() => {}));
}

const FIREBASE_CONFIG = { apiKey: 'AIzaSyBgpN52-Dw9DFdE7ZivGkDVx-d9cMmUzms', authDomain: location.hostname === 'fantasyapp.io' ? 'fantasyapp.io' : 'our-budget-josh.firebaseapp.com', projectId: 'our-budget-josh', appId: '1:495368835558:web:50334ad16309d5f61fc627', messagingSenderId: '495368835558' };
const GLOGO = '<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.5c2.1-1.9 3.3-4.7 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.5-2.7c-1 .7-2.2 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.6H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.7 14.1a6.6 6.6 0 0 1 0-4.2V7.1H2.1a11 11 0 0 0 0 9.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.1-3.1A11 11 0 0 0 2.1 7.1l3.6 2.8C6.6 7.4 9.1 5.4 12 5.4z"/></svg>';
function gate(kind, extra) {
  $('#gate').hidden = false;
  let h = '<h1>Us</h1>';
  if (kind === 'signin') h += `<p>A private space for the two of you.</p><button class="gbtn" data-action="signin">${GLOGO} Sign in with Google</button><p id="gateErr" style="margin:18px auto 0;color:#ffc9c9;font-size:13px;min-height:18px"></p>`;
  else if (kind === 'denied') h += `<p>This space is private. <b>${esc(extra)}</b> doesn’t have access.</p><button class="gbtn" data-action="signout">Use a different account</button>`;
  else h += `<p>${esc(extra || 'Loading…')}</p>`;
  $('#gateBody').innerHTML = h;
}
function authFail(e) { const el = document.getElementById('gateErr'); if (el) el.textContent = 'Sign-in didn’t finish (' + ((e && e.code) || 'unknown') + ').'; }
function signIn() {
  const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
  firebase.auth().signInWithPopup(p).catch(e => {
    if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) return firebase.auth().signInWithRedirect(p).catch(authFail);
    if (e && e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') authFail(e);
  });
}
function init() {
  render();
  if (!window.firebase) { gate('error', 'Couldn’t load. Check your connection and reload.'); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth();
  auth.getRedirectResult().catch(e => setTimeout(() => authFail(e), 50));
  auth.onAuthStateChanged(u => {
    if (!u) return gate('signin');
    const em = (u.email || '').toLowerCase();
    if (!ALLOWED[em]) return gate('denied', em);
    $('#gate').hidden = true; start(u, em);
  });
}
let started = false;
function start(u, em) {
  if (started) return; started = true;
  S.me = em; S.partner = Object.keys(ALLOWED).find(e => e !== em);
  S.names[em] = (u.displayName || '').split(' ')[0] || ALLOWED[em];
  const db = firebase.firestore(); S.db = db;
  const soft = () => render();
  const failed = e => { if (e && e.code === 'permission-denied') { S.fatal = 'Your account can’t open this space yet.'; render(); } };
  let pending = 4; const ready = () => { if (--pending <= 0) { S.loaded = true; render(); } };
  db.collection(`private/${em}/feelings`).orderBy('ts', 'desc').limit(300).onSnapshot(s => { S.myFeelings = s.docs.map(d => ({ id: d.id, ...d.data() })); if (!S.loaded) ready(); else soft(); }, failed);
  db.collection('us_feelings').orderBy('ts', 'desc').limit(200).onSnapshot(s => { S.shared = s.docs.map(d => ({ id: d.id, ...d.data() })); if (!S.loaded) ready(); else soft(); }, failed);
  db.collection('us_pauses').orderBy('createdAt', 'desc').limit(20).onSnapshot(s => { S.pauses = s.docs.map(d => ({ id: d.id, ...d.data() })); if (!S.loaded) ready(); else soft(); }, failed);
  db.collection('us_commitments').orderBy('createdAt', 'desc').limit(100).onSnapshot(s => { S.commitments = s.docs.map(d => ({ id: d.id, ...d.data() })); if (!S.loaded) ready(); else soft(); }, failed);
  db.collection('us_checkins').where('week', '==', weekId()).onSnapshot(s => { S.checkins = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); soft(); }, failed);
  db.doc(`private/${em}/checkins/${weekId()}`).get().then(d => { if (d.exists) { S.myCheckin = d.data(); soft(); } }).catch(() => {});
  db.doc(`private/${em}/prefs/main`).get().then(d => { if (d.exists) { S.prefs = d.data(); soft(); } }).catch(() => {});
  db.collection('people').onSnapshot(s => { s.docs.forEach(d => { if (d.data().name) S.names[d.id] = d.data().name; }); soft(); }, () => {});
  db.doc('people/' + em).set({ name: S.names[em], updatedAt: Date.now() }, { merge: true }).catch(() => {});
}
init();
