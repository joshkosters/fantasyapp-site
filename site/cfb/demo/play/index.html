function bracket(){
  const s=seeds();const sw=cfg('semi'),fw=cfg('final');
  if(s.length===4){const m1=[s[0],s[3]],m2=[s[1],s[2]];return {semi:[m1,m2],final:[[winner(m1[0],m1[1],sw),winner(m2[0],m2[1],sw)]]}}
  if(s.length===2)return {semi:[],final:[[s[0],s[1]]]};
  return {semi:[],final:[]};
}
function matchups(w){
  if(w<=cfg('regEnd'))return regular(w);
  const b=bracket();if(w===cfg('semi'))return b.semi;if(w===cfg('final'))return b.final;return[];
}
function champion(){
  if(cw()<=cfg('final'))return null;const f=bracket().final[0];if(!f)return null;
  const x=tot(f[0],cfg('final')),y=tot(f[1],cfg('final'));return y>x?f[1]:f[0];
}
function wkLabel(w){return w<=cfg('regEnd')?'Week '+w:w===cfg('semi')?'Week '+w+' · Semifinals':w===cfg('final')?'Week '+w+' · Championship':'Week '+w}

/* ---------- actions ---------- */
async function setMsg(m){S.msg=m;render()}
async function claimPlayer(pid,uid){
  const c=S.db.doc('claims/'+pid);const a=await c.acquire({holder:S.uid,ttlMs:4000});if(!a.acquired)throw new Error('Someone else is claiming this player. Try again.');
  const s=await c.get();if(s.exists&&s.data().uid)throw new Error('Player already on a roster.');await c.set({uid});
}
async function addToRoster(uid,pid){
  const cur=((S.rosters[uid]||{}).ids||[]);if(cur.length>=ROSTER_MAX)throw new Error('Roster full ('+ROSTER_MAX+'). Drop someone first.');
  await claimPlayer(pid,uid);const ids=[...cur,pid];await S.db.doc('rosters/'+uid).set({ids});S.rosters[uid]={ids};
}
async function dropFromRoster(uid,pid){
  const ids=((S.rosters[uid]||{}).ids||[]).filter(x=>x!==pid);await S.db.doc('rosters/'+uid).set({ids});S.rosters[uid]={ids};await S.db.doc('claims/'+pid).delete();
  await S.db.doc('dropped/'+pid).set({t:Math.floor(Date.now()/1000)});// dropped players sit on waivers until the next Monday run
}
async function makePick(pid,forUid,auto){
  const d=L().draft;const k=d.pick;const uid=snakeUid(k);
  if(!auto&&uid!==S.uid)return setMsg('It is not your pick.');
  if(forUid&&forUid!==uid)return;
  try{
    const pk=S.db.doc('picks/p'+String(k).padStart(3,'0'));const a=await pk.acquire({holder:S.uid,ttlMs:4000});if(!a.acquired)return setMsg('Pick is being made. Try again.');
    const ex=await pk.get();if(ex.exists&&ex.data().pid)return setMsg('That pick was already made.');
    await addToRoster(uid,pid);try{await autoSlot(uid,pid)}catch(e){}await pk.set({k,uid,pid,auto:!!auto});
    const total=d.order.length*ROSTER_MAX;const secs=cfg('secs');
    const upd={draft:{pick:k+1,deadline:secs>0?Date.now()+secs*1000:0}};if(k+1>=total){upd.status='season';upd.draft.deadline=0}
    await S.db.doc('league/main').update(upd);setMsg('');
  }catch(e){setMsg(e.message)}
}
async function autoSlot(uid,pid){
  const p=S.players[pid];if(!p)return;const w=cw();const all=(S.lineups[uid]||{}).s||{};
  const cur=(all[w]||[]).slice();while(cur.length<SLOTS.length)cur.push('');
  if(cur.includes(pid))return;
  const i=SLOTS.findIndex(([n,el],j)=>!cur[j]&&el.includes(p.pos));if(i<0)return;
  cur[i]=pid;const s2=Object.assign({},all,{[w]:cur});await S.db.doc('lineups/'+uid).set({s:s2});S.lineups[uid]={s:s2};
}
function bestAvailable(uid){
  const own=owners();const q=(S.queues[uid]||{ids:[]}).ids||[];
  const qp=q.find(id=>S.players[id]&&!own[id]);if(qp)return qp;
  const have=((S.rosters[uid]||{}).ids||[]).map(id=>S.players[id]).filter(Boolean);const cnt={};POS.forEach(p=>cnt[p]=0);have.forEach(p=>cnt[p.pos]++);
  const lim={QB:2,RB:4,WR:4,TE:2,K:1,DEF:1};const round=have.length+1;
  const all=Object.values(S.players).filter(p=>!own[p.id]).sort((a,b)=>(a.s||99)-(b.s||99)||POS.indexOf(a.pos)-POS.indexOf(b.pos)||a.name.localeCompare(b.name));
  let pick=all.find(p=>cnt[p.pos]<lim[p.pos]&&(!['K','DEF'].includes(p.pos)||round>=10));
  if(!pick)pick=all.find(p=>!['K','DEF'].includes(p.pos)||cnt[p.pos]<1)||all[0];
  return pick&&pick.id;
}
async function autoPick(){
  const l=L();if(l.status!=='draft'||!l.draft)return;const uid=snakeUid(l.draft.pick);if(!uid)return;
  const pid=bestAvailable(uid);if(pid)await makePick(pid,uid,true);
}
async function claimTeam(name){
  name=name.trim();if(!name)return;await S.db.doc('league/main').update({teams:{[S.uid]:{name}}});
}
async function startDraft(){
  const ids=Object.keys(L().teams||{});if(ids.length<2)return setMsg('Need at least 2 teams.');
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
  const secs=cfg('secs');
  await S.db.doc('league/main').update({status:'draft',draft:{order:ids,pick:0,deadline:secs>0?Date.now()+secs*1000:0}});
}
async function importPlayers(text){
  const by={};let n=0;
  for(const line of text.split('\n')){const p=line.split(',').map(x=>x.trim());if(p.length<4||p[0].toLowerCase()==='name')continue;
    const [name,pos,school,conf]=p;const P=pos.toUpperCase();if(!POS.includes(P))continue;
    const key=school.toLowerCase().replace(/[^a-z0-9]+/g,'-');(by[key]=by[key]||{name:school,conf,players:[]}).players.push({id:key+'-'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-'),n:name,p:P});n++}
  for(const key in by){const ex=await S.db.doc('schools/'+key).get();const old=ex.exists?ex.data().players:[];const ids=new Set(by[key].players.map(x=>x.id));
    await S.db.doc('schools/'+key).set({name:by[key].name,conf:by[key].conf,players:[...old.filter(x=>!ids.has(x.id)),...by[key].players]})}
  await loadSchools();setMsg('Imported '+n+' players.');
}
async function loadSchools(){
  const q=await S.db.collection('schools').get();S.schools=q.docs.map(d=>d.data());S.players={};
  S.schools=S.schools.filter(x=>CONFS.includes(x.conf));S.tid={};
  for(const sc of S.schools){const df=sc.players.find(p=>p.p==='DEF');if(df)S.tid[sc.name]=df.a}
  for(const sc of S.schools)for(const p of sc.players)S.players[p.id]={id:p.id,name:p.n,pos:p.p,s:p.s||0,school:sc.name,conf:sc.conf,a:p.a};
}

/* lineups (set by hand) */
async function writeLineup(w,arr){const s=Object.assign({},(S.lineups[S.uid]||{}).s,{[w]:arr});S.lineups[S.uid]={s};await S.db.doc('lineups/'+S.uid).set({s});render()}
const curLineup=w=>{const a=((((S.lineups[S.uid]||{}).s||{})[w])||[]).slice();while(a.length<SLOTS.length)a.push('');return a};
async function saveLineup(w,idx,pid){
  const cur=curLineup(w);const old=S.players[cur[idx]],np=S.players[pid];
  if(w<cw())throw new Error('That week is final.');
  if(old&&isLocked(old,w))throw new Error(old.name+' has already kicked off and is locked in.');
  if(np&&isLocked(np,w))throw new Error(np.name+"'s game has already started, so he cannot be added.");
  for(let i=0;i<cur.length;i++)if(pid&&cur[i]===pid)cur[i]='';
  cur[idx]=pid||'';await writeLineup(w,cur);
}

async function doMove(k){
  if(S.mv===k){S.mv=null;render();return}
  if(!S.mv){S.mv=k;render();return}
  const w=S.tw||cw(),c=curLineup(w),a=S.mv,b=k;S.mv=null;
  const slotOf=x=>x[0]==='s'?+x.slice(1):null;const ia=slotOf(a),ib=slotOf(b);
  const pa=ia!==null?c[ia]:a.slice(1),pb=ib!==null?c[ib]:b.slice(1);
  const lk=id=>{const p=S.players[id];return p&&isLocked(p,w)};
  if(lk(pa)||lk(pb))throw new Error('A player in that move has already kicked off and is locked.');
  if(ia!==null&&ib!==null){c[ia]=pb||'';c[ib]=pa||''}
  else if(ia!==null)c[ia]=pb;else c[ib]=pa;
  await writeLineup(w,c);
}
async function copyLineup(w){
  const prev=(((S.lineups[S.uid]||{}).s||{})[w-1])||[];const roster=new Set((S.rosters[S.uid]||{ids:[]}).ids||[]);const cur=curLineup(w);
  const keep=new Set(cur.filter((id,i)=>S.players[id]&&isLocked(S.players[id],w)));
  const out=SLOTS.map((_,i)=>{const c=S.players[cur[i]];if(c&&isLocked(c,w))return cur[i];const p=S.players[prev[i]];return p&&roster.has(p.id)&&!isLocked(p,w)&&!keep.has(p.id)?p.id:''});
  await writeLineup(w,out);
}
async function clearLineup(w){const cur=curLineup(w);await writeLineup(w,cur.map(id=>S.players[id]&&isLocked(S.players[id],w)?id:''))}

/* waivers */
const wId=(u,p)=>u+'_'+p;
/* Waiver window: first kickoff of the week until Monday 8:00 AM ET. Outside it, free agents are added directly. */
const ETF=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'numeric',hourCycle:'h23'});
function mon8(ts){let t=Math.floor(ts/3600)*3600;for(let i=0;i<200;i++,t+=3600){const o={};ETF.formatToParts(new Date(t*1000)).forEach(x=>o[x.type]=x.value);if(o.weekday==='Mon'&&+o.hour===8)return t}return t}
function wWin(w){const ks=Object.values(S.kick[w]||{}).map(k=>k.ts);if(!ks.length)return null;const a=Math.min(...ks);return{a,e:mon8(a)}}
function wPhase(){const now=Date.now()/1000;let last=0;for(const w of [cw()-1,cw(),cw()+1]){const x=wWin(w);if(!x)continue;if(now>=x.a&&now<x.e)return{win:true,end:x.e,cut:last};if(x.e<=now)last=Math.max(last,x.e)}return{win:false,cut:last}}
const onWaiver=pid=>wPhase().win||!!(S.dropped||{})[pid];
const etTxt=t=>new Date(t*1000).toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',hour:'numeric',minute:'2-digit'})+' ET';
async function addFA(pid,drop){
  const l=L();if(l.status!=='season')throw new Error('Adds open when the draft is complete.');if(!l.teams[S.uid])throw new Error('Join the league first.');
  if(onWaiver(pid))throw new Error('That player is on waivers. Submit a claim instead.');
  if(owners()[pid])throw new Error('That player is on a roster.');
  const p=S.players[pid];const k=p&&kickOf(p,cw());if(k&&Date.now()/1000>=k.ts)throw new Error(p.name+"'s game has started, so he can't be added.");
  const r=((S.rosters[S.uid]||{}).ids||[]);
  if(r.length>=ROSTER_MAX){if(!drop||!r.includes(drop))throw new Error('Roster full. Choose a player to drop.');guardLocked(S.uid,[drop]);await dropFromRoster(S.uid,drop)}
  await addToRoster(S.uid,pid);
}
async function maybeW(){if(S.wbusy||!S.loaded||!S.db||L().status!=='season')return;const ph=wPhase();if(ph.win||!ph.cut||L().wrun===ph.cut)return;S.wbusy=1;try{await S.db.doc('league/main').update({wrun:ph.cut});await runWaivers(true,ph.cut)}catch(e){}S.wbusy=0}
async function submitClaim(pid){
  if(L().status!=='season')throw new Error('Waivers open when the draft is complete.');
  if(!L().teams[S.uid])throw new Error('Join the league first.');
  if(owners()[pid])throw new Error('That player is on a roster.');
  if(!onWaiver(pid))throw new Error('That player is a free agent right now, so add him directly.');
  await S.db.doc('waivers/'+wId(S.uid,pid)).set({uid:S.uid,pid,drop:'',t:Date.now()});
}
async function setClaimDrop(id,drop){await S.db.doc('waivers/'+id).update({drop})}
async function cancelClaim(id){await S.db.doc('waivers/'+id).delete()}
async function runWaivers(quiet,cut){
  const cutT=cut||Math.floor(Date.now()/1000);
  const clearDropped=async()=>{for(const id of Object.keys(S.dropped||{}))if(S.dropped[id]<=cutT)await S.db.doc('dropped/'+id).delete()};
  const claims=S.waivers.filter(c=>c.t<=cutT*1000).map(c=>({...c}));
  if(!claims.length){await clearDropped();if(!quiet)setMsg('No waiver claims to process.');return}
  let order=((L().waiver&&L().waiver.length)?L().waiver:((L().draft||{}).order||[]).slice().reverse()).slice();
  Object.keys(L().teams).forEach(u=>{if(!order.includes(u))order.push(u)});
  const log=[];let progress=true;
  while(progress){progress=false;
    for(const u of order){
      const mine=claims.filter(c=>c.uid===u&&!c.done).sort((a,b)=>a.t-b.t);
      for(const c of mine){
        c.done=1;const own=owners();const r=((S.rosters[u]||{}).ids||[]);
        if(own[c.pid]||!S.players[c.pid]||(c.drop&&lockedStarter(u,c.drop))||(c.drop&&!r.includes(c.drop))||r.length-(c.drop?1:0)>=ROSTER_MAX)continue;
        try{if(c.drop)await dropFromRoster(u,c.drop);await addToRoster(u,c.pid)}catch(e){continue}
        log.push({t:Date.now(),uid:u,add:c.pid,drop:c.drop||''});order=order.filter(x=>x!==u).concat(u);progress=true;break;
      }
      if(progress)break;
    }
  }
  for(const c of claims)await S.db.doc('waivers/'+wId(c.uid,c.pid)).delete();
  await clearDropped();
  await S.db.doc('league/main').update({waiver:order,waiverLog:[...log,...(L().waiverLog||[])].slice(0,30)});
  if(!quiet)setMsg('Waivers processed: '+log.length+' claim'+(log.length===1?'':'s')+' won.');
}

/* trades */
async function proposeTrade(){
  const t=S.tr;guardLocked(S.uid,t.give);if(!t.to||!t.give.length||!t.get.length)throw new Error('Pick a team and at least one player on each side.');
  if(L().status!=='season')throw new Error('Trades open when the draft is complete.');
  const id='t'+Date.now();await S.db.doc('trades/'+id).set({from:S.uid,to:t.to,give:t.give,get:t.get,status:'pending',t:Date.now()});
  S.tr={to:'',give:[],get:[]};setMsg('Trade offer sent.');
}
async function tradeStatus(id,status){await S.db.doc('trades/'+id).update({status})}
async function acceptTrade(id){
  const t=S.trades.find(x=>x.id===id);if(!t||t.status!=='pending'||t.to!==S.uid)throw new Error('This offer is not available.');
  const a=(S.rosters[t.from]||{ids:[]}).ids||[],b=(S.rosters[t.to]||{ids:[]}).ids||[];
  guardLocked(t.from,t.give);guardLocked(t.to,t.get);
  if(!t.give.every(p=>a.includes(p))||!t.get.every(p=>b.includes(p))){await tradeStatus(id,'void');throw new Error('Trade is no longer valid: a player has moved.')}
  const na=a.filter(x=>!t.give.includes(x)).concat(t.get),nb=b.filter(x=>!t.get.includes(x)).concat(t.give);
  if(na.length>ROSTER_MAX||nb.length>ROSTER_MAX)throw new Error('A roster would go over '+ROSTER_MAX+' players. Even up the player counts.');
  await S.db.doc('rosters/'+t.from).set({ids:na});await S.db.doc('rosters/'+t.to).set({ids:nb});S.rosters[t.from]={ids:na};S.rosters[t.to]={ids:nb};
  for(const p of t.give)await S.db.doc('claims/'+p).set({uid:t.to});
  for(const p of t.get)await S.db.doc('claims/'+p).set({uid:t.from});
  await tradeStatus(id,'accepted');
  const moved=new Set([...t.give,...t.get]);
  for(const o of S.trades)if(o.id!==id&&o.status==='pending'&&[...o.give,...o.get].some(p=>moved.has(p)))await tradeStatus(o.id,'void');
  setMsg('Trade completed.');
}

function lbl(p){return p.pos==='DEF'?'DEF':p.pos+(p.s||'')}
const BASE={QB:'#1f9d55',RB:'#2f6fdb',WR:'#f08a1c',TE:'#8e4fd1',K:'#d4a017',DEF:'#14a3a8'};
function posChip(p){const n=p.pos==='DEF'?1:Math.max(1,p.s||1);const w=Math.min(90,(n-1)*30);return '<span class="pos" style="background:color-mix(in srgb,'+BASE[p.pos]+','+'white '+w+'%);color:'+(w>=50?'#1F2853':'#fff')+'">'+esc(lbl(p))+'</span>'}
const SEAS={},GP={};
/* games played per team, from meta/games */
function parseGames(d){(d.s||'').split(',').forEach(x=>{const i=x.indexOf(':');if(i>0)GP[x.slice(0,i)]=+x.slice(i+1)})}
function avgPts(p){const g=GP[S.tid[p.school]];return g?seas(p.id).fp/g:0}

/* Win tracker. Each starter's final score ~ Normal(E, V). E = points so far + avg*share of game left (avg nudged toward his live pace);
   V = (0.6*avg, min 3)^2 * share left. Team = sum of starters; P(A wins) = Phi((E_A-E_B)/sqrt(V_A+V_B)). Uses the last posted stats, so it moves on refresh. */
function gameLeft(p,w){if(w<cw())return 0;const k=kickOf(p,w);if(!k)return 1;const t=(S.stats['w'+w]||{}).t||0;const el=Math.min(1,Math.max(0,(t/1000-k.ts)/10800));return 1-el}
function playerEV(p,w){const mu=projPts(p,w),f=gameLeft(p,w),act=weekPts(p.id,w)||0;
  if(isBye(p,w))return {e:0,v:0};
  const el=1-f;const pace=el>0.05?act/el:mu;const m2=(mu+el*pace)/(1+el);
  const sd=Math.max(3,0.6*mu);return {e:act+m2*f,v:sd*sd*f}}
function teamEV(u,w){let e=0,v=0;for(const x of lineup(u,w).starters)if(x.p){const r=playerEV(x.p,w);e+=r.e;v+=r.v}return {e,v}}
function normCdf(z){const t=1/(1+0.2316419*Math.abs(z)),d=0.3989423*Math.exp(-z*z/2);let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
function winPct(a,b,w){const A=teamEV(a,w),B=teamEV(b,w),sd=Math.sqrt(A.v+B.v);
  if(sd<0.01)return A.e>B.e?1:A.e<B.e?0:.5;return normCdf((A.e-B.e)/sd)}

const abbr=p=>{if(p.pos==='DEF')return p.name;const t=p.name.split(' ');return t.length>1?t[0][0]+'. '+t.slice(1).join(' '):p.name};
function gameLine(p,w,up){const d=((S.stats['w'+w]||{}).s||{})[p.id];if(!d){const k=kickOf(p,w),n=Date.now()/1000;if(k&&k.ts>0&&w===cw()&&n>=k.ts&&n<k.ts+10800)return 'In progress';return up?esc(kickTxt(p,w)):'—'}const n=k=>d[k]||0;
  if(p.pos==='QB')return n('py')+'YDS, '+n('ptd')+'TD, '+n('int')+'INT';
  if(p.pos==='RB')return n('ry')+'YDS, '+n('rtd')+'TD, '+n('rec')+'REC';
  if(p.pos==='WR'||p.pos==='TE')return n('rec')+'REC, '+n('recy')+'YDS, '+n('rectd')+'TD';

  const fire=s=>setTimeout(()=>{try{s.kind==='doc'?s.cb(sd(s.path)):s.cb({docs:cdocs(s.path,s.ord)})}catch(e){console.error(e)}},0);
  const wr=(p,v)=>{if(v===undefined)store.delete(p);else store.set(p,v);subs.forEach(s=>{if(s.kind==='doc'?s.path===p:inCol(s.path,p))fire(s)})};
  const subscribe=(s,cb)=>{s.cb=cb;subs.push(s);fire(s);return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}};
  const colObj=(path,ord)=>({get:async()=>({docs:cdocs(path,ord)}),onSnapshot:(cb)=>subscribe({kind:'col',path,ord},cb),orderBy:f=>colObj(path,f)});
  const db={doc:p=>({acquire:async()=>({acquired:true}),get:async()=>sd(p),set:async d=>wr(p,clone(d)),update:async d=>wr(p,merge(store.get(p),d)),delete:async()=>wr(p,undefined),onSnapshot:(cb)=>subscribe({kind:'doc',path:p},cb)}),collection:p=>colObj(p)};
  const put=(p,v)=>store.set(p,clone(v));
  /* seed */
  schoolsJ.forEach(s=>put('schools/'+s.key,s));
  const tidOf={},schoolOf={};schoolsJ.forEach(s=>{const d=s.players.find(p=>p.p==='DEF');tidOf[s.name]=d.a;s.players.forEach(p=>schoolOf[p.id]=s.name)});
  const nowS=Date.now()/1000,offs=[-7.5,-6.5,-5,-1.6,-1.1,-.6,1.2,2.6,4.1,20,21,22],ks={};
  seed.pairs9.forEach(([a,b],i)=>{const h=seed.ko[a]!=null?seed.ko[a]:seed.ko[b]!=null?seed.ko[b]:offs[(i*5)%offs.length];const t=Math.floor(nowS+h*3600);ks[a]=ks[b]=t});
  put('meta/kick',{off:1,s:'9|'+Object.entries(ks).map(([t,v])=>t+':'+(v-1)).join(',')});
  put('meta/sched',{names:seed.names_map,sch:seed.sch});put('meta/tv',{s:''});put('meta/status',{m:{},r:{}});
  put('meta/games',{thru:8,s:seed.tids.map(t=>t+':8').join(',')});
  const teams={};Object.keys(seed.names).forEach(u=>teams[u]={name:seed.names[u]});
  const base={name:'Fantasy CFB',teams,commish:'u1',conferences:['Big Ten','SEC','Big 12'],start:1,regEnd:11,semi:12,final:13,secs:60};
  if(DRAFT){
    const pk=seed.picks.slice(0,8),ro={u1:[],u2:[],u3:[],u4:[]};
    pk.forEach(p=>{put('picks/p'+String(p.k).padStart(3,'0'),p);ro[p.uid].push(p.pid);put('claims/'+p.pid,{uid:p.uid})});
    Object.keys(ro).forEach(u=>put('rosters/'+u,{ids:ro[u]}));
    put('league/main',Object.assign({},base,{status:'draft',week:1,draft:{order:seed.order,pick:8,deadline:Date.now()+60000}}));
  }else{
    seed.picks.forEach(p=>{put('picks/p'+String(p.k).padStart(3,'0'),p);put('claims/'+p.pid,{uid:p.uid})});
    Object.keys(seed.rosters).forEach(u=>{put('rosters/'+u,seed.rosters[u]);put('lineups/'+u,seed.lineups[u])});
    for(let w=1;w<=9;w++){let s=seed.stats[w];if(w===9){const f={};for(const id in s){const k=ks[tidOf[schoolOf[id]]];if(k&&k+10800<=nowS)f[id]=s[id]}s=f}put('stats/w'+w,{s,t:Date.now()})}
    put('league/main',Object.assign({},base,{status:'season',week:9,draft:{order:seed.order,pick:56,deadline:0}}));
  }
  S.db=db;S.uid='u1';
  if(DRAFT)setInterval(()=>{const l=S.league;if(l&&l.status==='draft'&&l.draft&&!S.botBusy&&snakeUid(l.draft.pick)!==S.uid){S.botBusy=1;autoPick().finally(()=>S.botBusy=0)}},2200);
  await loadSchools();
  try{const m=await db.doc('meta/sched').get();if(m.exists)parseSched(m.data())}catch(e){}
  try{const m=await db.doc('meta/kick').get();if(m.exists)parseKick(m.data())}catch(e){}
  try{const m=await db.doc('meta/tv').get();if(m.exists)parseTv(m.data())}catch(e){}
  try{const m=await db.doc('meta/games').get();if(m.exists)parseGames(m.data())}catch(e){}
  try{const m=await db.doc('meta/season').get();if(m.exists)parseSeason(m.data())}catch(e){}
  db.doc('league/main').onSnapshot(s=>{S.league=s.exists?s.data():null;S.loaded=true;rs()},()=>{});
  db.collection('rosters').onSnapshot(q=>{S.rosters={};q.docs.forEach(d=>S.rosters[d.id]=d.data());rs()},()=>{});
  db.collection('picks').orderBy('k','asc').onSnapshot(q=>{S.picks=q.docs.map(d=>d.data());rs()},()=>{});
  db.collection('news').onSnapshot(q=>{S.news={};q.docs.forEach(d=>S.news[d.id]=d.data());rs()},()=>{});
  db.collection('stats').onSnapshot(q=>{S.stats={};q.docs.forEach(d=>S.stats[d.id]=d.data());rs()},()=>{});
  db.collection('lineups').onSnapshot(q=>{S.lineups={};q.docs.forEach(d=>S.lineups[d.id]=d.data());rs()},()=>{});
  db.doc('flags/'+S.uid).onSnapshot(d=>{S.flags=(d.exists&&d.data().ids)||[];rs()},()=>{});
  db.doc('meta/status').onSnapshot(d=>{S.inj=(d.exists&&d.data().m)||{};S.injR=(d.exists&&d.data().r)||{};rs()},()=>{});
  db.collection('queues').onSnapshot(q=>{S.queues={};q.docs.forEach(d=>S.queues[d.id]=d.data());rs()},()=>{});
  db.collection('profiles').onSnapshot(q=>{S.prof={};q.docs.forEach(d=>S.prof[d.id]=(d.data()||{}).img);rs()},()=>{});
  db.collection('dropped').onSnapshot(q=>{S.dropped={};q.docs.forEach(d=>S.dropped[d.id]=(d.data()||{}).t||0);rs()},()=>{});
  setTimeout(maybeW,5000);setInterval(maybeW,60000);
  db.collection('waivers').onSnapshot(q=>{S.waivers=q.docs.map(d=>d.data());rs()},()=>{});
  db.collection('trades').onSnapshot(q=>{S.trades=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.t-b.t);rs()},()=>{});
  if(S.isAdmin){const m=await db.doc('league/main').get();if(!m.exists)await db.doc('league/main').set({name:'Fantasy CFB',status:'setup',week:8,teams:{},conferences:CONFS})}
  render();
})();
</script>
