function deriveMonth() { S.expenses = S.allExp.filter(e => e.month === S.cur); }
/* ---------- Gmail (LMCU alerts) ---------- */
function gmailToken() { try { const t = JSON.parse(localStorage.getItem('gmailTok') || 'null'); if (t && t.exp > Date.now() + 60000) return t.tok; } catch (e) {} return null; }
async function connectGmail() {
  const p = new firebase.auth.GoogleAuthProvider();
  p.addScope('https://www.googleapis.com/auth/gmail.readonly');
  p.setCustomParameters({ login_hint: S.email || '' });
  const r = await firebase.auth().currentUser.reauthenticateWithPopup(p);
  const tok = r && r.credential && r.credential.accessToken;
  if (tok) { try { localStorage.setItem('gmailTok', JSON.stringify({ tok, exp: Date.now() + 55 * 60000 })); } catch (e) {} }
  S.syncErr = null;
  return tok;
}
async function gmail(path) {
  const tok = gmailToken(); if (!tok) throw { code: 'needs_token' };
  const r = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/' + path, { headers: { Authorization: 'Bearer ' + tok } });
  if (r.status === 401) { try { localStorage.removeItem('gmailTok'); } catch (e) {} throw { code: 'needs_token' }; }
  if (r.status === 403) { const j = await r.json().catch(() => ({})); throw { code: 'gmail_403', message: (j.error && j.error.message) || '' }; }
  if (!r.ok) throw { code: 'unavailable' };
  return r.json();
}
function gmailErr(e) {
  const code = e && e.code;
  if (code === 'needs_token' || code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') return { msg: 'Tap Sync to connect Gmail and check your LMCU alerts.', retry: true };
  if (code === 'auth/popup-blocked') return { msg: 'Your browser blocked the Google window. Allow pop-ups for fantasyapp.io and tap Sync again.', retry: true };
  if (code === 'gmail_403') return { msg: /has not been used|disabled/i.test(e.message || '') ? 'The Gmail API still needs to be turned on for this project.' : 'Google didn\u2019t allow reading Gmail. Tap Sync and make sure the Gmail box is checked.', retry: true };
  if (code === 'permission-denied') return { msg: 'Your account can\u2019t write to this budget.' };
  if (code === 'resource-exhausted' || code === 'quota-exceeded') return { msg: 'The budget hit its free storage or usage limit for today.' };
  return { msg: 'Couldn\u2019t check your LMCU alerts. Try again.', retry: true };
}

function signIn() {
  const p = new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({ prompt: 'select_account' });
  firebase.auth().signInWithPopup(p).catch(e => {
    if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) return firebase.auth().signInWithRedirect(p).catch(authFail);
    if (e && e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') authFail(e);
  });
}
function init() {
  render();
  if (!window.firebase) { gate('error', 'Couldn\u2019t load. Check your connection and reload.'); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth();
  auth.getRedirectResult().catch(e => setTimeout(() => authFail(e), 50));
  auth.onAuthStateChanged(u => {
    if (!u) { gate('signin'); return; }
    const em = (u.email || '').toLowerCase();
    if (!ALLOWED[em]) { gate('denied', em); return; }
    $('#gate').hidden = true;
    start(u, em);
  });
}
let started = false;
function start(u, em) {
  if (started) return; started = true;
  S.me = em; S.email = em; S.isOwner = em === OWNER; S.canSync = S.isOwner;
  S.names[em] = (u.displayName || '').split(' ')[0] || ALLOWED[em];
  const db = firebase.firestore(); S.db = db;
  const timer = setTimeout(() => { if (!S.monthsLoaded) { S.stale = true; renderSoft(); } }, 10000);
  const fail = err => { if (err && err.code === 'permission-denied') { S.fatal = 'Your account doesn\u2019t have access to this budget yet.'; render(); } };
  db.collection('months').onSnapshot(snap => {
    const next = {}; snap.docs.forEach(d => { next[d.id] = d.data(); });
    S.months = next; S.monthsLoaded = true;
    if (!snap.metadata.fromCache) { clearTimeout(timer); S.stale = false; }
    renderSoft();
  }, err => { clearTimeout(timer); S.monthsLoaded = true; fail(err); if (!S.fatal) S.fatal = 'Couldn\u2019t load your budget. Reload to try again.'; render(); });
  db.collection('expenses').onSnapshot(snap => { S.allExp = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.expLoaded = true; deriveMonth(); renderSoft(); }, err => { S.expLoaded = true; fail(err); renderSoft(); });
  db.collection('receipts').onSnapshot(snap => { S.receipts = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderSoft(); }, fail);
  db.doc('meta/settings').onSnapshot(snap => { S.settings = snap.exists ? snap.data() : {}; renderSoft(); }, fail);
  db.collection('inbox').where('status', '==', 'new').onSnapshot(snap => { S.inbox = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderSoft(); }, fail);
  db.doc('meta/rules').onSnapshot(snap => { S.rules = (snap.exists && snap.data().merchants) || {}; if (S.tab === 'inbox') renderSoft(); }, fail);
  db.doc('meta/sync').onSnapshot(snap => { if (snap.exists) { S.lastSync = Number(snap.data().lastSync) || 0; renderSoft(); } }, fail);
  db.collection('people').onSnapshot(snap => { snap.docs.forEach(d => { if (d.data().name) S.names[d.id] = d.data().name; }); renderSoft(); }, fail);
  db.doc('people/' + em).set({ name: S.names[em], updatedAt: Date.now() }, { merge: true }).catch(() => {});
  render();
  if (S.canSync && gmailToken()) setTimeout(() => syncBank(false), 1500);
}
// Import of the data copied from the claude.ai version of this app.
async function importData(txt) {
  const D = JSON.parse(txt); const db = S.db;
  const who = b => b === 'OWNER' ? OWNER : b === 'PARTNER' ? 'tlturner9@gmail.com' : b || null;
  const ops = [];
  for (const [id, d] of Object.entries(D.months || {})) { const o = { ...d }; if (o.updatedBy) o.updatedBy = OWNER; ops.push(['months/' + id, o]); }
  for (const [id, d] of D.expenses || []) ops.push(['expenses/' + id, { ...d, by: who(d.by) }]);
  for (const [id, d] of D.receipts || []) ops.push(['receipts/' + id, { ...d, by: who(d.by) }]);
  for (const [id, d] of D.inbox || []) ops.push(['inbox/' + id, d]);
  if (D.rules) ops.push(['meta/rules', { merchants: D.rules }]);
  if (D.settings && Object.keys(D.settings).length) ops.push(['meta/settings', D.settings]);
  if (D.lastSync) ops.push(['meta/sync', { lastSync: D.lastSync, by: OWNER }]);
  for (let i = 0; i < ops.length; i += 400) { const b = db.batch(); for (const [p, d] of ops.slice(i, i + 400)) b.set(db.doc(p), d); await b.commit(); }
  return { expenses: (D.expenses || []).length, inbox: (D.inbox || []).length };
}
init();
