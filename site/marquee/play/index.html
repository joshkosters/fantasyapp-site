<style>
/* Layout: a box-office ticket. Header stub; setup menu, then a scoreboard + prize wheel that deals one of five games per turn. */
:root {
  --paper: #F4F5F7; --card: #FFFFFF; --ink: #1B1E28; --muted: #5B6273; --slate: #5B6273; --line: #DCDFE5;
  --accent: #E4572E; --accent-ink: #FFFFFF; --accent-soft: #FCE4DC;

  --near: #B7791F; --near-soft: #FBEFD9;
  --shadow: 0 1px 0 rgba(27,30,40,.06), 0 6px 18px -10px rgba(27,30,40,.30);
  --w1: #5B54E8; --wt1: #FFFFFF; --w2: #9A4FD6; --wt2: #FFFFFF; --w3: #14A394; --wt3: #FFFFFF; --w4: #F0A92C; --wt4: #1B1E28; --w5: #1A8FD6; --wt5: #FFFFFF; --w6: #E0457F; --wt6: #FFFFFF;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  --mono: "Courier Prime", "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14161D; --card: #1D2029; --ink: #ECEEF3; --muted: #A2A9B8; --slate: #A2A9B8; --line: #2E3340;
    --accent: #FF7148; --accent-ink: #14161D; --accent-soft: #3D2219;
    --good: #4CC38A; --good-soft: #173528; --bad: #F07575; --bad-soft: #3E1F22;
    --near: #E9B24F; --near-soft: #3A2E17;
    --shadow: 0 1px 0 rgba(0,0,0,.4), 0 8px 20px -10px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14161D; --card: #1D2029; --ink: #ECEEF3; --muted: #A2A9B8; --slate: #A2A9B8; --line: #2E3340;
    --accent: #FF7148; --accent-ink: #14161D; --accent-soft: #3D2219;
    --good: #4CC38A; --good-soft: #173528; --bad: #F07575; --bad-soft: #3E1F22;
    --near: #E9B24F; --near-soft: #3A2E17;
    --shadow: 0 1px 0 rgba(0,0,0,.4), 0 8px 20px -10px rgba(0,0,0,.7);
    color-scheme: dark;
}
/* Per-game themes: a light tint of the game's wheel color on the page, game color for accents */
:root[data-game="grid"] { --paper: #E8E9F6; --card: #FBFAFE; --line: #BDBDE5; --accent: #4F46E5; --accent-ink: #FFFFFF; --accent-soft: #E6E5FB; }
:root[data-game="mystery"] { --paper: #EDE8F4; --card: #FCFAFE; --line: #CABCDF; --accent: #8B3FC9; --accent-ink: #FFFFFF; --accent-soft: #EFE4F7; }
:root[data-game="cast"] { --paper: #E4EDEE; --card: #F9FCFC; --line: #AECBCD; --accent: #0D8478; --accent-ink: #FFFFFF; --accent-soft: #DDEEEC; }
:root[data-game="connect"] { --paper: #EEEBE6; --card: #FDFBF9; --line: #CFC4B4; --accent: #A16207; --accent-ink: #FFFFFF; --accent-soft: #F2E9DC; }
:root[data-game="timeline"] { --paper: #E4ECF2; --card: #F9FBFD; --line: #AEC7DA; --accent: #0B72B5; --accent-ink: #FFFFFF; --accent-soft: #DDEBF5; }
:root[data-game="degrees"] { --paper: #F0E7ED; --card: #FDFAFB; --line: #D6B9CA; --accent: #C2336A; --accent-ink: #FFFFFF; --accent-soft: #F6E2EA; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-game="grid"] { --paper: #1E1F2F; --card: #27293C; --line: #494B75; --accent: #8E88FF; --accent-ink: #14161D; --accent-soft: #3A3B61; }
  :root:not([data-theme="light"])[data-game="mystery"] { --paper: #22202E; --card: #2C2A3B; --line: #584D72; --accent: #C391F2; --accent-ink: #14161D; --accent-soft: #483D5D; }
  :root:not([data-theme="light"])[data-game="cast"] { --paper: #172429; --card: #202F36; --line: #325D62; --accent: #3CC9B9; --accent-ink: #14161D; --accent-soft: #254C4E; }
  :root:not([data-theme="light"])[data-game="connect"] { --paper: #262321; --card: #302D2C; --line: #655743; --accent: #F2B54A; --accent-ink: #14161D; --accent-soft: #544732; }
  :root:not([data-theme="light"])[data-game="timeline"] { --paper: #1A232E; --card: #232E3B; --line: #3B5872; --accent: #5BB8F2; --accent-ink: #14161D; --accent-soft: #2D485D; }
  :root:not([data-theme="light"])[data-game="degrees"] { --paper: #261E28; --card: #302935; --line: #65485E; --accent: #F27FAA; --accent-ink: #14161D; --accent-soft: #54394B; }
}
:root[data-theme="dark"][data-game="grid"] { --paper: #1E1F2F; --card: #27293C; --line: #494B75; --accent: #8E88FF; --accent-ink: #14161D; --accent-soft: #3A3B61; }
:root[data-theme="dark"][data-game="mystery"] { --paper: #22202E; --card: #2C2A3B; --line: #584D72; --accent: #C391F2; --accent-ink: #14161D; --accent-soft: #483D5D; }
:root[data-theme="dark"][data-game="cast"] { --paper: #172429; --card: #202F36; --line: #325D62; --accent: #3CC9B9; --accent-ink: #14161D; --accent-soft: #254C4E; }
:root[data-theme="dark"][data-game="connect"] { --paper: #262321; --card: #302D2C; --line: #655743; --accent: #F2B54A; --accent-ink: #14161D; --accent-soft: #544732; }
:root[data-theme="dark"][data-game="timeline"] { --paper: #1A232E; --card: #232E3B; --line: #3B5872; --accent: #5BB8F2; --accent-ink: #14161D; --accent-soft: #2D485D; }
:root[data-theme="dark"][data-game="degrees"] { --paper: #261E28; --card: #302935; --line: #65485E; --accent: #F27FAA; --accent-ink: #14161D; --accent-soft: #54394B; }
body { transition: background-color .45s ease; }
:root[data-game] body { box-shadow: inset 0 5px 0 var(--accent); }
.playhead { border-left: 5px solid var(--accent); padding-left: 12px; }
.playhead .disp { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { body { transition: none; } }
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h2, h3 { margin: 0; }

.wrap { max-width: 620px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 48px; display: flex; flex-direction: column; gap: 18px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }

.stub { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 2px dashed var(--line); padding-bottom: 14px; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.brand .h1 { font-family: var(--display); font-weight: 900; font-size: clamp(2.2rem, 9vw, 3.1rem); line-height: .9; letter-spacing: .01em; text-transform: uppercase; }
.brand .h1 span { color: var(--accent); }
.admit { font-family: var(--mono); font-size: .8rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }

.btn { border: 1.5px solid var(--ink); background: transparent; padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: .85rem; cursor: pointer; }
.btn:hover { background: var(--ink); color: var(--paper); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); background: var(--accent); color: var(--accent-ink); }
.btn.big { font-size: 1.05rem; padding: 12px 28px; font-weight: 700; }
.btn:disabled { opacity: .4; cursor: default; }
.btn:disabled:hover { background: transparent; color: inherit; }
.btn.primary:disabled:hover { background: var(--accent); color: var(--accent-ink); }

.eyebrow { font-size: .66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.disp { font-family: var(--display); font-weight: 800; text-transform: uppercase; line-height: 1; }
.hint { font-size: .85rem; color: var(--muted); margin: 0; max-width: 62ch; }
.tier { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; padding: 3px 8px; border-radius: 4px; }
.tier.easy { background: var(--good-soft); color: var(--good); }
.tier.medium { background: var(--accent-soft); color: var(--accent); }
.tier.hard { background: var(--bad-soft); color: var(--bad); }

/* Session strip */
.strip { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); border: 2px solid var(--ink); border-radius: 8px; background: var(--card); }
.strip > div { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.strip > div + div { border-left: 2px dashed var(--line); }
.strip b { font-family: var(--display); font-size: 1.7rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.movedots { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.movedots i { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line); }
.movedots i.on { background: var(--accent); box-shadow: none; }

/* Wheel */
.wheelbox { position: relative; width: min(100%, 340px); margin: 0 auto; aspect-ratio: 1; max-width: 100%; }
.wheel { width: 100%; height: 100%; transition: transform 3.4s cubic-bezier(.12,.7,.18,1); }
.wheel text { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
.pointer { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 26px solid var(--accent); filter: drop-shadow(0 2px 0 var(--ink)); z-index: 2; }
.landed { text-align: center; font-family: var(--display); font-size: 1.6rem; font-weight: 800; text-transform: uppercase; min-height: 1.8rem; }

/* Game cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.gcard { text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 8px; padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.gcard:hover { border-color: var(--accent); }
.gcard .disp { font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
.gcard .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.gcard p { margin: 0; font-size: .8rem; color: var(--muted); }
.sec-title { font-family: var(--display); font-size: 1.35rem; font-weight: 800; text-transform: uppercase; }

/* Play header */
.playhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.playhead .disp { font-size: 1.9rem; }
.pill { font-family: var(--mono); font-size: .8rem; border: 1.5px solid var(--ink); border-radius: 999px; padding: 3px 10px; font-variant-numeric: tabular-nums; }

/* Result */
.result { border: 2px solid var(--ink); border-radius: 8px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; background: var(--card); box-shadow: var(--shadow); position: relative; }
.result::before, .result::after { content: ""; position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); transform: translateY(-50%); }
.result::before { left: -11px; clip-path: inset(0 0 0 50%); }
.result::after { right: -11px; clip-path: inset(0 50% 0 0); }
.score { font-family: var(--display); font-weight: 900; font-size: 2.6rem; line-height: 1; }
.score small { font-size: 1.1rem; color: var(--muted); font-weight: 700; }
.result p { margin: 0; }
.log { display: flex; flex-direction: column; gap: 4px; font-size: .88rem; }
.log div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding: 4px 0; }
.log b { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Grid game */
.punches { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.punches .lbl { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-right: 2px; font-weight: 600; }
.hole { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.hole.used { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, minmax(0, 1fr)); gap: 6px; }
.head { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 6px 4px; min-width: 0; text-align: center; }
.head.rowh { text-align: right; align-items: flex-end; padding-right: 8px; }
.head.col { align-items: center; justify-content: flex-end; padding-bottom: 8px; }
.catval { font-family: var(--display); font-weight: 800; font-size: clamp(1rem, 4.2vw, 1.35rem); line-height: 1.02; text-transform: uppercase; text-wrap: balance; overflow-wrap: break-word; hyphens: auto; }
.catval.long { font-size: clamp(.78rem, 3.1vw, 1.05rem); }
.corner { display: flex; align-items: center; justify-content: center; }
.corner span { font-family: var(--mono); font-size: .75rem; color: var(--muted); text-align: center; }
.cell { aspect-ratio: 1; max-width: 100%; border: 1.5px solid var(--line); background: var(--card); border-radius: 6px; cursor: pointer; padding: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 3px; min-width: 0; transition: border-color .12s, transform .12s; }
.cell:hover:not(.filled) { border-color: var(--accent); transform: translateY(-1px); }
.cell .plus { font-family: var(--display); font-size: 1.8rem; color: var(--line); font-weight: 600; line-height: 1; }
.cell.filled { background: var(--good-soft); border-color: var(--good); }
.cell.filled .t { font-family: var(--display); font-weight: 800; font-size: clamp(.82rem, 3.4vw, 1.05rem); line-height: 1.05; text-transform: uppercase; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.cell .y { font-family: var(--mono); font-size: .7rem; color: var(--muted); }
.cell .rar { font-size: .62rem; color: var(--good); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.cell.missed { background: var(--bad-soft); border-color: var(--bad); border-style: dashed; }
.cell.missed .miss { font-size: .7rem; font-weight: 600; color: var(--bad); text-transform: uppercase; letter-spacing: .06em; }
.shake { animation: shake .35s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

/* Search */
.search { display: flex; flex-direction: column; gap: 6px; }
.search input { width: 100%; font: inherit; font-size: 1rem; padding: 12px 14px; border: 2px solid var(--ink); border-radius: 8px; background: var(--card); color: var(--ink); }
.list { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.search .list { max-height: 260px; }
.opt { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; text-align: left; border: 0; background: transparent; padding: 10px 8px; border-radius: 6px; cursor: pointer; border-bottom: 1px solid var(--line); }
.opt:hover, .opt.hl { background: var(--card); }
.opt .ot { font-weight: 600; min-width: 0; }
.oy { font-family: var(--mono); font-size: .8rem; color: var(--muted); flex: none; }
.opt:disabled { opacity: .4; cursor: default; }
.opt .tag { font-size: .65rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); flex: none; }
.empty { color: var(--muted); font-size: .85rem; padding: 10px 8px; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(10,13,20,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.sheet { background: var(--paper); width: 100%; max-width: 620px; max-height: 82%; border-radius: 14px 14px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -10px 30px rgba(0,0,0,.25); }
.sheet .list { flex: 1; min-height: 120px; max-height: none; }
.pair { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .82rem; }
.chip { border: 1.5px solid var(--ink); border-radius: 4px; padding: 3px 8px; font-weight: 600; }
.x { font-family: var(--mono); color: var(--accent); font-weight: 700; }
.ans { padding: 8px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
.ans.mine { font-weight: 700; color: var(--good); }
.sheethead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sheethead h3 { font-family: var(--display); font-size: 1.3rem; text-transform: uppercase; font-weight: 800; }
.close { border: 0; background: transparent; font-size: 1.4rem; cursor: pointer; padding: 4px 8px; line-height: 1; color: var(--muted); }

/* Mystery */
.known { border: 1.5px dashed var(--line); border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px 14px; }
.known div { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.known span:last-child { font-weight: 600; font-size: .88rem; overflow-wrap: anywhere; }
.guesscard { border: 1.5px solid var(--line); border-radius: 8px; background: var(--card); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.guesscard.win { border-color: var(--good); }
.guesscard .gt { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.guesscard .gt b { font-family: var(--display); font-size: 1.15rem; text-transform: uppercase; font-weight: 800; line-height: 1.05; min-width: 0; }
.fbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 5px; }
.fb { border-radius: 5px; padding: 6px 8px; display: flex; flex-direction: column; gap: 1px; min-width: 0; border: 1.5px solid transparent; }
.fb .fl { font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; opacity: .85; }
.fb .fv { font-size: .82rem; font-weight: 600; overflow-wrap: anywhere; line-height: 1.25; }
.fb .fv em { font-style: normal; text-decoration: underline; text-decoration-thickness: 2px; }
.s-hit { background: var(--good-soft); color: var(--good); border-color: var(--good); }
.s-near { background: var(--near-soft); color: var(--near); border-color: var(--near); }
.s-miss { background: transparent; color: var(--muted); border-color: var(--line); }
.hintpick { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; }
.hp { text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.hp b { font-family: var(--display); font-size: 1.1rem; text-transform: uppercase; color: var(--accent); }
.hp span { font-size: .8rem; color: var(--muted); }
.hp:hover:not(:disabled) { border-color: var(--accent); }
.hp:disabled { opacity: .45; cursor: default; }
.seg.minor button { font-weight: 500; font-size: .8rem; padding: 5px 9px; }
.hintbox { border-left: 3px solid var(--accent); padding: 6px 10px; display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: .75rem; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 4px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; border: 1.5px solid; }

/* Cast reveal */
.clues { display: flex; flex-direction: column; gap: 6px; }
.clue { display: flex; gap: 12px; align-items: baseline; border: 1.5px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--card); }
.clue .n { font-family: var(--mono); font-size: .8rem; color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
.clue .k { font-size: .66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); flex: none; width: 74px; }
.clue .v { font-weight: 600; min-width: 0; }
.clue.locked { border-style: dashed; background: transparent; color: var(--muted); }

/* Connections */
.solved { display: flex; flex-direction: column; gap: 6px; }
.grp { border-radius: 6px; padding: 10px 12px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.grp b { font-family: var(--display); font-size: 1.1rem; text-transform: uppercase; }
.grp span { font-size: .8rem; }
.g0 { background: var(--accent-soft); color: var(--ink); }
.g1 { background: var(--good-soft); color: var(--ink); }

const GENRES = { sf:"Sci-Fi", cr:"Crime", wa:"War", an:"Animated", ho:"Horror", co:"Comedy", we:"Western", mu:"Musical", su:"Superhero", sp:"Sports", fa:"Fantasy", ro:"Romance" };
function norm(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").trim(); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const $ = id => document.getElementById(id);

const RMAP = {};
RATINGS.trim().split("\n").forEach(l=>{ const k=l.lastIndexOf("="); RMAP[l.slice(0,k)] = +l.slice(k+1); });
const MOVIES = RAW.trim().split("\n").map((line,i)=>{
  const [title,year,dirs,cast,tags,aliases] = line.split("|");
  return { i, title, year:+year, dirs:dirs.split(";"), cast:cast.split(";"), tags:(tags||"").split(" ").filter(Boolean),
    rating: RMAP[title], keys:[title,...(aliases?aliases.split(";"):[])].map(norm) };
});
const genresOf = m => m.tags.filter(t=>GENRES[t]);
(()=>{
  const byTitle = new Map(MOVIES.map(m=>[m.title,m]));
  const extra = new Map(); FULLCAST.trim().split("\n").forEach(l=>{ const k=l.indexOf("|"); if(k>0) extra.set(l.slice(0,k), l.slice(k+1).split(";").filter(Boolean)); });
  const plots = new Map(); PLOTS.trim().split("\n").forEach(l=>{ const k=l.indexOf("|"); if(k>0) plots.set(l.slice(0,k), l.slice(k+1)); });
  MOVIES.forEach(m=>{
    const keys = new Set(m.cast.map(norm)); const full = m.cast.slice();
    (extra.get(m.title)||[]).forEach(a=>{ const k = norm(a); if(!keys.has(k)){ keys.add(k); full.push(a); } });
    m.full = full; m.fullKeys = keys; m.plot = plots.get(m.title) || "";
  });
})();

/* ---------- Categories (shared by Grid and Connections) ---------- */
function decadeOf(y){ return y<1970 ? "pre70" : (Math.floor(y/10)*10)+"s"; }
const TITLE_NUM = /\b(\d+|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|hundred|thousand|million|first|second|third|fourth|fifth)\b/i;
const TITLE_COLOR = /\b(red|blue|green|black|white|gold|golden|silver|pink|orange|purple|yellow|grey|gray|scarlet|violet|crimson|brown)\b/i;
const TITLE_ANIMAL = /\b(dogs?|cats?|birds?|wolf|wolves|wolverine|lions?|tigers?|bears?|fox|foxes|rabbits?|horses?|snakes?|spiders?|monkeys?|apes|pandas?|eagles?|falcon|raven|crow|doves?|swans?|ducks?|fish|whales?|sharks?|pigs?|sheep|lambs|goats?|mouse|mice|rats?|elephants?|zebras?|gorillas?|deer|bulls?|cows?|hounds?|frogs?|turtles?|mockingbird|heron|sparrows?|chickens?|hedgehog|penguins?|butterfly|bees?|scorpion|lizards?|jaws)\b/i;
function buildCats(){
  const map = new Map();
  const add = (id, type, eyebrow, label, group, mi) => {
    if(!map.has(id)) map.set(id, {id, type, eyebrow, label, group, set:new Set()});
    map.get(id).set.add(mi);
  };
  for(const m of MOVIES){
    m.dirs.forEach(d=>add("d:"+d,"director","Directed by",d,"Directed by "+d,m.i));
    m.cast.forEach(a=>add("a:"+a,"actor","Starring",a,"Starring "+a,m.i));
    const dec = decadeOf(m.year);
    add("y:"+dec,"decade","Released", dec==="pre70" ? "Before 1970" : "The "+dec, dec==="pre70" ? "Released before 1970" : "Released in the "+dec, m.i);
    m.tags.forEach(t=>{
      if(GENRES[t]) add("g:"+t,"genre","Genre",GENRES[t],"Genre: "+GENRES[t],m.i);
      if(t==="bp") add("bp","oscar","Oscars","Best Picture winner","Best Picture winners",m.i);
      if(t==="sq") add("sq","sequel","Franchise","A sequel","Sequels",m.i);
    });
    const plain = m.title.replace(/[^A-Za-z0-9\s'-]/g,"").trim();
    if(/^The\s/.test(m.title)) add("the","title","Title","Starts with “The”","Titles starting with “The”",m.i);
    if(!/\s/.test(plain)) add("one","title","Title","One-word title","One-word titles",m.i);
    // Title trivia (ignore the "(1984)" we add to tell remakes apart)
    const t = m.title.replace(/\s*\(\d{4}\)$/,"");
    if(TITLE_NUM.test(t)) add("tnum","title","Title","A number in the title","Numbers in the title",m.i);
    if(TITLE_COLOR.test(t)) add("tcol","title","Title","A color in the title","Colors in the title",m.i);
    if(TITLE_ANIMAL.test(t)) add("tani","title","Title","An animal in the title","Animals in the title",m.i);
    // IMDb tiers
    if(m.rating>=8.5) add("i85","imdb","IMDb rating","8.5 or higher","IMDb 8.5 or higher",m.i);
    else if(m.rating>=8.0) add("i80","imdb","IMDb rating","8.0 to 8.4","IMDb 8.0 to 8.4",m.i);

    if(m.dirs.some(d=>m.fullKeys.has(norm(d)))) add("dstar","maker","Behind the camera","Director also acts in it","Directed by one of its own cast",m.i);

    const c = m.cast.slice(0,5);
    for(let i=0;i<c.length;i++) for(let j=i+1;j<c.length;j++){ const k = [c[i],c[j]].sort().join("|"); if(!pairCount.has(k)) pairCount.set(k,[]); pairCount.get(k).push(m.i); }
    m.dirs.forEach(d=>c.forEach(a=>{ if(norm(a)===norm(d)) return; const k = d+"|"+a; if(!dirCount.has(k)) dirCount.set(k,[]); dirCount.get(k).push(m.i); }));

  const seenSets = new Map();
  const consider = (ids, make) => { if(ids.length<4) return; const key = ids.slice().sort((a,b)=>a-b).join(","); if(!seenSets.has(key)) seenSets.set(key, make); };
  pairCount.forEach((ids,k)=>consider(ids, ()=>{ const [a,b] = k.split("|"); ids.forEach(i=>add("p:"+k,"combo","Co-stars",`${a} & ${b}`,`${a} & ${b} together`,i)); }));
  dirCount.forEach((ids,k)=>consider(ids, ()=>{ const [d,a] = k.split("|"); ids.forEach(i=>add("da:"+k,"combo","Director + star",`${d} directing ${a}`,`${d} directing ${a}`,i)); }));
  seenSets.forEach(make=>make());
  const cats = [...map.values()];

  cats.forEach(c=>{ c.fset = c.type==="actor" ? new Set(MOVIES.filter(m=>m.fullKeys.has(norm(c.label))).map(m=>m.i)) : c.set; });

const CATS = buildCats();

/* ---------- RNG ---------- */
function rng(seed){ let a = Math.imul((seed ^ (seed>>>16)) >>> 0, 0x45d9f3b) ^ 0x9E3779B9; a = Math.imul(a ^ (a>>>13), 0x27d4eb2d) >>> 0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const R = Math.random;
function pick(arr,r=R){ return arr[Math.floor(r()*arr.length)]; }
function shuffle(arr,r=R){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- Grid levels ---------- */
const TIERS = [
  { key:"easy",   name:"Easy",   from:1,  to:30, min:3, person:{director:6, actor:6}, types:["director","actor","decade","genre","oscar","imdb","maker","title"], maxPeople:3 },
  { key:"medium", name:"Medium", from:31, to:60, min:2, person:{director:4, actor:5}, types:["director","actor","decade","genre","oscar","sequel","title","imdb","maker","combo"], maxPeople:4 },
  { key:"hard",   name:"Hard",   from:61, to:90, min:1, person:{director:4, actor:4}, types:["director","actor","decade","genre","oscar","sequel","title","imdb","maker","combo"], minPeople:4 },
];
const LEVEL_COUNT = 90;
const tierOf = n => TIERS.find(t=>n>=t.from && n<=t.to);
function inter(a,b){ const out=[]; for(const x of a.fset) if(b.fset.has(x)) out.push(x); return out; }
function hasMatching(cells){
  const owner = new Map();
  const tryCell = (ci, seen) => {
    for(const m of cells[ci]){ if(seen.has(m)) continue; seen.add(m);
      if(!owner.has(m) || tryCell(owner.get(m), seen)){ owner.set(m, ci); return true; } }
    return false;
  };
  return cells.every((_,ci)=>tryCell(ci,new Set()));
}
const levelCache = {};
function gridPool(t){
  return CATS.filter(c=>{
    if(!t.types.includes(c.type)) return false;
    if(c.type==="director"||c.type==="actor") return c.set.size >= t.person[c.type];
    if(c.type==="combo") return c.set.size >= 4;
    return c.set.size >= 6;
  });
}
// How often each kind of category shows up, by grid style (higher = more often)
const KIND_W = {
  classic: { actor:5, director:2, genre:1.2, decade:.4, oscar:.6, sequel:.6, imdb:1, title:1, maker:.8, combo:.5 },
  mixed:   { actor:3, director:1, genre:.7, decade:.2, oscar:1.2, sequel:1, imdb:2, title:2, maker:1.6, combo:1.4 },
  costars: { actor:1 },
};
const COL_W = { costars: { actor:3, imdb:1, title:.6, maker:.6, genre:.5, decade:.2, oscar:.5, sequel:.5 } };
const TRIVIA = new Set(["imdb","maker","title","oscar","sequel","combo"]);
const GRID_STYLES = ["costars","mixed","mixed","classic"];
const poolCache = {};
function poolByKind(t){
  if(poolCache[t.key]) return poolCache[t.key];
  const by = {}; gridPool(t).forEach(c=>{ (by[c.type] = by[c.type] || []).push(c); });
  return poolCache[t.key] = by;
}
// Choose a kind by weight, then the freshest of a small random sample of that kind
function pickCat(by, weights, r, pen, taken){
  const kinds = Object.keys(weights).filter(k=>by[k] && by[k].length);
  const total = kinds.reduce((a,k)=>a+weights[k],0);
  let x = r()*total, kind = kinds[kinds.length-1];
  for(const k of kinds){ x -= weights[k]; if(x<=0){ kind = k; break; } }
  const arr = by[kind]; let best = null, bs = Infinity;
  for(let i=0;i<14;i++){ const c = arr[Math.floor(r()*arr.length)]; if(taken.has(c)) continue; const sc = (pen ? pen(c) : 0) + r()*40; if(sc<bs){ bs=sc; best=c; } }
  return best;
}
function buildGrid(t, r, pen, style){
  style = style || GRID_STYLES[Math.floor(r()*GRID_STYLES.length)];
  if(style==="costars" && t.key==="easy") style = "mixed";
  const by = poolByKind(t), allowed = new Set(t.types);
  const filt = w => Object.fromEntries(Object.entries(w).filter(([k])=>allowed.has(k)));
  const rowW = filt(KIND_W[style]), colW = filt(COL_W[style] || KIND_W[style]);
  const isPerson = c => c.type==="director"||c.type==="actor";
  const cap = { decade:1, genre:2, title:1, imdb:1, maker:1, combo:1, oscar:1, sequel:1 };
  for(let attempt=0; attempt<700; attempt++){
    const taken = new Set(), rows = [], cols = [];
    if(style==="costars"){
      // Build around one actor and three of their frequent co-stars, so actor × actor squares work
      const hub = pickCat(by, {actor:1}, r, pen, taken); if(!hub) continue;
      const mates = by.actor.filter(a=>a!==hub && inter(a,hub).length>=t.min);
      if(mates.length<3) continue;
      History.freshOrder(mates, c=>(pen?pen(c):0), 60, r).slice(0,3).forEach(c=>{ taken.add(c); rows.push(c); });
      taken.add(hub); cols.push(hub);
    } else {
      while(rows.length<3){ const c = pickCat(by, rowW, r, pen, taken); if(!c) break; taken.add(c); rows.push(c); }
    }
    if(rows.length<3) continue;
    for(let tries=0; tries<40 && cols.length<3; tries++){
      const c = pickCat(by, colW, r, pen, taken); if(!c) continue;
      if(rows.every(rw=>inter(rw,c).length>=t.min)){ taken.add(c); cols.push(c); }
    }
    if(cols.length<3) continue;
    const six = rows.concat(cols);
    const people = six.filter(isPerson).length;
    if(style!=="costars" && t.maxPeople!=null && people>t.maxPeople) continue;
    if(t.minPeople!=null && people<t.minPeople) continue;
    if(Object.entries(cap).some(([k,n])=>six.filter(c=>c.type===k).length>n)) continue;
    if(style==="costars" && cols.filter(c=>c.type==="actor").length<1) continue;
    if(style==="mixed" && six.filter(c=>TRIVIA.has(c.type)).length<2) continue;
    const cells = [];
    for(const rw of rows) for(const cl of cols) cells.push(inter(rw,cl));
    if(!hasMatching(cells)) continue;

}
function makeLevel(n){
  if(levelCache[n]) return levelCache[n];
  const t = tierOf(n);
  for(let salt=0; salt<40; salt++){
    const g = buildGrid(t, rng(n*7919 + salt*104729 + 17), null);
    if(g) return levelCache[n] = { n, ...g };
  }
  return null;
}
function makeFreshGrid(tierKey){
  const t = TIERS.find(x=>x.key===tierKey);
  for(let i=0;i<20;i++){ const g = buildGrid(t, Math.random, History.catPenalty); if(g) return { n:null, ...g }; }
  return makeLevel(t.from + Math.floor(Math.random()*30));
}

/* ---------- Connections generator ---------- */
function makeConnections(){
  const short = m => m.title.length <= 34;
  const by = {};
  CATS.forEach(c=>{
    let k = c.type;
    if(k==="director"){ if(c.set.size<4) return; }
    else if(k==="actor"){ if(c.set.size<5) return; }
    else if(k==="genre"){ if(!["an","su","we","mu","sp","ho"].includes(c.id.slice(2))) return; }
    else if(!["decade","oscar","sequel","imdb","maker","title","combo"].includes(k)) return;
    if(k==="oscar"||k==="sequel") k = "award";
    (by[k] = by[k] || []).push(c);
  });
  const TRIV = ["combo","combo","imdb","imdb","title","title","maker","maker","award"];
  for(let attempt=0; attempt<600; attempt++){
    // Recipe: 2–3 trivia groups, 1–2 people, sometimes a genre, rarely a decade
    const triv = [...new Set(shuffle(TRIV))].slice(0, Math.random()<.5 ? 2 : 3);
    const kinds = triv.slice();
    const extra = Math.random();
    if(kinds.length<4) kinds.push(extra<.12 && by.decade ? "decade" : extra<.35 ? "genre" : Math.random()<.5 ? "actor" : "director");
    while(kinds.length<4) kinds.push(Math.random()<.65 ? "actor" : "director");
    const four = [];
    for(const k of kinds){
      const pool = (by[k]||[]).filter(c=>!four.includes(c));
      if(!pool.length) break;
      four.push(History.fresh(pool, History.catPenalty, 30, 20));
    }
    if(four.length<4) continue;
    const groups = [];
    let ok = true;
    for(const c of four){
      // a film can only belong to its own group, counting any credited role
      const only = [...c.set].filter(i=>short(MOVIES[i]) && four.every(o=>o===c || !o.fset.has(i)));
      if(only.length<4){ ok=false; break; }
      groups.push({ cat:c, films: History.freshOrder(only, i=>History.filmPenalty(MOVIES[i]), 40).slice(0,4) });
    }
    if(ok) return shuffle(groups);
  }
  return null;
}

/* ---------- Timeline generator ---------- */
function makeTimeline(){
  for(let a=0;a<50;a++){
    const order = History.freshOrder(MOVIES, History.filmPenalty, 40);
    const five = [], dirs = new Set(), gen = {};
    for(const m of order){
      if(five.some(f=>Math.abs(f.year-m.year)<3)) continue;
      if(m.dirs.some(d=>dirs.has(d))) continue;
      const g = genresOf(m)[0] || "drama"; if((gen[g]||0)>=2) continue;
      five.push(m); m.dirs.forEach(d=>dirs.add(d)); gen[g]=(gen[g]||0)+1;
      if(five.length===5) return five;
    }
  }
  return shuffle(MOVIES).slice(0,5);
}

/* ---------- Variety: remembers what came up recently and steers picks away from it ---------- */
const History = (()=>{
  const KEY = "marquee-history-v1";
  const LIM = { films:250, actors:80, dirs:40, genres:10, cats:60 };
  let h = null;
  try { h = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  h = Object.assign({ films:[], actors:[], dirs:[], genres:[], cats:[] }, h||{});
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(h)); } catch(e){} };
  function push(kind, vals){
    vals.forEach(v=>{ const a = h[kind], i = a.indexOf(v); if(i>-1) a.splice(i,1); a.push(v); });
    if(h[kind].length > LIM[kind]) h[kind] = h[kind].slice(-LIM[kind]);
  }
  // recency in [0,1]: 1 = just seen, 0 = never / long ago
  const recency = (kind, v) => { const a = h[kind], i = a.lastIndexOf(v); return i<0 ? 0 : (i+1)/a.length; };
  const mainGenre = m => genresOf(m)[0] || "drama";
  function filmPenalty(m){
    let p = 0;
    const f = recency("films", m.i); if(f) p += 80 + 120*f;
    m.dirs.forEach(d=>{ const r = recency("dirs", d); if(r) p += 15 + 45*r; });
    m.cast.slice(0,3).forEach(a=>{ const r = recency("actors", a); if(r) p += 8 + 30*r; });
    p += h.genres.slice(-3).filter(g=>g===mainGenre(m)).length * 14;
    return p;
  }
  const actorPenalty = a => { const r = recency("actors", a); return r ? 25 + 60*r : 0; };
  const catPenalty = c => {
    let p = 0; const r = recency("cats", c.id); if(r) p += 30 + 70*r;
    if(c.type==="actor"){ const a = recency("actors", c.label); if(a) p += 10 + 30*a; }
    if(c.type==="director"){ const d = recency("dirs", c.label); if(d) p += 10 + 30*d; }
    return p;
  };
  // Pick the freshest of a random sample, with jitter so it never feels deterministic
  function fresh(arr, pen, sample=50, jitter=12){
    let best = null, bs = Infinity;
    const n = Math.min(sample, arr.length*2);
    for(let i=0;i<n;i++){ const c = arr[Math.floor(Math.random()*arr.length)]; const s = pen(c) + Math.random()*jitter; if(s<bs){ bs=s; best=c; } }
    return best;
  }
  // Order a whole list freshest-first (with jitter)
  const freshOrder = (arr, pen, jitter=25, r=Math.random) => arr.map(c=>[pen(c)+r()*jitter, c]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  function noteFilms(ids){
    ids.forEach(i=>{ const m = MOVIES[i]; push("films",[i]); push("dirs", m.dirs); push("actors", m.cast.slice(0,2)); push("genres",[mainGenre(m)]); });
    save();
  }
  const noteActors = a => { push("actors", a); save(); };
  const noteCats = cs => { push("cats", cs.map(c=>c.id)); cs.forEach(c=>{ if(c.type==="actor") push("actors",[c.label]); if(c.type==="director") push("dirs",[c.label]); }); save(); };
  return { filmPenalty, actorPenalty, catPenalty, fresh, freshOrder, noteFilms, noteActors, noteCats };
})();

  function hat(t){ noise(t, .05, bus, .035, "highpass", 7500); }
  function bell(n, t){ osc("sine", midi(n), t, 1.6, bus, .035); osc("sine", midi(n)*2.01, t, .7, bus, .012); }
  function tick_(){
    while(nextT < ac.currentTime + .2){
      const bar = Math.floor(step/8), e = step % 8, ch = PROG[bar % 4];
      if(e === 0) pad(ch, nextT, eighth()*8);
      bass(ch.b + (e===3 || e===7 ? 12 : 0), nextT, e===0 ? 1 : .7);
      if(intensity){ if(e % 2 === 0) kick(nextT, e===0 ? 1 : .7); else hat(nextT); }
      else if(e === 0 || e === 4) kick(nextT, .55);
      if(e === 0 && bar % 2 === 0) bell(ch.p[(bar/2) % 3] + 24, nextT);
      if(intensity && e === 6) bell(ch.p[2] + 24, nextT);
      nextT += eighth(); step++;
    }
  }
  function startMusic(){
    stopMusic(0);
    if(mode() !== "all") return;
    const c = ctx(); if(!c) return;
    intensity = 0; step = 0;
    busFilter = c.createBiquadFilter(); busFilter.type = "lowpass"; busFilter.frequency.value = 1500;
    bus = c.createGain(); bus.gain.setValueAtTime(0.0001, c.currentTime); bus.gain.exponentialRampToValueAtTime(1, c.currentTime + 1.2);
    bus.connect(busFilter); busFilter.connect(master);
    nextT = c.currentTime + .08;
    tick_(); sched = setInterval(tick_, 40);
  }
  function stopMusic(fade = .8){
    if(sched){ clearInterval(sched); sched = null; }
    if(bus && ac){
      const b = bus, f = busFilter, t = ac.currentTime;
      b.gain.cancelScheduledValues(t); b.gain.setValueAtTime(Math.max(.0001, b.gain.value), t); b.gain.exponentialRampToValueAtTime(.0001, t + Math.max(.02, fade));

  }
  const fxOn = () => mode() !== "off" && ctx();
  function halfway(){
    intensity = 1;
    if(busFilter){ busFilter.frequency.setTargetAtTime(4200, ac.currentTime, .6); }
    if(!fxOn()) return;
    const t = ac.currentTime + .02;
    const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(75, t); o.frequency.exponentialRampToValueAtTime(34, t+1.1); env(g, t, .6, .004, 0, 1.8); o.connect(g); g.connect(master); o.start(t); o.stop(t+2);
    const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.setValueAtTime(4500, t); f.frequency.exponentialRampToValueAtTime(500, t+2.2); f.connect(master);
    [52,59,64,67,76].forEach(n=>osc("sawtooth", midi(n), t, 2.4, f, .05, .01));

  }
  function tick(n){
    if(!fxOn()) return;

  function buzzer(){
    stopMusic(.15);

  }
  function setMuted(m){ store.setup.muted = m; saveStore(); if(master && ac) master.gain.setTargetAtTime(m ? 0 : .55, ac.currentTime, .05); }

    unlock(); if(mode() === "off" || !ac) return;
    const prev = store.setup.sound; startMusic();
    setTimeout(halfway, 2500); setTimeout(()=>tick(2), 5000); setTimeout(()=>tick(1), 6000); setTimeout(buzzer, 7000);
  }
  return { unlock, startMusic, stopMusic, halfway, tick, buzzer, setMuted, preview };
})();

function recordMatch(){
  if(match.recorded) return;
  const date = new Date().toLocaleDateString(undefined,{month:"short", day:"numeric"});
  const top = Math.max(...match.players.map(p=>p.score));
  match.newIds = match.players.map((p,i)=>{
    const id = Date.now()+"-"+i;
    store.leaderboard.push({ id, name:p.name, score:p.score, label:modeLabel(match.opts), players:match.players.length, date, won: match.players.length>1 && p.score===top });
    return id;
  });
  store.leaderboard.sort((a,b)=>b.score-a.score);
  store.leaderboard = store.leaderboard.slice(0,50);
  match.recorded = true;
  saveStore(); saveMatch();
}
