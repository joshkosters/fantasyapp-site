function startMatch(){
  const s = store.setup;
  match = {
    players: Array.from({length:s.count},(_,i)=>({ name:s.names[i]||"Player "+(i+1), score:0, log:[] })),
    opts: { mode:s.mode, rounds:s.rounds, target:s.target, timer:s.timer, hints:s.hints, games:s.games.slice() },
    turn:0, round:1, done:false, recorded:false,
  };
  saveMatch(); showBoard();
}

/* ---------- Board ---------- */
function wheelSVG(ids){
  const cx=150, cy=150, r=146, n=ids.length, step=360/n;
  const pt = (a,rad) => [cx + rad*Math.sin(a*Math.PI/180), cy - rad*Math.cos(a*Math.PI/180)];
  let s = `<svg class="wheel" id="wheel" viewBox="0 0 300 300" role="img" aria-label="Game wheel" style="transform:rotate(${wheelRot}deg)"><circle cx="150" cy="150" r="149" style="fill:var(--ink)"/>`;
  ids.forEach((id,i)=>{
    const g = gameById(id), c = GAMES.indexOf(g)+1;
    const a0=i*step, a1=a0+step, [x0,y0]=pt(a0,r), [x1,y1]=pt(a1,r), mid=a0+step/2, large = step>180?1:0;
    s += `<path d="M150,150 L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" style="fill:var(--w${c});stroke:var(--ink);stroke-width:2"/>`;
    s += `<text x="150" y="${150-92}" text-anchor="middle" dominant-baseline="middle" transform="rotate(${mid} 150 150)" style="fill:var(--wt${c})">${esc(g.short)}</text>`;
  });
  for(let i=0;i<20;i++){ const [x,y]=pt(i*18,138); s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" style="fill:var(--accent)"/>`; }
  s += `<circle cx="150" cy="150" r="26" style="fill:var(--paper);stroke:var(--ink);stroke-width:3"/><text x="150" y="151" text-anchor="middle" dominant-baseline="middle" style="fill:var(--ink);font-size:13px">SPIN</text></svg>`;
  return s;
}
function boardHTML(currentIdx){
  const max = Math.max(1, ...match.players.map(p=>p.score), match.opts.mode==="target"?match.opts.target:0);
  return `<div class="board">${match.players.map((p,i)=>`<div class="prow ${i===currentIdx?"up":""}"><span class="pdot" style="background:${PCOL[i]}"></span><div class="grow"><div class="row between"><span class="nm">${esc(p.name)}</span>${i===currentIdx?`<span class="tag2">Up now</span>`:""}</div><div class="bar"><i style="width:${Math.round(p.score/max*100)}%"></i></div></div><span class="sc">${p.score}</span></div>`).join("")}</div>`;
}
function roundLabel(){
  const o = match.opts;
  return o.mode==="rounds" ? `Round ${match.round} of ${o.rounds}` : `Round ${match.round} · first to ${o.target}`;
}
function showBoard(){
  setTheme(null); stopTimer(); closeSheet(); inTurn = false;
  if(!match) return showMenu();
  if(match.done) return showFinal();
  const p = match.players[match.turn];
  $("view").innerHTML = `<div class="stack">
    <div class="row between"><span class="sec-title">${esc(roundLabel())}</span><span class="pill">${esc(timerLabel(match.opts.timer))}</span></div>
    ${boardHTML(match.turn)}
    <div class="wheelbox"><div class="pointer" aria-hidden="true"></div>${wheelSVG(match.opts.games)}</div>
    <div class="landed" id="landed" aria-live="polite"></div>
    <div class="row" style="justify-content:center"><button class="btn primary big" id="spinBtn" type="button">${esc(p.name)}, spin the wheel</button></div>
    <div class="row" style="justify-content:center"><span class="confirm" id="endWrap"><button class="linkbtn" id="toMenu" type="button">Menu</button> · <button class="linkbtn" id="endGame" type="button">End game now</button></span></div>
  </div>`;
  $("spinBtn").onclick = spin; $("wheel").addEventListener("click", spin); $("wheel").style.cursor = "pointer";
  $("toMenu").onclick = showMenu;
  $("endGame").onclick = ()=>{
    $("endWrap").innerHTML = `End now and score the game as it stands? <button class="btn" id="endYes" type="button">End game</button><button class="linkbtn" id="endNo" type="button">Keep playing</button>`;
    $("endYes").onclick = ()=>{ match.done = true; saveMatch(); showFinal(); };
    $("endNo").onclick = showBoard;
  };
}
function spin(){
  if(spinning) return;
  spinning = true; $("spinBtn").disabled = true; Sound.unlock();
  const ids = match.opts.games, step = 360/ids.length;
  const idx = Math.floor(Math.random()*ids.length);
  const center = idx*step + step/2 + (Math.random()-.5)*step*.6;
  const target = (360 - center) % 360, cur = ((wheelRot % 360) + 360) % 360;
  wheelRot += 360*5 + ((target - cur + 360) % 360);
  $("wheel").style.transform = `rotate(${wheelRot}deg)`;
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(()=>{
    $("landed").textContent = gameById(ids[idx]).name; setTheme(ids[idx]);
    setTimeout(()=>{ spinning = false; launch(ids[idx], "match"); }, 900);
  }, reduce ? 450 : 3500);
}
function advanceTurn(){
  match.turn++;
  if(match.turn >= match.players.length){
    match.turn = 0;
    const o = match.opts;
    if(o.mode==="rounds" && match.round >= o.rounds) match.done = true;
    else if(o.mode==="target" && (match.players.some(p=>p.score>=o.target) || match.round>=40)) match.done = true;
    else match.round++;
  }
  saveMatch();
}

/* ---------- Final ---------- */
function showFinal(){
  setTheme(null); stopTimer(); closeSheet(); inTurn = false;
  recordMatch();
  const ranked = match.players.map((p,i)=>({...p,i})).sort((a,b)=>b.score-a.score);
  const top = ranked[0].score, winners = ranked.filter(p=>p.score===top);
  const head = match.players.length===1 ? `${esc(ranked[0].name)} scored ${top}` : winners.length>1 ? `Tie: ${winners.map(w=>esc(w.name)).join(" & ")}` : `${esc(winners[0].name)} wins`;
  const rank = store.leaderboard.findIndex(r=>match.newIds.includes(r.id));
  $("view").innerHTML = `<div class="stack">
    <div class="winner"><span class="eyebrow">Final curtain · ${esc(modeLabel(match.opts))}</span><span class="disp">${head}</span>${rank>-1 && rank<10 ? `<span class="hint">${rank===0?"A new top score on the leaderboard.":"Made the leaderboard at #"+(rank+1)+"."}</span>`:""}</div>
    <div class="board">${ranked.map((p,n)=>`<div class="prow ${p.score===top?"up":""}"><span class="pdot" style="background:${PCOL[p.i]}"></span><div class="grow"><div class="row between"><span class="nm">${n+1}. ${esc(p.name)}</span></div><span class="hint">${p.log.map(l=>`${esc(gameById(l.game).short)} +${l.pts}`).join(" · ")||"No turns played"}</span></div><span class="sc">${p.score}</span></div>`).join("")}</div>
    <div class="row"><button class="btn primary" id="again" type="button">Rematch</button><button class="btn" id="menuBtn" type="button">Change setup</button></div>
    <div class="stack" style="gap:10px"><span class="sec-title">Leaderboard</span>${lbHTML(match.newIds)}</div>
  </div>`;
  $("again").onclick = ()=>{ store.setup.count = match.players.length; match.players.forEach((p,i)=>store.setup.names[i]=p.name); Object.assign(store.setup, match.opts); saveStore(); startMatch(); };
  $("menuBtn").onclick = ()=>{ match = null; saveMatch(); showMenu(); };
  window.scrollTo({top:0});
}

/* ---------- Launch & finish ---------- */
function launch(id, mode, opt={}){
  closeSheet(); stopTimer(); setTheme(id);
  const g = gameById(id);
  const inMatch = mode==="match";
  inTurn = inMatch;
  const player = inMatch ? match.players[match.turn] : null;
  const eyebrow = inMatch ? `${esc(player.name)}'s turn · ${esc(roundLabel())}` : "Practice";
  $("view").innerHTML = `<div class="stack"><div class="playhead"><div class="stack" style="gap:2px"><span class="eyebrow">${eyebrow}</span><span class="disp">${esc(g.name)}</span></div><div class="row"><span class="pill timer" id="timerPill" hidden></span><span class="pill" id="ptsPill">Up to 10 pts</span></div></div><div id="gameArea" class="stack"></div><div id="resultArea"></div></div>`;
  window.scrollTo({top:0});
  let finished = false;
  const ctx = {
    mode, area: $("gameArea"), hints: inMatch ? match.opts.hints : true, forceEnd: null,
    pill: t => { const el=$("ptsPill"); if(el) el.textContent = t; },
    finish(pts, msg, extra=[]){
      if(finished) return; finished = true;
      stopTimer(); closeSheet();
      pts = Math.max(0, Math.min(10, Math.round(pts)));
      let btns = [];
      if(inMatch){
        player.score += pts; player.log.push({game:id, pts});
        advanceTurn();
        inTurn = false;
        const nxt = match.done ? null : match.players[match.turn];
        btns.push(`<button class="btn primary" id="rBack" type="button">${match.done ? "See final results" : `Pass to ${esc(nxt.name)}`}</button>`);
      } else {
        btns.push(`<button class="btn primary" id="rAgain" type="button">Play again</button>`, ...extra.map(e=>`<button class="btn" id="${e.id}" type="button">${esc(e.label)}</button>`), `<button class="btn" id="rHome" type="button">Menu</button>`);
      }
      $("resultArea").innerHTML = `<div class="result"><span class="eyebrow">${inMatch ? esc(player.name)+" banks" : "Round score"}</span><div class="score">+${pts}<small> / 10</small></div><p>${msg}</p>${inMatch && match.players.length>1 ? boardHTML(match.done?-1:match.turn) : ""}<div class="row">${btns.join("")}</div></div>`;
      if($("rBack")) $("rBack").onclick = showBoard;
      if($("rAgain")) $("rAgain").onclick = ()=>launch(id, mode, opt);
      if($("rHome")) $("rHome").onclick = showMenu;
      extra.forEach(e=>{ $(e.id).onclick = e.on; });
      ctx.pill(pts + " pts");
      setTimeout(()=>$("resultArea").scrollIntoView({behavior:"smooth", block:"nearest"}), 50);
    }
  };
  ({grid:GridGame, mystery:MysteryGame, cast:CastGame, connect:ConnectGame, timeline:TimelineGame, degrees:DegreesGame})[id](ctx, opt);
  const secs = inMatch ? match.opts.timer : 0;
  if(secs){
    let left = secs;
    const half = Math.floor(secs/2);
    const tp = $("timerPill"); tp.hidden = false; tp.textContent = "⏱ " + fmtTime(left);
    Sound.startMusic();
    timerId = setInterval(()=>{
      left--;
      const el = $("timerPill"); if(!el){ stopTimer(); return; }
      el.textContent = "⏱ " + fmtTime(Math.max(0,left)); el.classList.toggle("low", left<=10); el.classList.toggle("half", left<=half && left>10);
      if(left===half) Sound.halfway();
      if(left>=1 && left<=5) Sound.tick(left);
      if(left<=0){ Sound.buzzer(); clearInterval(timerId); timerId = null; closeSheet(); toast("Time’s up."); if(ctx.forceEnd) ctx.forceEnd(); }
    }, 1000);
  }
}

/* ---------- Game 1: Marquee Grid ---------- */
function GridGame(ctx, opt){
  const lv = opt.level ? makeLevel(opt.level) : makeFreshGrid(Math.random()<.5 ? "easy" : "medium");
  const n = lv.n;
  History.noteCats(lv.rows.concat(lv.cols));
  const st = { guesses:9, picks:Array(9).fill(null), wrong:Array.from({length:9},()=>new Set()), over:false };
  const area = ctx.area;
  // Actor squares accept any credited role, not just top billing
  const fits = (c, m) => c.fset.has(m.i);
  const cellAns = [];
  lv.rows.forEach(rw=>lv.cols.forEach(cl=>cellAns.push(MOVIES.filter(m=>fits(rw,m) && fits(cl,m)).map(m=>m.i))));
  const head = (c,cls) => { const longest = Math.max(...c.label.split(/\s+/).map(w=>w.length)); const sz = longest>6 || c.label.length>14 ? " long" : ""; return `<div class="head ${cls}"><span class="eyebrow">${esc(c.eyebrow)}</span><span class="catval${sz}">${esc(c.label)}</span></div>`; };
  const filled = () => st.picks.filter(x=>x!=null).length;
  function end(){
    st.over = true;
    const s = filled();
    if(n && (store.gridBest[n]==null || s>store.gridBest[n])){ store.gridBest[n] = s; saveStore(); }
    History.noteFilms(st.picks.filter(x=>x!=null));
    render();
    const msg = s===9 ? "A perfect grid. Nine squares and a bonus point." : `You filled ${s} of 9 squares. Tap a red square to see what would have fit.`;
    const extra = ctx.mode!=="match" && n && n<LEVEL_COUNT ? [{id:"rNextLv", label:`Level ${n+1} →`, on:()=>launch("grid","practice",{level:n+1})}] : [];
    ctx.finish(s + (s===9?1:0), msg, extra);
  }
  function render(){
    let h = `<div class="row between"><div class="row"><span class="disp" style="font-size:1.3rem">${n ? "Level "+n : "Fresh grid"}</span><span class="tier ${lv.tier.key}">${lv.tier.name}</span></div>
      <div class="punches" aria-label="${st.guesses} guesses left"><span class="lbl">Guesses</span>${Array.from({length:9},(_,i)=>`<span class="hole ${i>=st.guesses?"used":""}"></span>`).join("")}</div></div>
      <div class="grid"><div class="corner"><span>${n ? "No. "+String(n).padStart(3,"0") : "3 × 3"}</span></div>${lv.cols.map(c=>head(c,"col")).join("")}`;
    lv.rows.forEach((rw,ri)=>{
      h += head(rw,"rowh");
      lv.cols.forEach((cl,ci)=>{
        const k=ri*3+ci, p=st.picks[k], total=cellAns[k].length;
        if(p!=null){ const m=MOVIES[p]; h += `<button class="cell filled" data-k="${k}" type="button"><span class="t">${esc(m.title)}</span><span class="y">${m.year}</span><span class="rar">${total===1?"Only answer":"1 of "+total}</span></button>`; }
        else if(st.over) h += `<button class="cell missed" data-k="${k}" type="button"><span class="miss">See ${total} answer${total>1?"s":""}</span></button>`;
        else h += `<button class="cell" data-k="${k}" type="button" aria-label="Guess for ${esc(rw.label)} and ${esc(cl.label)}"><span class="plus">+</span></button>`;
      });
    });
    h += `</div>`;
    if(!st.over) h += `<p class="hint">Tap a square and name a movie that fits both its row and column. Any credited role counts for actors. Each movie works once. 9 guesses; a wrong one costs a guess.</p><div class="row"><button class="btn" id="giveUp" type="button">Give up</button></div>`;
    area.innerHTML = h;
    area.querySelectorAll(".cell").forEach(b=>b.onclick = ()=>{ const k=+b.dataset.k; (st.over||st.picks[k]!=null) ? answers(k) : ask(k); });
    if($("giveUp")) $("giveUp").onclick = end;
  }
  const pair = k => `<div class="pair"><span class="chip">${esc(lv.rows[Math.floor(k/3)].label)}</span><span class="x">×</span><span class="chip">${esc(lv.cols[k%3].label)}</span></div>`;
  function ask(k){
    const used = new Set(st.picks.filter(x=>x!=null));
    const p = document.createElement("div"); p.innerHTML = pair(k);
    const sb = searchBox(m=>guess(k,m), m=> used.has(m.i) ? "Used" : st.wrong[k].has(m.i) ? "Tried" : null);
    openSheet("Name a movie", [p.firstElementChild, sb]); sb.focusInput();
  }
  function answers(k){
    const list = cellAns[k].map(i=>MOVIES[i]).sort((a,b)=>a.year-b.year);
    const d = document.createElement("div"); d.className="list";
    d.innerHTML = list.map(m=>`<div class="ans ${m.i===st.picks[k]?"mine":""}"><span>${esc(m.title)}${m.i===st.picks[k]?" ✓":""}</span><span class="oy">${m.year}</span></div>`).join("");
    const p = document.createElement("div"); p.innerHTML = pair(k);
    openSheet(`${list.length} possible answer${list.length>1?"s":""}`, [p.firstElementChild, d]);
  }
  function guess(k, m){
    closeSheet(); st.guesses--;
    if(cellAns[k].includes(m.i)){ st.picks[k]=m.i; toast(`${m.title} fits.`); }
    else {
      st.wrong[k].add(m.i);
      const rw=lv.rows[Math.floor(k/3)], cl=lv.cols[k%3], fr=fits(rw,m), fc=fits(cl,m);
      toast(`${m.title} ${fr&&!fc?`fits “${rw.label}” but not “${cl.label}”`:fc&&!fr?`fits “${cl.label}” but not “${rw.label}”`:"doesn’t fit either category"}.`);
    }
    if(filled()===9 || st.guesses===0) return end();
    render();
    const el = area.querySelector(`[data-k="${k}"]`); if(el && st.picks[k]==null){ el.classList.add("shake"); setTimeout(()=>el.classList.remove("shake"),400); }
  }
  ctx.forceEnd = ()=>{ if(!st.over) end(); };
  ctx.pill("1 pt per square");
  render();
}

/* ---------- Game 2: Mystery Movie ---------- */
function MysteryGame(ctx){
  const MAX = 8, HINT_AFTER = 3, MAX_HINTS = 4;
  const target = History.fresh(MOVIES.filter(m=>m.cast.length>=3 && m.rating), History.filmPenalty, 80);
  History.noteFilms([target.i]);
  const st = { guesses:[], hints:[], usedLinks:new Set(), over:false, picking:false };
  const tLead = new Set(target.cast.slice(0,2).map(norm)), tAll = target.fullKeys, tG = genresOf(target);
  const tSuppMain = new Set(target.cast.slice(2).map(norm));
  const decadeTxt = () => decadeOf(target.year)==="pre70" ? "before 1970" : "the "+decadeOf(target.year);
  const dirKnown = () => st.guesses.some(g=>g.dirs.some(d=>target.dirs.includes(d))) || st.hints.some(h=>h.kind==="dir");
  // A different film that shares a cast member with the mystery movie
  function linkFilm(){
    const guessed = new Set(st.guesses.map(g=>g.i));
    const people = target.cast.slice(0,4);   // recognizable names first
    const opts = [];
    people.forEach((a,rank)=>{
      (ACTOR_FILMS.get(a)||[]).forEach(fi=>{
        if(fi===target.i || guessed.has(fi) || st.usedLinks.has(fi)) return;
        const f = MOVIES[fi];
        opts.push({ f, score: rank*3 + (8.6 - (f.rating||6)) + Math.random()*2 });
      });
    });
    opts.sort((a,b)=>a.score-b.score);
    return opts.length ? opts[0].f : null;
  }
  const HINT_TYPES = [
    { kind:"dir",  label:"Director", desc:"Who directed it", avail:()=>!dirKnown(),
      make:()=>`Directed by ${target.dirs.join(" & ")}.` },
    { kind:"link", label:"Shared cast", desc:"Another movie with someone from this cast", avail:()=>!!linkFilm(),
      make:()=>{ const f = linkFilm(); st.usedLinks.add(f.i); return `Someone in the cast also appears in ${f.title} (${f.year}).`; } },
    { kind:"plot", label:()=>st.hints.some(h=>h.kind==="plot") ? "Genre & era" : "Plot", desc:()=>st.hints.some(h=>h.kind==="plot") ? "Its genre and decade" : "A one-line, simplified plot",
      avail:()=>st.hints.filter(h=>h.kind==="plot").length<2,
      make:()=> st.hints.some(h=>h.kind==="plot")
        ? `${tG.length ? "A "+tG.map(t=>GENRES[t].toLowerCase()).join(" / ") : "A drama"} from ${decadeTxt()}.`
        : (target.plot ? `Plot: ${target.plot}` : `${tG.length ? "A "+tG.map(t=>GENRES[t].toLowerCase()).join(" / ") : "A drama"} from ${decadeTxt()}.`) },
  ];
  const val = x => typeof x==="function" ? x() : x;
  function feedback(g){
    const out = [];
    const yd = target.year - g.year;
    out.push({l:"Year", v:`${g.year}${yd>0?" ↑":yd<0?" ↓":""}`, s: yd===0?"hit":Math.abs(yd)<=5?"near":"miss"});
    const dHit = g.dirs.some(d=>target.dirs.includes(d));
    out.push({l:"Director", v:g.dirs.map(d=>target.dirs.includes(d)?`<em>${esc(d)}</em>`:esc(d)).join(", "), s:dHit?"hit":"miss", html:true});
    const lead = g.cast.slice(0,2);
    const leadS = lead.some(a=>tLead.has(norm(a))) ? "hit" : lead.some(a=>tAll.has(norm(a))) ? "near" : "miss";
    out.push({l:"Main cast", v:lead.map(a=>tAll.has(norm(a))?`<em>${esc(a)}</em>`:esc(a)).join(", "), s:leadS, html:true});
    const leadKeys = new Set(lead.map(norm));
    const shared = g.full.filter(a=>!leadKeys.has(norm(a)) && tAll.has(norm(a)));
    const suppS = shared.some(a=>tSuppMain.has(norm(a))) ? "hit" : shared.length ? "near" : "miss";
    out.push({l:"Supporting", v: shared.length ? shared.slice(0,3).map(a=>`<em>${esc(a)}</em>`).join(", ")+(shared.length>3?` +${shared.length-3}`:"") : "No shared names", s:suppS, html:true});
    const gg = genresOf(g), ov = gg.filter(t=>tG.includes(t));
    const same = gg.length===tG.length && ov.length===gg.length;
    out.push({l:"Genre", v: gg.length ? gg.map(t=>tG.includes(t)?`<em>${GENRES[t]}</em>`:GENRES[t]).join(", ") : "—", s: (same && gg.length)?"hit":ov.length?"near":"miss", html:true});
    const rd = Math.round((target.rating - g.rating)*10)/10;
    out.push({l:"IMDb", v:`${g.rating.toFixed(1)}${rd>0?" ↑":rd<0?" ↓":""}`, s: rd===0?"hit":Math.abs(rd)<=0.3?"near":"miss"});
    const gb = g.tags.includes("bp"), tb = target.tags.includes("bp");
    out.push({l:"Best Picture", v: gb?"Won":"Didn’t win", s: gb===tb?"hit":"miss"});
    return out;
  }
  function known(){
    let ylo=1900, yhi=2030, rlo=1, rhi=10; const dirs=new Set(), cast=new Set();
    st.guesses.forEach(g=>{
      if(g.year<target.year) ylo=Math.max(ylo,g.year+1); else if(g.year>target.year) yhi=Math.min(yhi,g.year-1); else { ylo=yhi=g.year; }
      if(g.rating<target.rating) rlo=Math.max(rlo,+(g.rating+0.1).toFixed(1)); else if(g.rating>target.rating) rhi=Math.min(rhi,+(g.rating-0.1).toFixed(1)); else { rlo=rhi=g.rating; }
      g.dirs.forEach(d=>{ if(target.dirs.includes(d)) dirs.add(d); });
      g.full.forEach(a=>{ if(tAll.has(norm(a))) cast.add(a); });
    });
    const yr = ylo===yhi ? String(ylo) : `${ylo===1900?"?":ylo}–${yhi===2030?"?":yhi}`;
    const rt = rlo===rhi ? rlo.toFixed(1) : `${rlo===1?"?":rlo.toFixed(1)}–${rhi===10?"?":rhi.toFixed(1)}`;
    return `<div class="known"><div><span class="eyebrow">Year</span><span>${yr}</span></div><div><span class="eyebrow">IMDb</span><span>${rt}</span></div><div><span class="eyebrow">Director</span><span>${dirs.size?esc([...dirs].join(", ")):"?"}</span></div><div><span class="eyebrow">Cast found</span><span>${cast.size?esc([...cast].join(", ")):"?"}</span></div></div>`;
  }
  const points = () => Math.max(1, 11 - st.guesses.length - st.hints.length);
  function render(){
    const misses = st.guesses.filter(g=>g!==target).length;
    let h = `<div class="row between"><span class="pill">Guess ${Math.min(st.guesses.length+1,MAX)} of ${MAX}</span><div class="legend"><span><i style="background:var(--good-soft);border-color:var(--good)"></i>Match</span><span><i style="background:var(--near-soft);border-color:var(--near)"></i>Close</span><span><i style="border-color:var(--line)"></i>No match</span></div></div>`;
    if(!st.guesses.length) h += `<p class="hint">A movie has been chosen from the library. Guess any film and see which details match: year, director, main and supporting cast, genre, IMDb rating and Best Picture. Arrows point toward the answer. ${ctx.hints ? `After ${HINT_AFTER} misses you can buy hints and choose what kind.` : "Hints are off for this game."}</p>`;
    else h += known();
    if(st.hints.length) h += `<div class="hintbox"><span class="eyebrow">Hints</span>${st.hints.map(x=>`<span>${esc(x.text)}</span>`).join("")}</div>`;
    const canHint = !st.over && ctx.hints && misses>=HINT_AFTER && st.hints.length<MAX_HINTS && HINT_TYPES.some(t=>t.avail());
    if(canHint && st.picking){
      h += `<div class="stack" style="gap:6px"><span class="eyebrow">Choose a hint · costs 1 point</span><div class="hintpick">${HINT_TYPES.map((t,i)=>`<button type="button" class="hp" data-h="${i}" ${t.avail()?"":"disabled"}><b>${esc(val(t.label))}</b><span>${t.avail()?esc(val(t.desc)):"Already known"}</span></button>`).join("")}</div><div class="row"><button class="linkbtn" id="hintCancel" type="button">Never mind</button></div></div>`;
    }
    h += `<div id="sb"></div>`;
    if(canHint && !st.picking) h += `<div class="row"><button class="btn" id="hintBtn" type="button">Take a hint (−1 pt)</button><span class="hint">${MAX_HINTS-st.hints.length} left</span></div>`;
    if(!st.over) h += `<div class="row"><button class="btn" id="giveUp" type="button">Give up</button></div>`;
    h += `<div class="stack" style="gap:8px">${st.guesses.slice().reverse().map(g=>`<div class="guesscard ${g===target?"win":""}"><div class="gt"><b>${esc(g.title)}</b><span class="oy">${g===target?"✓ Correct":""}</span></div><div class="fbs">${feedback(g).map(f=>`<div class="fb s-${f.s}"><span class="fl">${f.l}</span><span class="fv">${f.html?f.v:esc(f.v)}</span></div>`).join("")}</div></div>`).join("")}</div>`;
    ctx.area.innerHTML = h;
    if(!st.over){
      const tried = new Set(st.guesses.map(g=>g.i));
      const sb = searchBox(guess, m=>tried.has(m.i)?"Guessed":null, "Guess a movie…");
      $("sb").replaceWith(sb);
      if(st.guesses.length && !st.picking) sb.focusInput();
    }
    if($("hintBtn")) $("hintBtn").onclick = ()=>{ st.picking = true; render(); };
    if($("hintCancel")) $("hintCancel").onclick = ()=>{ st.picking = false; render(); };
    ctx.area.querySelectorAll(".hp").forEach(b=>b.onclick = ()=>{
      const t = HINT_TYPES[+b.dataset.h]; if(!t.avail()) return;
      st.hints.push({ kind:t.kind, text:t.make() }); st.picking = false;
      ctx.pill(`Worth ${points()} pts`); render();
    });
    if($("giveUp")) $("giveUp").onclick = ()=>finish(false);
  }
  function guess(m){
    st.guesses.push(m); st.picking = false;
    if(m===target) return finish(true);
    if(st.guesses.length>=MAX) return finish(false);
    ctx.pill(`Worth ${points()} pts`);
    render();
  }
  function finish(won){
    const pts = won ? points() : 0;
    st.over = true; st.picking = false; render();
    const n = st.hints.length;
    ctx.finish(pts, won ? `You found <b>${esc(target.title)}</b> (${target.year}) in ${st.guesses.length} guess${st.guesses.length>1?"es":""}${n?` with ${n} hint${n>1?"s":""}`:""}.` : `The mystery movie was <b>${esc(target.title)}</b> (${target.year}), directed by ${esc(target.dirs.join(" & "))}, starring ${esc(target.cast.slice(0,2).join(" and "))}.`);
  }
  ctx.forceEnd = ()=>{ if(!st.over) finish(false); };
  ctx.pill("Worth 10 pts");
  render();
}

/* ---------- Game 3: Cast Reveal ---------- */
function CastGame(ctx){
  const target = History.fresh(MOVIES.filter(m=>m.cast.length>=4), History.filmPenalty, 80);
  History.noteFilms([target.i]);
  const clues = [
    ...target.cast.slice(2).reverse().map(a=>({k:"Supporting", v:a})),
    {k:"Released", v:String(target.year)},
    {k:"Directed by", v:target.dirs.join(" & ")},
    {k:"Co-star", v:target.cast[1]},
    {k:"Top billed", v:target.cast[0]},
  ];
  const st = { shown:1, wrong:new Set(), over:false };
  const points = () => Math.max(2, 11 - st.shown);
  function render(){
    let h = `<p class="hint">Clues start with the smallest roles and build toward the star. Name the movie as early as you can. A wrong guess reveals the next clue.</p><div class="clues">`;
    clues.forEach((c,i)=>{
      const open = i<st.shown || st.over;
      h += `<div class="clue ${open?"":"locked"}"><span class="n">${String(i+1).padStart(2,"0")}</span><span class="k">${open?esc(c.k):"Locked"}</span><span class="v">${open?esc(c.v):""}</span></div>`;
    });
    h += `</div>`;
    if(!st.over) h += `<div id="sb"></div><div class="row"><button class="btn" id="nextClue" type="button" ${st.shown>=clues.length?"disabled":""}>Reveal next clue</button><button class="btn" id="giveUp" type="button">Give up</button></div>`;
    ctx.area.innerHTML = h;
    if(!st.over){
      const sb = searchBox(guess, m=>st.wrong.has(m.i)?"Tried":null, "Which movie is it?");
      $("sb").replaceWith(sb);
      $("nextClue").onclick = ()=>{ st.shown++; ctx.pill(`Worth ${points()} pts`); render(); };
      $("giveUp").onclick = ()=>finish(false);
    }
  }
  function guess(m){
    if(m===target) return finish(true);
    st.wrong.add(m.i);
    if(st.shown>=clues.length){ toast(`Not ${m.title}.`); return finish(false); }
    st.shown++; toast(`Not ${m.title}. Next clue revealed.`);
    ctx.pill(`Worth ${points()} pts`); render();
  }
  function finish(won){
    const pts = won ? points() : 0;
    st.over = true; render();
    ctx.finish(pts, won ? `It’s <b>${esc(target.title)}</b> (${target.year}). You got it with ${st.shown} clue${st.shown>1?"s":""} showing.` : `It was <b>${esc(target.title)}</b> (${target.year}).`);
  }
  ctx.forceEnd = ()=>{ if(!st.over) finish(false); };
  ctx.pill(`Worth ${points()} pts`);
  render();
}

/* ---------- Game 4: Box Office Connections ---------- */
function ConnectGame(ctx){
  const groups = makeConnections();
  History.noteCats(groups.map(g=>g.cat)); History.noteFilms(groups.flatMap(g=>g.films));
  const owner = {}; groups.forEach((g,gi)=>g.films.forEach(f=>owner[f]=gi));
  const st = { tiles: shuffle(groups.flatMap(g=>g.films)), sel:new Set(), solved:[], mistakes:0, over:false, tried:new Set() };
  function render(){
    let h = `<p class="hint">Find four movies that share something: a star, a director, a famous pairing, an IMDb rating range, a title quirk, an Oscar and more. Each group is exactly four. Four mistakes ends the round.</p><div class="solved">`;
    const showGroups = st.over ? [...st.solved, ...groups.map((_,i)=>i).filter(i=>!st.solved.includes(i))] : st.solved;
    showGroups.forEach((gi,idx)=>{ const g=groups[gi]; h += `<div class="grp g${idx%4}" ${st.solved.includes(gi)?"":'style="opacity:.75"'}><b>${esc(g.cat.group)}</b><span>${g.films.map(f=>esc(MOVIES[f].title)).join(" · ")}</span></div>`; });
    h += `</div>`;
    if(!st.over){
      h += `<div class="tiles">${st.tiles.filter(t=>!st.solved.includes(owner[t])).map(t=>`<button class="tile ${st.sel.has(t)?"sel":""}" data-t="${t}" type="button" aria-pressed="${st.sel.has(t)}">${esc(MOVIES[t].title)}</button>`).join("")}</div>
      <div class="row between"><div class="mist">Mistakes left ${Array.from({length:4},(_,i)=>`<i class="${i<st.mistakes?"gone":""}"></i>`).join("")}</div>
      <div class="row"><button class="btn" id="shuf" type="button">Shuffle</button><button class="btn" id="clr" type="button" ${st.sel.size?"":"disabled"}>Deselect</button><button class="btn primary" id="sub" type="button" ${st.sel.size===4?"":"disabled"}>Submit</button></div></div>`;
    }
    ctx.area.innerHTML = h;
    if(st.over) return;
    ctx.area.querySelectorAll(".tile").forEach(b=>b.onclick = ()=>{
      const t=+b.dataset.t;
      if(st.sel.has(t)) st.sel.delete(t); else if(st.sel.size<4) st.sel.add(t);
      render();
    });
    $("shuf").onclick = ()=>{ st.tiles = shuffle(st.tiles); render(); };
    $("clr").onclick = ()=>{ st.sel.clear(); render(); };
    $("sub").onclick = submit;
  }
  function submit(){
    const sel = [...st.sel], key = sel.slice().sort().join(",");
    if(st.tried.has(key)){ toast("You already tried that set."); return; }
    st.tried.add(key);
    const counts = {}; sel.forEach(t=>counts[owner[t]]=(counts[owner[t]]||0)+1);
    const best = Math.max(...Object.values(counts));
    if(best===4){
      const gi = owner[sel[0]]; st.solved.push(gi); st.sel.clear();
      toast(groups[gi].cat.group);
      if(st.solved.length===4) return finish();
    } else {
      st.mistakes++;
      toast(best===3 ? "One away." : "Not a group.");
      if(st.mistakes>=4) return finish();
    }
    ctx.pill(`${st.solved.length*2} pts so far`);
    render();
  }
  function finish(){
    st.over = true; render();
    const pts = st.solved.length*2 + (st.solved.length===4 && st.mistakes===0 ? 2 : 0);
    ctx.finish(pts, st.solved.length===4 ? (st.mistakes===0 ? "All four groups with no mistakes. Bonus 2 points." : `All four groups, with ${st.mistakes} mistake${st.mistakes>1?"s":""}.`) : `You found ${st.solved.length} of 4 groups. The rest are shown above.`);
  }
  ctx.forceEnd = ()=>{ if(!st.over) finish(); };
  ctx.pill("2 pts per group");
  render();
}

/* ---------- Game 6: Six Degrees ---------- */
const ACTOR_FILMS = (()=>{ const m = new Map(); MOVIES.forEach(f=>f.cast.forEach(a=>{ if(!m.has(a)) m.set(a,[]); m.get(a).push(f.i); })); return m; })();
function actorPath(from, to){
  // BFS over actor -> film -> actor; returns [{actor, film}] steps (film = film used to reach actor)
  const prev = new Map([[from, null]]); let q = [from];
  while(q.length){
    const nq = [];
    for(const a of q){
      for(const fi of ACTOR_FILMS.get(a)||[]){
        for(const b of MOVIES[fi].cast){
          if(prev.has(b)) continue;
          prev.set(b, {a, fi});
          if(b===to){ const path=[]; let cur=b; while(prev.get(cur)){ const p=prev.get(cur); path.unshift({actor:cur, film:p.fi}); cur=p.a; } return path; }
          nq.push(b);
        }
      }
    }
    q = nq;
  }
  return null;
}
function makeDegrees(r=R){
  const pool = [...ACTOR_FILMS.entries()].filter(([a,f])=>f.length>=5).map(([a])=>a);
  for(let t=0; t<500; t++){
    const a = History.fresh(pool, History.actorPenalty, 40), b = History.fresh(pool, History.actorPenalty, 40);
    if(a===b) continue;
    const p = actorPath(a,b);
    if(p && p.length>=2 && p.length<=3) return { from:a, to:b, best:p };
  }
}
function DegreesGame(ctx){
  const MAX_LINKS = 10;
  const { from, to, best } = makeDegrees();
  History.noteActors([from, to]);
  const st = { chain:[{actor:from, film:null}], film:null, mistakes:0, over:false, won:false };
  const cur = () => st.chain[st.chain.length-1].actor;
  const links = () => st.chain.length-1;
  const linkPts = n => n<=4 ? 10 : n===5 ? 8 : n===6 ? 6 : 4;
  const points = n => Math.max(1, linkPts(n) - st.mistakes);
  const usedFilms = () => new Set(st.chain.map(c=>c.film).filter(x=>x!=null));
  const usedActors = () => new Set(st.chain.map(c=>norm(c.actor)));
  const toKey = norm(to);
  function chainHTML(chain, final){
    let h = `<div class="clues">`;
    chain.forEach((c,i)=>{
      if(c.film!=null){ const m = MOVIES[c.film]; h += `<div class="clue" style="margin-left:18px;border-style:dashed"><span class="k">via</span><span class="v">${esc(m.title)} <span class="oy">${m.year}</span></span></div>`; }
      h += `<div class="clue" ${i===0||norm(c.actor)===toKey?'style="border-color:var(--accent)"':""}><span class="n">${String(i).padStart(2,"0")}</span><span class="v">${esc(c.actor)}</span></div>`;
    });
    if(!final && st.film!=null){ const m = MOVIES[st.film]; h += `<div class="clue" style="margin-left:18px;border-style:dashed"><span class="k">via</span><span class="v">${esc(m.title)} <span class="oy">${m.year}</span></span></div>`; }
    if(!final) h += `<div class="clue locked"><span class="n">··</span><span class="v">${esc(to)}</span></div>`;
    return h + `</div>`;
  }
  function render(){
    let h = `<div class="pair"><span class="chip">${esc(from)}</span><span class="x">→</span><span class="chip">${esc(to)}</span></div>
      <p class="hint">Link the two actors through movies they appeared in. Name a film the current actor is in (any credited role counts), then pick a co-star from its cast, until you reach ${esc(to)}. Scoring: 4 links or fewer = 10 pts, 5 = 8, 6 = 6, 7 or more = 4. Each wrong film costs 1. The shortest route takes ${best.length}.</p>
      <div class="row between"><span class="pill">${links()} link${links()===1?"":"s"} · max ${MAX_LINKS}</span>${st.mistakes?`<span class="hint">${st.mistakes} wrong film${st.mistakes>1?"s":""}</span>`:""}</div>
      ${chainHTML(st.chain, st.over)}`;
    if(st.over){
      h += `<div class="stack" style="gap:6px"><span class="eyebrow">Shortest route using top-billed stars</span>${chainHTML([{actor:from,film:null}, ...best.map(s=>({actor:s.actor, film:s.film}))], true)}</div>`;
    } else if(st.film==null){
      h += `<div class="stack" style="gap:6px"><span class="eyebrow">Name a movie ${esc(cur())} is in</span><div id="sb"></div></div>`;
    } else {
      const m = MOVIES[st.film], ua = usedActors();
      const lead = m.cast.filter(a=>!ua.has(norm(a))), rest = m.full.slice(m.cast.length).filter(a=>!ua.has(norm(a)));
      const chip = a => `<button type="button" class="costar" data-a="${esc(a)}">${esc(a)}</button>`;
      h += `<div class="stack" style="gap:6px"><span class="eyebrow">Pick a co-star from ${esc(m.title)}</span><div class="seg">${lead.map(chip).join("")}</div>${rest.length?`<span class="eyebrow">Also credited</span><div class="seg minor">${rest.map(chip).join("")}</div>`:""}${lead.length+rest.length?"":`<p class="hint">No new co-stars here. Choose a different film.</p>`}</div>`;
    }
    if(!st.over) h += `<div class="row">${st.film!=null?`<button class="btn" id="dBackFilm" type="button">Choose a different film</button>`:""}${links()>0&&st.film==null?`<button class="btn" id="dUndo" type="button">Undo last link</button>`:""}<button class="btn" id="giveUp" type="button">Give up</button></div>`;
    ctx.area.innerHTML = h;
    if(st.over) return;
    if($("sb")){
      const uf = usedFilms();
      const sb = searchBox(pickFilm, m=>uf.has(m.i)?"Used":null, `Movie with ${cur()}…`);
      $("sb").replaceWith(sb);
    }
    ctx.area.querySelectorAll(".costar").forEach(b=>b.onclick = ()=>pickActor(b.dataset.a));
    if($("dBackFilm")) $("dBackFilm").onclick = ()=>{ st.film = null; render(); };
    if($("dUndo")) $("dUndo").onclick = ()=>{ st.chain.pop(); render(); };
    $("giveUp").onclick = ()=>finish(false);
  }
  function pickFilm(m){
    if(!m.fullKeys.has(norm(cur()))){
      st.mistakes++; toast(`${cur()} isn’t credited in ${m.title}.`);
      ctx.pill(`Worth up to ${points(best.length)} pts`);
      render(); return;
    }
    st.film = m.i; render();
  }
  function pickActor(a){
    st.chain.push({actor:a, film:st.film}); st.film = null;
    if(norm(a)===toKey) return finish(true);
    if(links()>=MAX_LINKS){ toast(`That's the ${MAX_LINKS}-link limit.`); return finish(false); }
    render();
  }
  function finish(won){
    if(st.over) return;
    st.over = true; st.won = won; st.film = null; render();
    const n = links();
    ctx.finish(won ? points(n) : 0, won ? (n<=best.length ? `Connected in ${n} link${n>1?"s":""}, as short as it gets.` : `Connected in ${n} links. The shortest route took ${best.length}.`) : `No connection this time. The shortest route is shown above.`);
  }
  ctx.forceEnd = ()=>finish(false);
  ctx.pill("Up to 10 pts");
  render();
}

/* ---------- Game 5: Reel Timeline ---------- */
function TimelineGame(ctx){
  const films = makeTimeline();
  History.noteFilms(films.map(m=>m.i));
  const correct = films.slice().sort((a,b)=>a.year-b.year);
  const st = { order: shuffle(films), over:false };
  function render(){
    let h = `<p class="hint">Use the arrows to put these movies in release order, oldest at the top. You get one submission and 2 points for each movie in the right spot.</p><div class="axis"><span>Oldest</span></div><div class="tl">`;
    st.order.forEach((m,i)=>{
      const ok = st.over ? correct[i]===m : null;
      h += `<div class="tlrow ${ok===true?"ok":ok===false?"no":""}"><span class="pos">${i+1}</span><span class="tt">${esc(m.title)}</span>${st.over?`<span class="yr">${m.year}</span>`:`<button class="mv" data-i="${i}" data-d="-1" type="button" aria-label="Move ${esc(m.title)} up" ${i===0?"disabled":""}>↑</button><button class="mv" data-i="${i}" data-d="1" type="button" aria-label="Move ${esc(m.title)} down" ${i===st.order.length-1?"disabled":""}>↓</button>`}</div>`;
    });
    h += `</div><div class="axis"><span>Newest</span></div>`;
    if(st.over) h += `<div class="stack" style="gap:4px"><span class="eyebrow">Correct order</span><div class="log">${correct.map((m,i)=>`<div><span>${i+1}. ${esc(m.title)}</span><b>${m.year}</b></div>`).join("")}</div></div>`;
    else h += `<div class="row"><button class="btn primary" id="lock" type="button">Lock in order</button></div>`;
    ctx.area.innerHTML = h;
    ctx.area.querySelectorAll(".mv").forEach(b=>b.onclick = ()=>{
      const i=+b.dataset.i, j=i+(+b.dataset.d); [st.order[i],st.order[j]]=[st.order[j],st.order[i]]; render();
      const again = ctx.area.querySelector(`.mv[data-i="${j}"][data-d="${b.dataset.d}"]`) || ctx.area.querySelector(`.mv[data-i="${j}"]`); if(again) again.focus();
    });
    if($("lock")) $("lock").onclick = lock;
  }
  function lock(){
    if(st.over) return;
    st.over = true; render();
    const right = st.order.filter((m,i)=>correct[i]===m).length;
    ctx.finish(right*2, right===5 ? "Perfect order." : `${right} of 5 in the right spot.`);
  }
  ctx.forceEnd = lock;
  ctx.pill("2 pts per spot");
  render();
}

/* ---------- Grid levels ---------- */
function showLevels(){
  setTheme(null);
  const done = Object.keys(store.gridBest).length, perfect = Object.values(store.gridBest).filter(v=>v===9).length;
  let h = `<div class="stack"><div class="row between"><span class="sec-title">Grid levels</span><button class="btn" id="backHome" type="button">← Menu</button></div><p class="hint">${done} of ${LEVEL_COUNT} played · ${perfect} perfect grids</p>`;
  for(const t of TIERS){
    h += `<div class="stack" style="gap:8px"><div class="row"><span class="disp" style="font-size:1.2rem">${t.name}</span><span class="tier ${t.key}">Levels ${t.from}–${t.to}</span></div><div class="lvgrid">`;
    for(let n=t.from;n<=t.to;n++){ const b=store.gridBest[n]; h += `<button class="lv ${b!=null?"done":""} ${b===9?"perfect":""}" data-n="${n}" type="button" aria-label="Level ${n}${b!=null?", best "+b+" of 9":""}"><b>${n}</b><small>${b!=null?b+"/9":"·"}</small></button>`; }
    h += `</div></div>`;
  }
  $("view").innerHTML = h + `</div>`;
  $("backHome").onclick = showMenu;
  document.querySelectorAll(".lv").forEach(b=>b.onclick = ()=>launch("grid","free",{level:+b.dataset.n}));
}

function syncMute(){ const m = !!store.setup.muted, b = $("muteBtn"); b.textContent = m ? "Sound off" : "Sound on"; b.setAttribute("aria-pressed", String(m)); }
$("muteBtn").onclick = ()=>{ Sound.unlock(); Sound.setMuted(!store.setup.muted); syncMute(); };
syncMute();
$("homeBtn").onclick = ()=>{ if(spinning) return; if(inTurn){ toast("Finish this turn first."); return; } showMenu(); };
if(match && !match.done) showBoard(); else { if(match && match.done){ match = null; saveMatch(); } showMenu(); }
</script>
