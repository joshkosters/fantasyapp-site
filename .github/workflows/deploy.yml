name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # publish only the built site, not the build scripts
      - run: rsync -a --exclude='*.py' --exclude='*.md' --exclude='__pycache__' site/ dist/
      - run: npx --yes wrangler@3 pages deploy dist --project-name=fantasyapp --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bb563a99eb15bf1348a00fd7013134f7
