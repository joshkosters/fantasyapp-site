name: Refresh NASCAR data
# Pulls qualifying, results and laps led from NASCAR's public feeds so the Fantasy NASCAR
# copy-paste page stays current. Runs after race day and can be started by hand from the Actions tab.
on:
  schedule:
    - cron: '30 3 * * 1'   # Sunday night (US Eastern)
    - cron: '0 11 * * 1'   # Monday morning, picks up late-posted results
    - cron: '0 11 * * 2'   # Tuesday morning, final standings
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: nascar-data
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/update_nascar_data.py
      - name: Commit and deploy if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/nascar/data fantasy-nascar/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh NASCAR data"
          git push
          # pushes made with GITHUB_TOKEN do not start the deploy workflow, so start it directly
          gh workflow run deploy.yml
